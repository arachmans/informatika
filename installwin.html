<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simulasi Instalasi Windows 11 — AXIOM VirtualPC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:#08090b;color:#c7cdd6;font-family:'IBM Plex Mono',Consolas,monospace;overflow:hidden;-webkit-user-select:none;user-select:none}
#stage{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:14px}

/* ===== MONITOR ===== */
#monitor{display:flex;flex-direction:column;background:#141519;border:1px solid #26282e;border-radius:14px;padding:13px 13px 0;box-shadow:0 30px 90px rgba(0,0,0,.6),inset 0 1px 0 #2c2f36;width:min(1440px,94vw,calc((100vh - 180px)*1.7))}
#screenwrap{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:6px;overflow:hidden}
#screen{position:absolute;inset:0;background:#000;overflow:hidden}
#screen::before{content:"";position:absolute;inset:0;box-shadow:inset 0 0 110px rgba(0,0,0,.32);pointer-events:none;z-index:200}
#screen.t-bios::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.045) 0 1px,transparent 1px 3px);pointer-events:none;z-index:201}
#screen.offflash{animation:sfade .34s ease forwards}
@keyframes sfade{to{opacity:0}}

/* font/konteks layar */
.t-ui{font-family:'Noto Sans','Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
.t-bios{font-family:'IBM Plex Mono',Consolas,monospace;color:#e8f1f8;background:#1E5D9C}
.t-bios.dark{background:#050607}
.t-black{background:#000;font-family:'Noto Sans','Segoe UI',sans-serif}
.t-desktop{background:#000}

/* ===== BEZEL ===== */
#bezel{height:62px;display:flex;align-items:center;gap:16px;padding:0 10px;font-size:10px;letter-spacing:.1em;text-transform:uppercase}
#brand{line-height:1.6;color:#79808d;white-space:nowrap}
#brand b{color:#e8ecf3;font-weight:600}
#ctrl{display:flex;align-items:center;gap:12px}
.hbtn{width:36px;height:36px;border-radius:50%;background:#1d2026;border:1px solid #31353d;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#9aa3b2;flex:0 0 auto}
.hbtn:hover{border-color:#4ee07f;color:#cfe9d9}
.hbtn svg{width:17px;height:17px}
#btnPower.idle{animation:pw 2.6s ease-in-out infinite}
@keyframes pw{0%,100%{box-shadow:0 0 0 0 rgba(78,224,127,0)}50%{box-shadow:0 0 0 6px rgba(78,224,127,.18);border-color:#4ee07f;color:#4ee07f}}
#port{position:relative;width:46px;height:16px;background:#0b0c0e;border:1px solid #2c3037;border-radius:3px;flex:0 0 auto}
#port::before{content:"";position:absolute;left:8px;top:4px;width:28px;height:7px;background:#000;box-shadow:inset 0 0 3px #000}
#port.need{border-color:#4ee07f;animation:portglow 1.6s ease-in-out infinite}
@keyframes portglow{0%,100%{box-shadow:0 0 4px rgba(78,224,127,.25)}50%{box-shadow:0 0 16px rgba(78,224,127,.75)}}
#usbStub{position:absolute;left:-2px;top:2px;cursor:pointer}
#usbStub:hover{filter:brightness(1.25)}
.led{width:8px;height:8px;border-radius:50%;background:#25272c;flex:0 0 auto}
.led.on{background:#4ee07f;box-shadow:0 0 9px rgba(78,224,127,.65)}
.led.disk{background:#2c1518}
.led.disk.busy{animation:dflick .45s infinite}
@keyframes dflick{0%,100%{background:#32191c}40%{background:#ff5d5d;box-shadow:0 0 10px rgba(255,90,90,.7)}}
#btnReset{background:none;border:1px dashed #3a3f47;color:#79808d;font:inherit;padding:5px 10px;border-radius:4px;cursor:pointer;white-space:nowrap}
#btnReset:hover{color:#ff9d9d;border-color:#7a4a4a}
#hint{flex:1;min-width:0;color:#9fc9a8;font-size:10.5px;line-height:1.55;text-transform:none;letter-spacing:.02em}

/* ===== RAK MEDIA & FLASHDISK ===== */
#shelf{width:min(1440px,94vw,calc((100vh - 180px)*1.7));display:flex;justify-content:space-between;align-items:center;padding:4px 6px 0;gap:16px}
#shelfLabel{font-size:9.5px;color:#565e69;text-transform:uppercase;letter-spacing:.14em;line-height:1.8}
#shelfLabel span{color:#454b54;text-transform:none;letter-spacing:.02em;font-size:9.5px}
#usbSlot{width:94px;height:36px;position:relative;flex:0 0 auto}
#usb{position:absolute;left:0;top:0;cursor:grab;touch-action:none}
#usb:hover{filter:brightness(1.2)}
#usb.fixed{position:fixed;z-index:999;cursor:grabbing}
#usb.anim{transition:left .42s cubic-bezier(.4,.1,.3,1),top .42s cubic-bezier(.4,.1,.3,1)}
#usb.hidden{display:none}

/* ===== LOGO WINDOWS & SPINNER ===== */
.wlogo{display:grid;grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(2,1fr)}
.wlogo i{background:var(--sq,#0067C0);border-radius:11%}
.dots{position:relative;flex:0 0 auto}
.dots i{position:absolute;inset:0;animation:dotspin 1.9s cubic-bezier(.45,.05,.55,.95) infinite}
.dots i:nth-child(2){animation-delay:.13s}.dots i:nth-child(3){animation-delay:.26s}
.dots i:nth-child(4){animation-delay:.39s}.dots i:nth-child(5){animation-delay:.52s}
.dots i:nth-child(6){animation-delay:.65s}
.dots i::after{content:"";position:absolute;top:0;left:50%;width:14%;height:14%;min-width:5px;min-height:5px;margin-left:-3%;border-radius:50%;background:var(--dot,#fff)}
@keyframes dotspin{from{transform:rotate(0)}to{transform:rotate(360deg)}}

/* ===== POST / NO BOOT ===== */
.postlog{position:absolute;top:22px;left:26px;font-size:13px;line-height:2;color:#d6e4f0}
.postlog .pl1{margin-bottom:6px;color:#fff}
.postcenter{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.plogo{font-size:54px;font-weight:600;letter-spacing:.34em;color:#eef5fb;text-indent:.34em}
.psub{font-size:12px;letter-spacing:.28em;color:#a9c3d9;text-indent:.28em}
.postkey{position:absolute;bottom:26px;left:0;right:0;text-align:center;font-size:13px;color:#cfdcee}
.postkey b{color:#fff}
.noboot{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;font-size:16px;line-height:2.1;color:#e8f1f8}
.caret{animation:blink 1.1s step-end infinite}
@keyframes blink{50%{opacity:0}}
.bootmenu{position:absolute;left:44px;top:64px;min-width:390px;background:#000;border:1px solid #7fa8cc;padding:10px}
.bootmenu h5{background:#1E5D9C;color:#fff;font-size:13px;font-weight:600;padding:6px 12px;margin-bottom:8px}
.bmi{padding:8px 14px;font-size:13.5px;color:#e8f1f8;cursor:pointer}
.bmi:hover{background:#1E5D9C}

/* ===== BIOS ===== */
.bios{position:absolute;inset:0;display:flex;flex-direction:column;font-size:13.5px}
.bios-title{text-align:center;padding:9px 0 8px;font-weight:600;border-bottom:2px solid #eef4fa;letter-spacing:.02em}
.bios-tabs{display:flex;gap:2px;padding:7px 12px 0}
.btab{padding:5px 18px;cursor:pointer}
.btab:hover{background:rgba(255,255,255,.13)}
.btab.on{background:#eef4fa;color:#123c63;font-weight:600}
.bios-body{flex:1;margin:0 12px 8px;background:rgba(0,0,0,.16);border:1px solid rgba(255,255,255,.28);padding:8px 10px;overflow-y:auto}
.brow{display:flex;justify-content:space-between;gap:20px;padding:7px 10px;cursor:pointer}
.brow .k{color:#cfe1f1}
.brow .v{color:#fff;white-space:nowrap}
.brow.on{background:#eef4fa}
.brow.on .k,.brow.on .v{color:#123c63;font-weight:600}
.brow.on .k::before{content:"> "}
.brow.act>.v::after{content:" \25B8"}
.brow.hot{animation:bpulse 1.5s ease-in-out infinite}
@keyframes bpulse{0%,100%{background:rgba(255,255,255,.06)}50%{background:rgba(255,255,255,.25)}}
.bios-keys{padding:7px 12px;background:#eef4fa;color:#123c63;font-size:11.5px}
.bios-keys span{font-weight:600;margin-left:12px}
.bios-keys span:first-child{margin-left:0}
.bpop{position:absolute;inset:0;background:rgba(2,12,26,.5);display:flex;align-items:center;justify-content:center;z-index:6}
.bpopbox{background:#1E5D9C;border:1px solid #eef4fa;min-width:380px;max-width:82%;box-shadow:0 12px 44px rgba(0,0,0,.5)}
.bpopbox h5{padding:10px 14px;border-bottom:1px solid rgba(255,255,255,.45);font-size:13.5px;color:#fff;font-weight:600}
.bpopbox .brow{padding:6px 14px}
.bpopbox .brow.cur{background:rgba(255,255,255,.18)}
.bpopbox .brow.cur .k{color:#ffe9a8;font-weight:600}
.bpopfoot{padding:8px 14px;font-size:11px;color:#cfe1f1;border-top:1px solid rgba(255,255,255,.25)}
.bconfirm{padding:16px 16px 4px;color:#fff}
.bbtns{display:flex;gap:10px;padding:12px 16px 16px}
.bpbtn{padding:6px 28px;background:#eef4fa;color:#123c63;font-weight:600;cursor:pointer}
.bpbtn:hover{background:#fff}

/* ===== BOOT WINDOWS ===== */
.bootwrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:38px;background:#000}
.bootlabel{font-size:16px;font-weight:300;color:#fff}
.gettingready{position:absolute;inset:0;display:flex;flex-direction:column;gap:26px;align-items:center;justify-content:center;color:#fff;font-weight:300;font-size:17px}
.restartingwrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#eee;font-size:15px;font-weight:300}
.srrep{position:absolute;inset:0;display:flex;flex-direction:column;gap:22px;align-items:center;justify-content:center;color:#fff;font-size:16px;font-weight:300;text-align:center;padding:20px}
.srrep .mut{font-size:12.5px;color:#b9c3cf;font-family:'IBM Plex Mono',monospace}

/* ===== WINDOWS SETUP ===== */
.t-setup .setup{position:absolute;inset:0;background:linear-gradient(180deg,#35A1E0 0%,#1E7FCC 55%,#156AB4 100%);display:flex;flex-direction:column;align-items:center;overflow-y:auto;padding:22px 12px 28px;color:#1b1b1b}
.setup-logo{margin:0 0 14px}
.setup-card{width:560px;max-width:96%;background:#fff;border-radius:8px;box-shadow:0 18px 60px rgba(0,40,80,.4);padding:26px 30px;position:relative}
.setup-card.wide{width:760px}
.stitle{font-size:20px;font-weight:600;margin-bottom:16px}
.sbody{font-size:14px}
.slabel{display:block;font-size:13px;color:#333;margin:13px 0 6px}
.sfoot{display:flex;justify-content:space-between;align-items:center;margin-top:22px;min-height:36px}
.wbtn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-width:110px;height:33px;background:#0067C0;color:#fff;border:1px solid #0067C0;border-radius:4px;padding:0 22px;font-size:14px;font-family:inherit;cursor:pointer}
.wbtn:hover{background:#0B74CF}
.wbtn:active{background:#005BA1}
.wbtn:disabled{background:#ECECEC;border-color:#ECECEC;color:#9a9a9a;cursor:default}
.wbtn.sec{background:#fff;color:#1b1b1b;border:1px solid #8a8a8a}
.wbtn.sec:hover{background:#F4F4F4}
.wbtn.big{font-size:16px;height:40px;padding:0 46px}
.wlink{color:#0067C0;text-decoration:none;cursor:pointer;font-size:13px}
.wlink:hover{text-decoration:underline;color:#005a9e}
.winput{width:100%;height:36px;border:1px solid #8a8a8a;border-radius:4px;padding:0 12px;font-size:14px;font-family:inherit;background:#fff;box-shadow:inset 0 -1px 0 rgba(0,0,0,.08)}
.winput:focus{border-color:#0067C0;outline:2px solid rgba(0,103,192,.22)}
.winput.mono{font-family:'IBM Plex Mono',monospace;letter-spacing:.06em}
select.winput{appearance:none;background:#fff url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="6" viewBox="0 0 10 6"><path d="M1 1l4 4 4-4" fill="none" stroke="%23606060" stroke-width="1.5"/></svg>') no-repeat right 12px center;cursor:pointer}
.sdesc{font-size:13.5px;color:#444;line-height:1.5;margin-bottom:14px}
.serr{color:#C42B1C;font-size:12.5px;min-height:17px;margin:6px 0}
.installnow{display:flex;flex-direction:column;align-items:center;gap:20px;padding:10px 0 4px}
.starting{display:flex;flex-direction:column;align-items:center;gap:16px;padding:26px 0;color:#444;font-size:14px}
.edrow{border:1px solid #d0d0d0;border-radius:5px;padding:11px 16px;margin-bottom:8px;cursor:pointer}
.edrow:hover{background:#F2F7FB}
.edrow.sel{background:#CFE6F8;border-color:#3399E0}
.edrow b{display:block;font-size:14px}
.edrow span{font-size:12.5px;color:#666}
.eula{height:150px;overflow-y:auto;border:1px solid #d5d5d5;background:#FAFAFA;padding:12px 14px;font-size:12px;line-height:1.65;color:#444;white-space:pre-wrap}
.scheck{display:flex;gap:9px;align-items:center;font-size:13.5px;margin-top:12px;cursor:pointer}
.scheck input{width:16px;height:16px;accent-color:#0067C0}
.insrow{border:1px solid #d0d0d0;border-radius:5px;padding:15px 18px;margin-bottom:10px;cursor:pointer}
.insrow:hover{background:#F2F7FB}
.insrow b{display:block;font-size:14.5px;margin-bottom:4px}
.insrow span{font-size:12.5px;color:#666}
.disktable{border:1px solid #c9c9c9;height:200px;overflow-y:auto;background:#fff}
.drow{display:grid;grid-template-columns:1fr 105px 105px 120px;align-items:center;height:40px;border-bottom:1px solid #e9e9e9}
.drow>span{padding:0 12px;font-size:13px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.drow.head{position:sticky;top:0;height:34px;background:#F3F3F3;z-index:1}
.drow.head>span{font-weight:600;color:#444;font-size:12.5px}
.drow.sel{background:#CFE6F8}
.drow.sel>span:first-child{font-weight:600}
.dtoolbar{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.dtool{border:1px solid #adadad;background:#E1E1E1;border-radius:3px;padding:6px 15px;font-size:12.5px;cursor:pointer;font-family:inherit}
.dtool:hover{background:#CDE6FF;border-color:#0078D4;color:#004a80}
.dtool.dis{opacity:.45;cursor:default;pointer-events:none}
.sizebox{border:1px solid #c9c9c9;padding:14px;margin-top:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sizebox .slabel{margin:0}
.plist{margin-top:4px}
.pitem{display:flex;justify-content:space-between;padding:11px 2px;font-size:14px;border-bottom:1px solid #F0F0F0;color:#3c3c3c}
.pitem.act{color:#000;font-weight:600}
.pitem .st{color:#0067C0;font-weight:600}
.pnote{margin-top:18px;font-size:12.5px;color:#606060;line-height:1.6}
.cmodal{position:absolute;inset:0;background:rgba(0,0,0,.34);display:flex;align-items:center;justify-content:center;z-index:5;border-radius:8px}
.cmodal .cbox{background:#fff;padding:22px 24px;border-radius:8px;box-shadow:0 10px 40px rgba(0,0,0,.4);max-width:430px;font-size:13.5px;line-height:1.55}
.cbbtns{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
.winre{position:absolute;inset:0;background:#13538E;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:20px}
.wrtitle{color:#fff;font-size:26px;font-weight:300;margin-bottom:18px}
.wrrow{width:440px;max-width:94%;background:rgba(255,255,255,.94);border-radius:6px;padding:16px 20px;cursor:pointer;box-shadow:0 4px 18px rgba(0,0,0,.25)}
.wrrow:hover{background:#fff;transform:translateY(-1px)}
.wrrow b{display:block;font-size:15px;color:#1b1b1b}
.wrrow span{font-size:12.5px;color:#5c6b7a}

/* ===== OOBE ===== */
.t-oobe{background:#EEF5FC}
.oobe{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;overflow-y:auto}
.oobe-card{width:560px;max-width:96%;color:#1b1b1b}
.oobe-card h1{font-size:30px;font-weight:600;margin-bottom:12px;color:#222}
.oobe-card .sub{font-size:14.5px;color:#4a4a4a;line-height:1.55;margin-bottom:24px}
.oobe-foot{display:flex;justify-content:space-between;align-items:center;margin-top:24px;min-height:38px}
.bnext{height:36px;min-width:120px;background:#0067C0;color:#fff;border:none;border-radius:4px;font-size:13.5px;padding:0 26px;cursor:pointer;font-family:inherit}
.bnext:hover{background:#0B74CF}
.oblist{border:1px solid #CFDAE6;border-radius:6px;max-height:242px;overflow-y:auto;background:#fff}
.obitem{padding:10px 14px;font-size:13.5px;cursor:pointer;border-bottom:1px solid #F0F4F8}
.obitem:hover{background:#F3F8FD}
.obitem.sel{background:#CFE6F7;font-weight:600}
.wifirow{display:flex;align-items:center;gap:12px;padding:11px 14px;font-size:13.5px;cursor:pointer;border-bottom:1px solid #F0F4F8}
.wifirow:hover{background:#F3F8FD}
.wifirow svg{flex:0 0 auto}
.netstat{padding:10px 14px;font-size:13px}
.sqrow{display:flex;gap:10px;margin-bottom:10px}
.sqrow select{flex:0 0 44%}
.prow{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid #E3EBF3;gap:20px}
.prow .pn{font-size:13.5px;font-weight:600}
.prow .pd{font-size:11.5px;color:#6a7787;margin-top:3px;max-width:360px}
.tog{position:relative;width:40px;height:20px;border-radius:10px;background:#767676;cursor:pointer;transition:background .15s;flex:0 0 auto;border:none}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:#fff;transition:left .15s}
.tog.on{background:#0067C0}
.tog.on::after{left:23px}
.final{position:absolute;inset:0;background:#EEF5FC;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:36px}
.ftext{font-size:18px;font-weight:300;color:#3a4a5a}
.welc{position:absolute;inset:0;background:#0067C0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:32px;color:#fff}
.wt{font-size:34px;font-weight:300}

/* ===== DESKTOP ===== */
.desk{position:absolute;inset:0;font-size:13px}
.wall{position:absolute;inset:0;overflow:hidden}
.wall svg{position:absolute;inset:0;width:100%;height:100%}
.wall.solidbg{background:#1B6FC2}
.icons{position:absolute;inset:0 0 52px 0}
.dicon{position:absolute;width:80px;display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 4px;border-radius:4px;border:1px solid transparent}
.dicon .ic{width:44px;height:44px}
.dicon .ic svg{width:100%;height:100%}
.dicon .lb{font-size:11.5px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.55);text-align:center;word-break:break-word}
.dicon.sel{background:rgba(0,103,192,.35);border-color:rgba(255,255,255,.3)}
.icons.big .dicon .ic{width:56px;height:56px}
.icons.small .dicon .ic{width:32px;height:32px}
.taskbar{position:absolute;left:0;right:0;bottom:0;height:52px;background:rgba(243,243,243,.82);backdrop-filter:blur(26px) saturate(1.5);-webkit-backdrop-filter:blur(26px) saturate(1.5);border-top:1px solid rgba(0,0,0,.07);display:flex;align-items:center;justify-content:center;z-index:60}
.tcenter{display:flex;gap:4px;align-items:center}
.tk{width:40px;height:40px;border-radius:5px;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;border:none;background:transparent;padding:0}
.tk svg{width:22px;height:22px}
.tk:hover{background:rgba(0,0,0,.06)}
.tk:active{background:rgba(0,0,0,.1)}
.tk.open::after{content:"";position:absolute;bottom:2px;left:50%;transform:translateX(-50%);width:6px;height:3px;border-radius:2px;background:#8a8a8a}
.tksearch{width:168px;height:36px;border-radius:18px;background:#fff;border:1px solid #E0E0E0;box-shadow:0 1px 3px rgba(0,0,0,.1);display:flex;align-items:center;gap:9px;padding:0 14px;font-size:12.5px;color:#616161;cursor:pointer;margin:0 2px}
.tksearch:hover{border-color:#c8c8c8}
.tksearch svg{width:15px;height:15px}
.tray{position:absolute;right:8px;display:flex;align-items:center;gap:2px;height:100%}
.trbtn{height:40px;padding:0 8px;display:flex;align-items:center;gap:9px;border-radius:5px;cursor:pointer}
.trbtn:hover{background:rgba(0,0,0,.06)}
.clock{text-align:right;line-height:1.4;font-size:11.5px;color:#1b1b1b}

  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.012);
  g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d+.06);}

function wlogo(size,color){const g=Math.round(size*.12);
  return `<div class="wlogo" style="width:${size}px;height:${size}px;gap:${g}px;--sq:${color||'#0067C0'}"><i></i><i></i><i></i><i></i></div>`;}
function dots(size,color){return `<div class="dots" style="width:${size}px;height:${size}px;--dot:${color||'#fff'}">${'<i></i>'.repeat(6)}</div>`;}
function bootScreen(label){return `<div class="bootwrap">${wlogo(84,'#41A5F0')}${dots(46,'#fff')}${label?`<div class="bootlabel">${label}</div>`:''}</div>`;}
function avatarHTML(sz){return `<div class="avatar" style="width:${sz}px;height:${sz}px;font-size:${Math.round(sz*.42)}px">${(S.user.name||'U')[0].toUpperCase()}</div>`;}

/* ================= SIKLUS POWER / POST ================= */
function powerOn(){if(S.phase!=='off')return;audio();newPhase('post');runPost();}
function shutdownPC(){if(S.phase==='off')return;audio();screenEl.classList.add('offflash');
  after(420,()=>{newPhase('off');screenEl.classList.remove('offflash');setScreen('','t-black');
    hint('PC dimatikan. Tekan tombol Power di bezel (atau tombol P) untuk menyalakannya lagi.');});}
function screenOffFlash(cb){screenEl.classList.add('offflash');
  after(330,()=>{screenEl.classList.remove('offflash');setScreen('','t-black');cb();});}
function restartPC(){if(S.phase==='off')return;audio();screenOffFlash(()=>{newPhase('post');runPost();});}

function postLines(){const L=['','Initializing USB Controllers ... Done','Detecting SATA Port 0 ... VM-SSD-512GB'];
  if(S.plugged)L.push('Detecting USB ... Voyager USB 3.0 64GB');
  L.push('Memory Testing ... 16384 MB OK');return L;}
function addPostLine(t){const b=$('#postlines');if(b)b.insertAdjacentHTML('beforeend',`<div>${t}</div>`);}

function runPost(){
  newPhase('post');
  setScreen(`<div class="postlog"><div class="pl1">AXIOM VPC-11 UEFI BIOS R3.02.AXM &nbsp; 12/25/2025</div><div id="postlines"></div></div>
    <div class="postcenter"><div class="plogo">AXIOM</div><div class="psub">VIRTUAL PERFORMANCE CENTER</div></div>
    <div class="postkey">Press <b>DEL</b> to enter SETUP&nbsp;&nbsp;&middot;&nbsp;&nbsp;Press <b>F8</b> for BOOT MENU</div>`,'t-bios dark');
  beep();
  if(S.boot1==='usb'&&S.plugged)
    hint('Boot priority #1 = USB \u2713 \u2014 PC otomatis masuk installer Windows 11 setelah POST. (F8 = pilih manual, DEL = BIOS.)');
  else if(S.plugged)
    hint('USB terdeteksi. Tekan DEL (BIOS) atau F8 (Boot Menu) untuk boot dari flashdisk.');
  else
    hint('PC ini belum punya OS. Seret / KLIK flashdisk installer di rak bawah (port USB di bezel menyala hijau), lalu tekan DEL atau F8.');
  const g=S.gen,lines=postLines();let i=0;
  const reveal=()=>{if(S.gen!==g)return;
    if(i<lines.length){addPostLine(lines[i]);i++;after(430,reveal);}};
  after(400,reveal);
  after(6300,()=>{if(S.gen===g)attemptBoot();});
}
function attemptBoot(){
  if(S.boot1==='usb'&&S.plugged)return bootToSetup();
  return S.installed?bootToWindows():noBoot();
}
function noBoot(){
  newPhase('noboot');
  setScreen(`<div class="noboot">Reboot and Select proper Boot device<br>or Insert Boot Media in selected Boot device and press any key<span class="caret">_</span></div>`,'t-bios dark');
  errBeep();
  hint('Tidak ada media boot yang valid. Pasang flashdisk installer (klik/seret ke port USB), lalu klik layar ini atau tekan tombol Restart di bezel.');
}
async function bootToSetup(){
  newPhase('usbboot');const g=S.gen;
  setScreen(`<div class="postlog" style="left:36px;top:44%"><div>Verifying DMI Pool Data ...</div></div>`,'t-bios dark');
  await wait(1400);if(g!==S.gen)return;
  setScreen(bootScreen(),'t-black');
  await wait(3400);if(g!==S.gen)return;
  startSetupLang();
}
async function bootToWindows(){
  newPhase('winboot');const g=S.gen;
  setScreen(bootScreen(),'t-black');
  await wait(4200);if(g!==S.gen)return;
  lockScreen();
}

/* ================= BIOS ================= */
const BTABS=['Main','Advanced','Chipset','Security','Boot','Save & Exit'];
const TOGVALS={num:['On','Off'],fast:['Disabled','Enabled'],sb:['Enabled','Disabled']};
let B={tab:4,idx:0,bs:{}};
let popIdx=0,biosClock=0;
const bootLabel=d=>d==='usb'?'UEFI: Voyager USB 3.0 64GB':'VM-SSD 512GB';

function enterBios(){
  newPhase('bios');
  B={tab:4,idx:0,bs:{boot1:S.boot1,num:'On',fast:'Disabled',sb:'Enabled'}};
  renderBios();
}
function biosItems(){
  const now=new Date();
  const t=pad2(now.getHours())+':'+pad2(now.getMinutes())+':'+pad2(now.getSeconds());
  const d=pad2(now.getMonth()+1)+'/'+pad2(now.getDate())+'/'+now.getFullYear();
  switch(BTABS[B.tab]){
    case 'Main':return[
      {k:'System Time',v:t},{k:'System Date',v:d},
      {k:'BIOS Version',v:'R3.02.AXM'},{k:'Build Date',v:'11/07/2025'},
      {k:'Processor',v:'AXM VX-8 Eight-Core 3.60 GHz'},{k:'Total Memory',v:'16384 MB DDR5-4800'}];
    case 'Advanced':return[
      {k:'CPU Configuration',act:'pop',pop:{t:'CPU Configuration',l:['Processor Type : AXM VX-8','Core Count : 8','Max Speed : 3600 MHz','L3 Cache : 24 MB','Hyper-Threading : Enabled']}},
      {k:'SATA Configuration',act:'pop',pop:{t:'SATA Configuration',l:['SATA Mode : AHCI','Port 0 : VM-SSD-512GB (511.9 GB)','Port 1 : Empty','Port 2 : Empty']}},
      {k:'USB Configuration',act:'pop',pop:{t:'USB Configuration',l:['USB Module Version : 3.20','Legacy USB Support : Enabled','Port 1 : Voyager USB 3.0 64GB '+(S.plugged?'(Plugged)':'(Empty)')]}}];
    case 'Chipset':return[
      {k:'North Bridge',act:'pop',pop:{t:'North Bridge',l:['Memory Frequency : 4800 MHz','Memory Mode : Dual Channel','Max TDP : 15 W']}},
      {k:'South Bridge',act:'pop',pop:{t:'South Bridge',l:['PCIe x16 Slot 1 : VGA Adapter','PCIe x4 Slot 2 : Empty','M.2 Socket 1 : VM-SSD-512GB']}}];
    case 'Security':return[
      {k:'Secure Boot',v:B.bs.sb,act:'toggle',key:'sb'},
      {k:'Secure Boot Mode',v:'Standard'},
      {k:'Chassis Intrusion',act:'pop',pop:{t:'Chassis Intrusion',l:['Status : Clear','Intrusion Detection : Disabled']}}];
    case 'Boot':return[
      {k:'Boot Option #1',v:bootLabel(B.bs.boot1),act:'bootsel'},
      {k:'Boot Option #2',v:S.plugged?bootLabel(B.bs.boot1==='usb'?'ssd':'usb'):'Disabled'},
      {k:'Boot Up NumLock State',v:B.bs.num,act:'toggle',key:'num'},
      {k:'Fast Boot',v:B.bs.fast,act:'toggle',key:'fast'}];
    case 'Save & Exit':return[
      {k:'Save Changes and Reset',act:'save'},
      {k:'Discard Changes and Exit',act:'discard'},
      {k:'Restore Defaults',act:'defaults'}];
  }
  return [];
}
function updateBootHint(){
  if(!S.plugged)
    hint('Flashdisk BELUM terpasang \u2014 seret atau KLIK flashdisk di rak bawah (port USB di bezel menyala hijau). Daftar boot diperbarui otomatis, tidak perlu keluar dari BIOS.');
  else if(B.bs.boot1==='usb')
    hint('Boot Option #1 = USB \u2713 \u2014 tekan F10 (atau tab "Save & Exit" \u2192 "Save Changes and Reset"), lalu pilih Yes.');
  else
    hint('Klik baris "Boot Option #1" yang berdenyut (cukup SEKALI klik) \u2192 pilih "UEFI: Voyager USB 3.0 64GB" \u2192 tekan F10 \u2192 Yes.');
}
function renderBios(){
  const items=biosItems();
  const bootTab=(BTABS[B.tab]==='Boot');
  const hot=bootTab&&S.plugged&&B.bs.boot1!=='usb';
  setScreen(`<div class="bios">
    <div class="bios-title">AXIOM Setup Utility&nbsp;&nbsp;&mdash;&nbsp;&nbsp;Copyright (C) 2025 AXIOM Corp. All Rights Reserved</div>
    <div class="bios-tabs">${BTABS.map((t,i)=>`<div class="btab ${i===B.tab?'on':''}" data-i="${i}">${t}</div>`).join('')}</div>
    <div class="bios-body"><div id="bitems">
    ${items.map((it,i)=>`<div class="brow ${it.act?'act':''} ${it.act==='bootsel'&&hot?'hot':''} ${i===B.idx?'on':''}" data-i="${i}"><span class="k">${it.k}</span><span class="v">[${it.v}]</span></div>`).join('')}
    </div></div>
    <div class="bios-keys"><span>&larr;&rarr;</span> Select Screen <span>&uarr;&darr;</span> Select Item <span>Enter</span> Select <span>Esc</span> Exit <span>F10</span> Save &nbsp;&middot;&nbsp; dengan mouse cukup SEKALI klik</div>
  </div>`,'t-bios');
  $$('.btab',screenEl).forEach(t=>t.addEventListener('click',e=>{e.stopPropagation();B.tab=+t.dataset.i;B.idx=0;renderBios();}));
  /* SEKALI klik = pilih + jalankan */
  $$('.brow',screenEl).forEach(r=>r.addEventListener('click',()=>{
    B.idx=+r.dataset.i;markSel();biosActivate();}));
  if(bootTab)updateBootHint();
  if(BTABS[B.tab]==='Main'){
    if(biosClock)clearInterval(biosClock);
    biosClock=every(1000,()=>{const n=new Date();const el=$('#bitems .brow[data-i="0"] .v');
      if(el)el.textContent='['+pad2(n.getHours())+':'+pad2(n.getMinutes())+':'+pad2(n.getSeconds())+']';});
  }
}
function markSel(){$$('.brow',screenEl).forEach(r=>r.classList.toggle('on',+r.dataset.i===B.idx));}
function biosTabNav(d){B.tab=(B.tab+d+6)%6;B.idx=0;renderBios();}
function biosNav(d){const n=biosItems().length;if(!n)return;B.idx=(B.idx+d+n)%n;markSel();}
function biosActivate(){
  const it=biosItems()[B.idx];if(!it)return;
  if(it.act==='toggle'){B.bs[it.key]=TOGVALS[it.key][(TOGVALS[it.key].indexOf(B.bs[it.key])+1)%2];
    tone(1300,.04,'square',.07);renderBios();}
  else if(it.act==='bootsel')biosBootPopup();
  else if(it.act==='pop')biosInfoPop(it.pop);
  else if(it.act==='save')biosConfirm(true);
  else if(it.act==='discard')biosConfirm(false);
  else if(it.act==='defaults'){B.bs={boot1:'ssd',num:'On',fast:'Disabled',sb:'Enabled'};tone(1000,.05,'square',.08);renderBios();}
}
function biosPop(title,inner,bind){
  screenEl.insertAdjacentHTML('beforeend',`<div class="bpop" id="bpop"><div class="bpopbox"><h5>${title}</h5>${inner}<div class="bpopfoot">Enter untuk memilih &middot; Esc untuk batal</div></div></div>`);

}
function closeBiosPop(){const p=$('#bpop');if(p)p.remove();}
function biosInfoPop(pop){
  biosPop(pop.t,pop.l.map(l=>`<div class="brow" style="cursor:default"><span class="k">${l.split(' : ')[0]}</span><span class="v">${l.split(' : ')[1]||''}</span></div>`).join(''));
}
function biosBootPopup(){
  const opts=[{d:'ssd',l:'VM-SSD 512GB'}];
  if(S.plugged)opts.push({d:'usb',l:'UEFI: Voyager USB 3.0 64GB'});
  popIdx=opts.findIndex(o=>o.d===B.bs.boot1);
  if(S.plugged)popIdx=opts.findIndex(o=>o.d==='usb'); /* otomatis sorot USB */
  if(popIdx<0)popIdx=0;
  let inner=opts.map((o,i)=>`<div class="brow bopt ${i===popIdx?'cur':''}" data-d="${o.d}"><span class="k">${o.l}</span><span class="v">[${o.d===B.bs.boot1?'Current':'Select'}]</span></div>`).join('');
  if(!S.plugged)
    inner+=`<div class="brow" style="cursor:default"><span class="k" style="color:#ffe9a8">USB device not found \u2014 pasang flashdisk installer (klik/seret ke port USB di bezel). Daftar ini diperbarui otomatis.</span><span class="v"></span></div>`;
  biosPop('Select boot device for Boot Option #1',inner,
    ()=>{$$('.bopt',screenEl).forEach(r=>r.addEventListener('click',()=>{
      B.bs.boot1=r.dataset.d;closeBiosPop();tone(1300,.04,'square',.07);renderBios();}));});
}
function biosConfirm(save){
  biosPop('Setup Confirmation',
    `<div class="bconfirm">${save?'Save configuration changes and exit now?':'Discard changes and exit setup?'}</div>
     <div class="bbtns"><div class="bpbtn" id="byes">Yes</div><div class="bpbtn" id="bno">No</div></div>`,
    ()=>{ $('#byes').addEventListener('click',()=>{
        closeBiosPop();
        if(save){S.boot1=B.bs.boot1;saveBeep();screenOffFlash(()=>runPost());}
        else screenOffFlash(()=>runPost());
      });
      $('#bno').addEventListener('click',closeBiosPop); });
}
function biosKeys(e){
  if($('#bpop')){
    if(e.key==='Escape'){closeBiosPop();return;}
    const opts=$$('.bopt',screenEl),yes=$('#byes');
    if(e.key==='Enter'){
      if(yes)yes.click();
      else if(opts.length&&opts[popIdx])opts[popIdx].click();
      else closeBiosPop();
      return;
    }
    if((e.key==='ArrowDown'||e.key==='ArrowUp')&&opts.length){
      e.preventDefault();
      popIdx=(popIdx+(e.key==='ArrowDown'?1:-1)+opts.length)%opts.length;
      opts.forEach((o,i)=>o.classList.toggle('cur',i===popIdx));
    }
    return;
  }
  switch(e.key){
    case 'ArrowLeft':e.preventDefault();biosTabNav(-1);break;
    case 'ArrowRight':e.preventDefault();biosTabNav(1);break;
    case 'ArrowUp':e.preventDefault();biosNav(-1);break;
    case 'ArrowDown':e.preventDefault();biosNav(1);break;
    case 'Enter':biosActivate();break;
    case 'Escape':biosConfirm(false);break;
    case 'F10':e.preventDefault();biosConfirm(true);break;
  }
}

/* --- Progress instalasi --- */
const PROG_ITEMS=['Copying Windows files','Getting files ready for installation','Installing features','Installing updates','Finishing up'];
function progressScreen(){
  showSetup('Installing Windows',`
    <div class="plist">${PROG_ITEMS.map((l,i)=>`<div class="pitem" data-i="${i}"><span>${l}</span><span class="st"></span></div>`).join('')}</div>
    <div class="pnote">Your PC will restart several times. This might take a while.</div>`,'wide');
}
function ramp(sec,to,cb,irr){
  const g=S.gen;return new Promise(res=>{let v=0;
    const step=()=>{if(g!==S.gen){res();return;}
      const inc=irr?(Math.random()<.14?0:1+Math.random()*to/(sec*3.2)):to/(sec*4);
      v=Math.min(to,v+inc);cb(Math.floor(v));
      if(v>=to)res();else after(250,step);};
    step();});
}
async function restart1(g){
  setScreen(`<div class="restartingwrap">Restarting&hellip;</div>`,'t-black');
  await wait(1900);if(g!==S.gen)return;
  setScreen(bootScreen(),'t-black');await wait(4200);if(g!==S.gen)return;
  setScreen(`<div class="gettingready">${dots(40,'#fff')}<div>Getting ready</div></div>`,'t-black');
  await wait(3800);if(g!==S.gen)return;
}
async function restart2(g){
  setScreen(`<div class="restartingwrap">Restarting&hellip;</div>`,'t-black');
  await wait(1900);if(g!==S.gen)return;
  setScreen(bootScreen('Getting devices ready 0%'),'t-black');
  await ramp(7,100,v=>{const el=$('.bootlabel',screenEl);if(el)el.textContent='Getting devices ready '+v+'%';});
  if(g!==S.gen)return;
  await wait(500);if(g!==S.gen)return;
  setScreen(`<div class="gettingready">${dots(40,'#fff')}<div>Getting ready</div></div>`,'t-black');
  await wait(3600);if(g!==S.gen)return;
  setScreen(bootScreen(),'t-black');await wait(2600);if(g!==S.gen)return;
}
async function goInstall(){
  progressScreen();
  hint('Duduk manis — Windows sedang disalin ke disk. PC akan restart otomatis beberapa kali.');
  $('#ledDisk').classList.add('busy');
  const g=S.gen;
  const setSt=(i,t)=>{const n=$(`.pitem[data-i="${i}"] .st`,screenEl);if(n)n.textContent=t;};
  const act=i=>$$('.pitem',screenEl).forEach(p=>p.classList.toggle('act',+p.dataset.i===i));
  act(0);await ramp(6,100,v=>setSt(0,v+'%'));if(g!==S.gen)return;setSt(0,'Done');
  act(1);await ramp(26,100,v=>setSt(1,v+'%'),true);if(g!==S.gen)return;setSt(1,'Done');
  $('#ledDisk').classList.remove('busy');
  await restart1(g);if(g!==S.gen)return;
  progressScreen();setSt(0,'Done');setSt(1,'Done');
  act(2);await ramp(7,100,v=>setSt(2,v+'%'));if(g!==S.gen)return;setSt(2,'Done');
  act(3);$('#ledDisk').classList.add('busy');
  await ramp(11,100,v=>setSt(3,v+'%'),true);if(g!==S.gen)return;setSt(3,'Done');
  act(4);await ramp(5,100,v=>setSt(4,v+'%'));if(g!==S.gen)return;setSt(4,'Done');
  $('#ledDisk').classList.remove('busy');
  await restart2(g);if(g!==S.gen)return;
  oobeRegion();
}

  oobeShow(`Let's connect you to a network`,'You need an internet connection to keep exploring. Choose a network to connect.',

      ${W.map(w=>`<div class="wifirow" data-ssid="${w[0]}">${ICON.signal(w[1])}<span style="flex:1">${w[0]}</span>${ICON.lock}</div>`).join('')}

/* --- context menu desktop --- */
function hideCtx(){const c=$('#ctx');if(c)c.remove();}

    :`<div class="cmi ${it.dis?'dis':''}" data-a="${it.a||''}">${it.t}</div>`).join('');

function deskContext(e){
  const ic=$('#icons');
  showCtx([
    {t:'View',sub:[{t:'Large icons',a:'viewL'},{t:'Medium icons',a:'viewM'},{t:'Small icons',a:'viewS'}]},
    {t:'Sort by',sub:[{t:'Name',a:'sortN'}]},
    {t:'Refresh',a:'refresh'},'-',
    {t:'Paste',dis:1},'-',
    {t:'Open in Terminal',a:'terminal'},
    {t:'New',sub:[{t:'Folder',a:'newfolder'},{t:'Text Document',a:'newtxt'}]},'-',
    {t:'Display settings',a:'display'},
    {t:'Personalize',a:'personalize'}],
    e.clientX-screenEl.getBoundingClientRect().left,
    e.clientY-screenEl.getBoundingClientRect().top,
    a=>{
      if(a==='refresh')renderIcons();
      else if(a==='viewL'){ic.className='icons big';}
      else if(a==='viewM'){ic.className='icons';}
      else if(a==='viewS'){ic.className='icons small';}
      else if(a==='sortN'){DF.folders.sort();DF.files=Object.keys(DF.files).sort().reduce((o,k)=>(o[k]=DF.files[k],o),{});renderIcons();}
      else if(a==='terminal')openApp('terminal');
      else if(a==='newfolder'){let n='New folder',i=2;while(DF.folders.includes(n))n='New folder ('+(i++)+')';DF.folders.push(n);renderIcons();}
      else if(a==='newtxt'){let n='New Text Document.txt',i=2;while(DF.files[n]!=null)n='New Text Document ('+(i++)+').txt';DF.files[n]='';renderIcons();}
      else if(a==='display')openApp('settings');
      else if(a==='personalize')openApp('settings');
    });
}
function iconContext(e,id){
  e.preventDefault();e.stopPropagation();
  const userItem=id.startsWith('f')||id.startsWith('t');
  showCtx([
    {t:'Open',a:'open'},'-',
    {t:'Delete',a:'del',dis:!userItem}],
    e.clientX-screenEl.getBoundingClientRect().left,
    e.clientY-screenEl.getBoundingClientRect().top,
    a=>{
      if(a==='open'){const it=deskModel().find(m=>m.id===id);if(it)it.open();}
      if(a==='del'){
        if(id.startsWith('f')){DF.folders.splice(+id.slice(1),1);renderIcons();}
        else if(id.startsWith('t')){delete DF.files[id.slice(1)];renderIcons();}}
    });
}

/* --- window manager --- */
function openWin(id,title,icon,bodyHTML,opts){
  const sid='win-'+String(id).replace(/[^a-zA-Z0-9_-]/g,'_');
  let existing=document.getElementById(sid);
  if(existing){existing.style.display='flex';bringFront(existing);return existing;}
  const layer=$('#winlayer');if(!layer)return;
  const r=screenEl.getBoundingClientRect();
  const ww=Math.min((opts&&opts.w)||640,r.width-24);
  const wh=Math.min((opts&&opts.h)||440,r.height-130);
  const n=layer.children.length;
  const w=document.createElement('div');
  w.className='win';w.id=sid;
  w.style.width=ww+'px';w.style.height=wh+'px';
  w.style.left=Math.max(8,Math.min(50+n*26,r.width-ww-8))+'px';
  w.style.top=Math.max(8,Math.min(30+n*22,r.height-wh-58))+'px';
  w.style.zIndex=++zTop;
  w.innerHTML=`<div class="winbar"><div class="t">${icon}<span>${title}</span></div>
    <div class="winctl"><button class="wc" data-a="min" title="Minimize">${ICON.wmin}</button>
    <button class="wc" data-a="max" title="Maximize">${ICON.wmax}</button>
    <button class="wc close" data-a="close" title="Close">${ICON.wclose}</button></div></div>
    <div class="winbody">${bodyHTML}</div>`;
  layer.appendChild(w);
  w.addEventListener('pointerdown',()=>bringFront(w));
  $$('.wc',w).forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();
    if(b.dataset.a==='close'){w.remove();openApps.delete(id);updTaskbarInd();}
    if(b.dataset.a==='min')w.style.display='none';
    if(b.dataset.a==='max')w.classList.toggle('max');}));
  const bar=$('.winbar',w);
  bar.addEventListener('pointerdown',ev=>{
    if(ev.target.closest('.wc')||w.classList.contains('max'))return;
    const sx=ev.clientX-w.offsetLeft,sy=ev.clientY-w.offsetTop;
    const move=e2=>{w.style.left=Math.max(-ww+140,Math.min(e2.clientX-sx,r.width-60))+'px';
      w.style.top=Math.max(0,Math.min(e2.clientY-sy,r.height-60))+'px';};
    const up=()=>{window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up);};
    window.addEventListener('pointermove',move);window.addEventListener('pointerup',up);});
  openApps.add(id);updTaskbarInd();
  return w;
}
function bringFront(w){w.style.zIndex=++zTop;}
function updTaskbarInd(){$$('.tk[data-app]').forEach(b=>b.classList.toggle('open',openApps.has(b.dataset.app)));}

/* ================= FLASHDISK (drag / klik / hot-plug) ================= */
(function(){
  const usb=$('#usb'),slot=$('#usbSlot'),port=$('#port');
  let drag=null;
  usb.addEventListener('pointerdown',e=>{
    if(S.plugged)return;
    e.preventDefault();audio();
    const r=usb.getBoundingClientRect();
    document.body.appendChild(usb);
    usb.classList.add('fixed');
    usb.style.left=r.left+'px';usb.style.top=r.top+'px';
    drag={dx:e.clientX-r.left,dy:e.clientY-r.top,moved:0,x0:e.clientX,y0:e.clientY};
    usb.setPointerCapture(e.pointerId);
  });
  usb.addEventListener('pointermove',e=>{
    if(!drag)return;
    if(Math.abs(e.clientX-drag.x0)+Math.abs(e.clientY-drag.y0)>6)drag.moved=1;
    usb.style.left=(e.clientX-drag.dx)+'px';
    usb.style.top=(e.clientY-drag.dy)+'px';
  });
  usb.addEventListener('pointerup',()=>{
    if(!drag)return;
    const wasClick=!drag.moved;drag=null;
    if(wasClick){plug();return;} /* klik singkat = langsung terpasang */
    const pr=port.getBoundingClientRect();
    const cx=pr.left+pr.width/2,cy=pr.top+pr.height/2;
    const ux=parseFloat(usb.style.left),uy=parseFloat(usb.style.top);
    if(Math.hypot(cx-(ux+47),cy-(uy+18))<110)flyTo(cx-47,cy-9);
    else flyBack();
  });
  function flyTo(x,y){
    usb.classList.add('anim');
    usb.style.left=x+'px';usb.style.top=y+'px';
    after(430,()=>{usb.classList.remove('anim');plug();});
  }
  function flyBack(){
    const r=slot.getBoundingClientRect();
    usb.classList.add('anim');
    usb.style.left=r.left+'px';usb.style.top=r.top+'px';
    after(430,()=>{usb.classList.remove('anim');restore();});
  }
  function restore(){
    usb.classList.remove('fixed');usb.style.left='';usb.style.top='';
    slot.appendChild(usb);
  }
  function plug(){
    if(S.plugged)return;
    S.plugged=true;restore();
    usb.classList.add('hidden');
    $('#usbStub').hidden=false;plugSnd();
    syncPort();
    /* hot-plug: layar yang terbuka ikut diperbarui */
    if(S.phase==='bios'){renderBios();tone(1500,.06,'square',.08);}
    else if(S.phase==='bootmenu')bootMenu();
    else if(S.phase==='post'){
      addPostLine('Detecting USB ... Voyager USB 3.0 64GB');
      hint(S.boot1==='usb'?'Boot priority #1 = USB \u2713 \u2014 PC otomatis masuk installer setelah POST selesai.'
        :'USB terdeteksi. Tekan DEL (BIOS) atau F8 (Boot Menu) untuk boot dari flashdisk.');}
    else if(S.phase==='noboot'){
      hint('USB terpasang — PC akan restart otomatis. Setelah itu tekan F8 (Boot Menu) atau DEL (BIOS).');
      after(1500,()=>{if(S.phase==='noboot')restartPC();});}
  }
  function unplug(){
    if(!S.plugged)return;
    S.plugged=false;
    $('#usbStub').hidden=true;
    usb.classList.remove('hidden');unplugSnd();
    syncPort();
    if(S.phase==='bios'){if(B.bs.boot1==='usb')B.bs.boot1='ssd';renderBios();}
    else if(S.phase==='bootmenu')bootMenu();
    else hint('Flashdisk dicabut. Pasang kembali (klik/seret) kapan saja.');
  }
  $('#usbStub').addEventListener('click',e=>{e.stopPropagation();unplug();});
})();

window.addEventListener('keydown',e=>{
  const tag=(e.target&&e.target.tagName)||'';
  const inInput=(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT');
  if(e.ctrlKey&&e.altKey&&e.key==='Delete'){e.preventDefault();restartPC();return;}
  if(S.phase==='desktop'||S.phase==='login')return;
  if(S.phase==='lock'){if(!inInput){e.preventDefault();loginScreen();}return;}
  if(['F1','F2','F8','F10','F12'].includes(e.key)&&!inInput)e.preventDefault();
  switch(S.phase){
    case 'off':if(e.key==='p'||e.key==='P')powerOn();break;
    case 'post':
      if(e.key==='Delete'||e.key==='F2')enterBios();
      else if(e.key==='F8')bootMenu();
      break;
    case 'bios':if(!inInput)biosKeys(e);break;
    case 'bootmenu':if(e.key==='Escape')runPost();break;
    case 'noboot':
      if(!['Control','Alt','Shift','Meta','Dead'].includes(e.key))restartPC();
      break;
  }
});

      <div class="dtool" id="szCancel">Cancel</div>
    </div>`,
    `<span></span><button class="wbtn" id="next">Next</button>`,'wide');

  $$('.drow:not(.head):not(.scanning)',screenEl).forEach(r=>r.addEventListener('click',()=>{
    if(DK.busy)return;
    DK.sel=+r.dataset.i;renderDisk();
  }));
  diskHint();

  /* ---------- toolbar ---------- */
  $('#tRefresh').addEventListener('click',()=>{
    if(DK.busy)return;
    DK.busy={scan:true};renderDisk();
    $('#ledDisk').classList.add('busy');
    after(800,()=>{$('#ledDisk').classList.remove('busy');DK.busy=null;renderDisk();});
  });

  $('#tLoad').addEventListener('click',()=>{
    if(DK.busy)return;
    const card=$('.setup-card',screenEl);if(!card)return;
    card.insertAdjacentHTML('beforeend',`<div class="cmodal"><div class="cbox">
      <div>Insert the installation media that contains the driver package, then type the path to the folder with the driver files.</div>
      <input class="winput mono" id="drvpath" style="margin-top:12px" value="E:\\Drivers">
      <div class="cbbtns"><button class="wbtn" id="drvok">OK</button><button class="wbtn sec" id="drvc">Cancel</button></div>
    </div></div>`);
    const m=$('.cmodal',screenEl);
    $('#drvc').addEventListener('click',()=>m.remove());
    $('#drvok').addEventListener('click',()=>{m.remove();
      after(700,()=>cardConfirm('No signed device drivers were found. Make sure that the installation media contains the proper drivers, and then click OK.',null,'OK',true));});
  });

  $('#tDelete').addEventListener('click',()=>{
    if(!canDel)return;
    const i=DK.sel;
    cardConfirm('The partition might contain system files needed by Windows. If you delete it, the space becomes unallocated and merges with adjacent free space.',()=>{deletePart(i);},'Delete');
  });

  $('#tFormat').addEventListener('click',()=>{
    if(!canDel)return;
    cardConfirm('Format will erase any data on this partition. To format this partition, click OK. To cancel, click Cancel.',()=>{
      DK.busy={i:DK.sel,t:'Formatting\u2026'};renderDisk();
      $('#ledDisk').classList.add('busy');
      after(1400,()=>{$('#ledDisk').classList.remove('busy');DK.busy=null;renderDisk();tone(1400,.05,'square',.06);});
    },'OK');
  });

  $('#tNew').addEventListener('click',()=>{if(canNew)sizeDlg('new');});
  $('#tExtend').addEventListener('click',()=>{if(canExt)sizeDlg('extend');});

  /* ---------- dialog ukuran (New / Extend) ---------- */
  function sizeDlg(mode){
    const box=$('#sizedlg');box.hidden=false;
    const inp=$('#sz'),err=$('#szerr'),ap=$('#szApply');
    let min,max;
    if(mode==='new'){
      const M=P[DK.sel].size;
      const needSys=!P.some(x=>x.ty==='sys');
      min=(needSys&&M>=376)?376:100;max=M;
    }else{
      const i=DK.sel;
      min=P[i].size;max=P[i].size+P[i+1].size;
    }
    inp.value=max;inp.min=min;inp.max=max;
    const check=()=>{
      const v=Math.floor(+inp.value||0);
      const ok=v>=min&&v<=max;
      ap.classList.toggle('dis',!ok);
      err.textContent=ok?'':(v>max?'Maximum size is '+max+' MB.':'Minimum size is '+min+' MB.');
    };
    check();
    inp.oninput=check;
    inp.onkeydown=e=>{if(e.key==='Enter'&&!ap.classList.contains('dis'))ap.click();};
    $('#szCancel').onclick=()=>{box.hidden=true;};
    ap.onclick=()=>{
      if(ap.classList.contains('dis'))return;
      const v=Math.floor(+inp.value);box.hidden=true;
      if(mode==='new')applyNew(v);
      else{
        const i=DK.sel,u=P[i+1],comb=P[i].size+u.size;
        P[i].size=v;u.size=comb-v;
        if(u.size<=0)P.splice(i+1,1);
        renderDisk();
      }
    };
    inp.focus();if(inp.select)inp.select();
  }

  /* ---------- buat partisi (logika partisi Windows asli) ---------- */
  function applyNew(X,silent){
    const i=DK.sel,M=P[i].size,full=X===M;
    const needSys=!P.some(x=>x.ty==='sys')&&M>=376;
    const run=()=>{
      const ins=[];
      if(needSys){
        ins.push({ty:'sys',size:260},{ty:'msr',size:16});
        if(full){
          const rem=M-276;
          if(rem-620>=100)ins.push({ty:'primary',size:rem-620},{ty:'recovery',size:620});
          else ins.push({ty:'primary',size:rem});
        }else{
          ins.push({ty:'primary',size:X-276},{ty:'unalloc',size:M-X});
        }
      }else{
        ins.push({ty:'primary',size:X});
        if(!full)ins.push({ty:'unalloc',size:M-X});
      }
      P.splice(i,1,...ins);
      let sel=i;for(let k=i;k<i+ins.length;k++)if(P[k].ty==='primary'){sel=k;break;}
      if(!silent){DK.sel=sel;renderDisk();}
    };
    if(needSys&&!silent)
      cardConfirm('Windows will create additional partitions for system files. These partitions are required by Windows and may be hidden.',run,'OK',true);
    else run();
  }

  /* ---------- hapus partisi (ruang kosong digabung otomatis) ---------- */
  function deletePart(i){
    const size=P[i].size;
    P[i]={ty:'unalloc',size:size};
    let j=i;
    if(j>0&&P[j-1].ty==='unalloc'){P[j-1].size+=size;P.splice(j,1);j--;}
    if(j+1<P.length&&P[j+1].ty==='unalloc'){P[j].size+=P[j+1].size;P.splice(j+1,1);}
    DK.sel=j;renderDisk();
  }

  /* ---------- NEXT ---------- */
  $('#next').addEventListener('click',()=>{
    if(DK.busy)return;
    const p=P[DK.sel];if(!p)return;
    if(p.ty==='unalloc'){
      cardConfirm('Windows might create additional partitions for system files. Setup will continue automatically.',()=>{
        applyNew(P[DK.sel].size,true);
        if(!P.some(x=>x.ty==='sys')){
          errBeep();
          cardConfirm('Setup was unable to create a new system partition or locate an existing system partition. See the Setup log files for more information.',null,'OK',true);
        }else goInstall();
      },'OK',true);
    }
    else if(p.ty==='primary'){
      if(!P.some(x=>x.ty==='sys')){
        errBeep();
        cardConfirm('Setup was unable to create a new system partition or locate an existing system partition. See the Setup log files for more information.',null,'OK',true);
      }else goInstall();
    }
    else if(p.ty==='sys'){
      errBeep();
      cardConfirm('Windows cannot be installed to System Reserved partition.',null,'OK',true);
    }
    else{
      errBeep();
      cardConfirm('Windows cannot be installed to this partition. Select the Primary partition, then click Next.',null,'OK',true);
    }
  });
};
})();
</script>

     footR:`<button class="bnext" id="ok" disabled title="Aktif setelah terhubung ke internet">Next</button>`});
  let trying=false,revealed=false,connSeq=0;
  const reveal=()=>{if(revealed)return;revealed=true;

    after(60,()=>{const w=$('#wpass');if(w)w.focus();});}));
  $('#wcancel').addEventListener('click',()=>{connSeq++;trying=false;
    $('#pwdbox').hidden=true;$('#netstat').textContent='';});
  const tryConn=()=>{
    const my=++connSeq;
    $('#netstat').className='netstat2';
    $('#netstat').textContent='Checking network requirements\u2026';
    oobeTimer(2600,()=>{if(my!==connSeq||!$('#netstat'))return;
      $('#netstat').className='netstat2 err';
      $('#netstat').innerHTML=`${OC.errIc}<span>Connect was unsuccessful — no working network driver on this device.</span>`;
      errBeep();trying=false;reveal();});
  };
  $('#wconn').addEventListener('click',tryConn);
  $('#wpass').addEventListener('keydown',e=>{if(e.key==='Enter')tryConn();});
  $('#noint').addEventListener('click',()=>oobeGo('limited'));
  hint('Klik salah satu WiFi → Connect (akan gagal — driver jaringan belum ada). Setelah gagal atau ±5 detik, link "I don\u2019t have internet" muncul di kiri bawah — klik itu untuk lanjut.');
};

oobeLimited=function(){
  oobeShell('Connect now to save time later',
    'Connecting lets you download updates, sync your files, and sign in to your Microsoft account. You can always connect later.',
    `<div class="offnote">${OC.cloudOff}<span>This PC doesn\u2019t have a working network driver, so it can\u2019t reach the internet right now — you\u2019ll set up a local account instead.</span></div>`,
    {footL:'<a class="wlink" id="cont">Continue with limited setup</a>',
     footR:'<button class="bnext" id="retry">Retry</button>',
     art:OC.globeArt});
  $('#cont').addEventListener('click',()=>oobeGo('account'));
  $('#retry').addEventListener('click',()=>oobeGo('network'));
  hint('Klik "Continue with limited setup" (kiri bawah) untuk membuat akun lokal tanpa Microsoft account.');
};

oobeAccount=function(){
  oobeShell("Who's going to use this device?",
    'Use a name you can easily identify — you\u2019ll use it to sign in.',
    `<div class="acc-ava">${OC.person}</div>
     <div class="serr" id="aerr"></div>
     <input class="winput" id="uname" placeholder="Username" maxlength="20" autocomplete="off">`,
    {footR:'<button class="bnext" id="ok">Next</button>'});
  after(60,()=>{const u=$('#uname');if(u)u.focus();});
  $('#ok').addEventListener('click',()=>{
    const n=$('#uname').value.trim();
    if(!n){errBeep();$('#aerr').textContent='Please enter a name.';return;}
    S.user.name=n;oobeGo('password');});
  hint('Masukkan nama pengguna (mis. "Ardi") lalu klik Next (atau tekan Enter).');
};

oobePassword=function(){
  const pf=(id,ph)=>`<div class="pwbox" style="margin-bottom:10px"><input class="winput" id="${id}" type="password" placeholder="${ph}" autocomplete="off"><button class="pweye" data-t="${id}" tabindex="-1">${OC.eye}</button></div>`;
  oobeShell('Create a super memorable password',
    'Make sure to pick something you can remember. Leave it blank to sign in without a password.',
    `${pf('p1','Password')}${pf('p2','Confirm password')}<div class="serr" id="perr"></div>`,
    {footR:'<button class="bnext" id="ok">Next</button>'});
  $$('.pweye',screenEl).forEach(b=>bindEye(b,$('#'+b.dataset.t)));
  $('#ok').addEventListener('click',()=>{
    const a=$('#p1').value,b=$('#p2').value;
    if(a!==b){errBeep();$('#perr').textContent="The passwords you entered don't match. Try again.";return;}
    S.user.password=a;
    a?oobeGo('sq'):oobeGo('privacy');});
  hint('Isi password dua kali — ikon mata untuk menampilkan/menyembunyikan. Kosongkan keduanya untuk lanjut tanpa password.');
};

oobeSQ=function(){
  const Qs=['What was your childhood nickname?',"What's the name of your first pet?",'What city were you born in?','What was your first car?',"What's your mother's maiden name?"];
  oobeShell('Add security questions',
    'If you forget your password, you can recover your local account with these answers.',
    [0,1,2].map(()=>`<div class="sqrow2"><select class="winput">${Qs.map(q=>`<option>${q}</option>`).join('')}</select><input class="winput sqin" placeholder="Answer"></div>`).join(''),
    {footR:'<button class="bnext" id="ok">Next</button>'});
  $('#ok').addEventListener('click',()=>{
    const ok=$$('.sqin',screenEl).every(i=>i.value.trim());
    if(!ok){errBeep();$$('.sqin',screenEl).forEach(i=>i.style.borderColor=i.value.trim()?'':'#C42B1C');return;}
    oobeGo('privacy');});
  hint('Pilih pertanyaan dan isi jawabannya (bebas) untuk ketiganya, lalu Next.');
};

oobePrivacy=function(){
  const P=[
    ['Location','Let apps use your precise location, including location history.','pin','b'],
    ['Find my device','Track your device if you lose it. You can also locate it on a map.','mon','g'],
    ['Diagnostic data','Send usage data to help improve Windows.','pulse','p'],
    ['Inking & typing','Send what you write and type to improve recognition and suggestions.','pen','o'],
    ['Tailored experiences','Let Windows personalize tips, ads, and content based on your data.','spark','t']];
  oobeShell('Choose privacy settings for your device',
    'You\u2019re in control. Review these settings and turn them on or off before finishing setup.',
    P.map((p,i)=>`<div class="prow2"><div class="picon ${p[3]}">${OC[p[2]]}</div><div style="flex:1"><div class="pn2">${p[0]}</div><div class="pd2">${p[1]}</div></div><div class="tog ${i>=2?'on':''}"></div></div>`).join(''),
    {footR:'<button class="bnext" id="ok">Accept</button>'});
  $$('.tog',screenEl).forEach(t=>t.addEventListener('click',()=>{t.classList.toggle('on');tone(1200,.03,'square',.05);}));
  $('#ok').addEventListener('click',oobeFinal);
  hint('Setiap pengaturan kini punya ikon sendiri. Atur toggle sesuai selera lalu klik Accept.');
};

oobeFinal=async function(){
  newPhase('final');const g=S.gen;
  S.installed=true;S.instDate=new Date();
  const blue=txt=>setScreen(`<div class="readyblue">${dots(44,'#fff')}<div class="rbtxt">${txt}</div></div>`,'t-ui t-oobe2');
  blue('Hi');
  hint('Sebentar lagi — Windows sedang menyelesaikan persiapan\u2026');
  const msgs=[['Getting everything set up for you',2600],['This might take a few minutes',2600],['Almost ready',2200],['Hi '+esc(S.user.name)+' \u2014 getting everything ready for you',2600]];
  for(const m of msgs){await wait(m[1]);if(g!==S.gen)return;blue(m[0]);}
  await wait(2600);if(g!==S.gen)return;
  setScreen(`<div class="readyblue"><div class="rbtxt" style="font-size:36px">Welcome, ${esc(S.user.name)}</div>${dots(44,'#fff')}</div>`,'t-ui t-oobe2');
  await wait(2600);if(g!==S.gen)return;
  showDesktop(true);
};

/* ---------- NAVIGASI (didefinisikan setelah semua layar) ---------- */
const OOBE_FN={region:oobeRegion,keyboard:oobeKeyboard,network:oobeNetwork,limited:oobeLimited,
               account:oobeAccount,password:oobePassword,sq:oobeSQ,privacy:oobePrivacy};
function oobeGo(n){oobeHistory.push(n);const f=OOBE_FN[n];if(f)f();}
function oobeBack(){
  if(oobeHistory.length>1){
    oobeHistory.pop();
    const f=OOBE_FN[oobeHistory[oobeHistory.length-1]];
    if(f)f();
  }
}

/* Enter = tombol Next/Yes di semua layar OOBE */
if(!window.__oobeEnterBound){
  window.__oobeEnterBound=true;
  screenEl.addEventListener('keydown',e=>{
    if(e.key!=='Enter'||S.phase!=='oobe')return;
    const t=e.target;
    if(t&&t.tagName==='SELECT')return;
    const b=$('#ok');
    if(b&&!b.disabled){e.preventDefault();b.click();}
  });
}
})();
</script>
</body>
</html>
