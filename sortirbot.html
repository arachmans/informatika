      // ============================================================================
      // MODULE: soundFx.js

      class SoundEffects {
        constructor() {
          this.ctx = null;
          this.enabled = true;
        }

        ensureCtx() {
          if (!this.enabled) return null;
          if (typeof window === 'undefined') return null;
          if (!this.ctx) {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (AudioCtx) {
              this.ctx = new AudioCtx();
            }
          }
          if (this.ctx && this.ctx.state === 'suspended') {
            this.ctx.resume().catch(() => {});
          }
          return this.ctx;
        }

        playScan() {
          const ctx = this.ensureCtx();
          if (!ctx) return;
          const now = ctx.currentTime;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(740, now);
          osc.frequency.exponentialRampToValueAtTime(1180, now + 0.09);
          gain.gain.setValueAtTime(0.06, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.11);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.12);
        }

        playStepTick(isTrue) {
          const ctx = this.ensureCtx();
          if (!ctx) return;
          const now = ctx.currentTime;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          const freq = isTrue === undefined ? 520 : isTrue ? 660 : 420;
          osc.frequency.setValueAtTime(freq, now);
          gain.gain.setValueAtTime(0.04, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.07);
        }

        playRobotServo() {
          const ctx = this.ensureCtx();
          if (!ctx) return;
          const now = ctx.currentTime;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(180, now);
          osc.frequency.linearRampToValueAtTime(270, now + 0.14);
          gain.gain.setValueAtTime(0.03, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.17);
        }

        playSuccess() {
          const ctx = this.ensureCtx();
          if (!ctx) return;
          const now = ctx.currentTime;
          [587.33, 880].forEach((freq, idx) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now + idx * 0.075);
            gain.gain.setValueAtTime(0.07, now + idx * 0.075);
            gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.075 + 0.18);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now + idx * 0.075);
            osc.stop(now + idx * 0.075 + 0.19);
          });
        }

        playWrong() {
          const ctx = this.ensureCtx();
          if (!ctx) return;
          const now = ctx.currentTime;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(210, now);
          osc.frequency.linearRampToValueAtTime(145, now + 0.22);
          gain.gain.setValueAtTime(0.07, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.26);
        }

        playLevelComplete() {
          const ctx = this.ensureCtx();
          if (!ctx) return;
          const now = ctx.currentTime;
          const notes = [523.25, 659.25, 783.99, 1046.5];
          notes.forEach((freq, i) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, now + i * 0.09);
            gain.gain.setValueAtTime(0.08, now + i * 0.09);
            gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.09 + 0.28);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now + i * 0.09);
            osc.stop(now + i * 0.09 + 0.3);
          });
        }
      }

      // ============================================================================

      class PythonRuntimeError extends Error {
        constructor(message, line) {
          super(message);
          this.line = line;
        }
      }

      function stripInlineComment(rawLine) {
        let inSingle = false;
        let inDouble = false;
        for (let i = 0; i < rawLine.length; i++) {
          const ch = rawLine[i];
          const prev = i > 0 ? rawLine[i - 1] : '';
          if (ch === "'" && !inDouble && prev !== '\\') {
            inSingle = !inSingle;
          } else if (ch === '"' && !inSingle && prev !== '\\') {
            inDouble = !inDouble;
          } else if (ch === '#' && !inSingle && !inDouble) {
            return rawLine.slice(0, i);
          }
        }
        return rawLine;
      }

      function tokenizeExpression(exprText, lineNum) {
        const tokens = [];
        let i = 0;
        while (i < exprText.length) {
          const ch = exprText[i];
          if (/\s/.test(ch)) {
            i++;
            continue;
          }
          if (ch === '"' || ch === "'") {
            const quote = ch;
            let str = '';
            i++;
            let closed = false;
            while (i < exprText.length) {
              if (exprText[i] === '\\' && i + 1 < exprText.length) {
                str += exprText[i + 1];
                i += 2;
                continue;
              }
              if (exprText[i] === quote) {
                closed = true;
                i++;
                break;
              }
              str += exprText[i];
              i++;
            }
            if (!closed) {
              throw new PythonRuntimeError(
                `Tanda kutip teks (${quote}) belum ditutup pada baris ${lineNum}.`,
                lineNum
              );
            }
            tokens.push({ type: 'STRING', value: str, pos: i });
            continue;
          }
          if (/[0-9]/.test(ch)) {
            let num = '';
            let dotSeen = false;
            while (i < exprText.length && (/[0-9]/.test(exprText[i]) || exprText[i] === '.')) {
              if (exprText[i] === '.') {
                if (dotSeen) break;
                dotSeen = true;
              }
              num += exprText[i];
              i++;
            }
            tokens.push({ type: 'NUMBER', value: num, pos: i });
            continue;
          }
          if (/[a-zA-Z_]/.test(ch)) {
            let ident = '';
            while (i < exprText.length && /[a-zA-Z0-9_]/.test(exprText[i])) {
              ident += exprText[i];
              i++;
            }
            tokens.push({ type: 'IDENT', value: ident, pos: i });
            continue;
          }

          const twoChar = exprText.slice(i, i + 2);
          if (['==', '!=', '<=', '>=', '&&', '||'].includes(twoChar)) {
            tokens.push({ type: 'OP', value: twoChar, pos: i });
            i += 2;
            continue;
          }

          if (ch === '=') {
            throw new PythonRuntimeError(
              `Gunakan '==' (dua sama dengan) untuk membandingkan nilai di dalam ekspresi/kondisi pada baris ${lineNum}, bukan '='.`,
              lineNum
            );
          }

          if (['<', '>', '+', '-', '*', '/', '%', '!'].includes(ch)) {
            tokens.push({ type: 'OP', value: ch, pos: i });
            i++;
            continue;
          }
          if (ch === '(') {
            tokens.push({ type: 'LPAREN', value: ch, pos: i++ });
            continue;
          }
          if (ch === ')') {
            tokens.push({ type: 'RPAREN', value: ch, pos: i++ });
            continue;
          }
          if (ch === '[') {
            tokens.push({ type: 'LBRACKET', value: ch, pos: i++ });
            continue;
          }
          if (ch === ']') {
            tokens.push({ type: 'RBRACKET', value: ch, pos: i++ });
            continue;
          }
          if (ch === ',') {
            tokens.push({ type: 'COMMA', value: ch, pos: i++ });
            continue;
          }
          if (ch === '.') {
            tokens.push({ type: 'DOT', value: ch, pos: i++ });
            continue;
          }

          throw new PythonRuntimeError(
            `Karakter '${ch}' tidak dikenali pada baris ${lineNum}.`,
            lineNum
          );
        }
        tokens.push({ type: 'EOF', value: '', pos: exprText.length });
        return tokens;
      }

      class ExprParser {
        constructor(tokens, line) {
          this.tokens = tokens;
          this.idx = 0;
          this.line = line;
        }

        peek() {
          return this.tokens[this.idx];
        }

        advance() {
          return this.tokens[this.idx++];
        }

        parseFull() {
          const node = this.parseOr();
          if (this.peek().type !== 'EOF') {
            throw new PythonRuntimeError(
              `Sintaks ekspresi tidak terduga di dekat '${this.peek().value}' pada baris ${this.line}.`,
              this.line
            );
          }
          return node;
        }

        parseOr() {
          let left = this.parseAnd();
          while (
            (this.peek().type === 'IDENT' && this.peek().value === 'or') ||
            (this.peek().type === 'OP' && this.peek().value === '||')
          ) {
            this.advance();
            const right = this.parseAnd();
            left = { kind: 'binary', op: 'or', left, right };
          }
          return left;
        }

        parseAnd() {
          let left = this.parseNot();
          while (
            (this.peek().type === 'IDENT' && this.peek().value === 'and') ||
            (this.peek().type === 'OP' && this.peek().value === '&&')
          ) {
            this.advance();
            const right = this.parseNot();
            left = { kind: 'binary', op: 'and', left, right };
          }
          return left;
        }

        parseNot() {
          if (
            (this.peek().type === 'IDENT' && this.peek().value === 'not') ||
            (this.peek().type === 'OP' && this.peek().value === '!')
          ) {
            this.advance();
            return { kind: 'unary', op: 'not', arg: this.parseNot() };
          }
          return this.parseComparison();
        }

        parseComparison() {
          let left = this.parseAddSub();
          while (true) {
            const tok = this.peek();
            if (tok.type === 'OP' && ['==', '!=', '<', '>', '<=', '>='].includes(tok.value)) {
              const op = this.advance().value;
              const right = this.parseAddSub();
              left = { kind: 'binary', op, left, right };
            } else if (tok.type === 'IDENT' && tok.value === 'in') {
              this.advance();
              const right = this.parseAddSub();
              left = { kind: 'binary', op: 'in', left, right };
            } else if (
              tok.type === 'IDENT' &&
              tok.value === 'not' &&
              this.tokens[this.idx + 1]?.type === 'IDENT' &&
              this.tokens[this.idx + 1]?.value === 'in'
            ) {
              this.advance();
              this.advance();
              const right = this.parseAddSub();
              left = { kind: 'binary', op: 'not in', left, right };
            } else {
              break;
            }
          }
          return left;
        }

        parseAddSub() {
          let left = this.parseMulDiv();
          while (this.peek().type === 'OP' && ['+', '-'].includes(this.peek().value)) {
            const op = this.advance().value;
            const right = this.parseMulDiv();
            left = { kind: 'binary', op, left, right };
          }
          return left;
        }

        parseMulDiv() {
          let left = this.parseUnary();
          while (this.peek().type === 'OP' && ['*', '/', '%'].includes(this.peek().value)) {
            const op = this.advance().value;
            const right = this.parseUnary();
            left = { kind: 'binary', op, left, right };
          }
          return left;
        }

        parseUnary() {
          if (this.peek().type === 'OP' && ['-', '+'].includes(this.peek().value)) {
            const op = this.advance().value;
            return { kind: 'unary', op, arg: this.parseUnary() };
          }
          return this.parsePostfix();
        }

        parsePostfix() {
          let node = this.parsePrimary();
          while (true) {
            if (this.peek().type === 'DOT') {
              this.advance();
              const propTok = this.peek();
              if (propTok.type !== 'IDENT') {
                throw new PythonRuntimeError(
                  `Nama atribut diharapkan setelah tanda titik '.' pada baris ${this.line}.`,
                  this.line
                );
              }
              this.advance();
              node = { kind: 'member', object: node, prop: propTok.value };
            } else if (this.peek().type === 'LBRACKET') {
              this.advance();
              const indexExpr = this.parseOr();
              if (this.peek().type !== 'RBRACKET') {
                throw new PythonRuntimeError(
                  `Kurung siku ']' belum ditutup pada akses dictionary baris ${this.line}.`,
                  this.line
                );
              }
              this.advance();
              node = { kind: 'subscript', object: node, index: indexExpr };
            } else if (this.peek().type === 'LPAREN') {
              this.advance();
              const args = [];
              if (this.peek().type !== 'RPAREN') {
                args.push(this.parseOr());
                while (this.peek().type === 'COMMA') {
                  this.advance();
                  if (this.peek().type === 'RPAREN') break;
                  args.push(this.parseOr());
                }
              }
              if (this.peek().type !== 'RPAREN') {
                throw new PythonRuntimeError(
                  `Kurung tutup ')' belum lengkap pada pemanggilan fungsi baris ${this.line}.`,
                  this.line
                );
              }
              this.advance();
              node = { kind: 'call', callee: node, args };
            } else {
              break;
            }
          }
          return node;
        }

        parsePrimary() {
          const tok = this.peek();
          if (tok.type === 'STRING') {
            this.advance();
            return { kind: 'literal', value: tok.value };
          }
          if (tok.type === 'NUMBER') {
            this.advance();
            return { kind: 'literal', value: Number(tok.value) };
          }
          if (tok.type === 'IDENT') {
            this.advance();
            if (tok.value === 'True' || tok.value === 'true') {
              return { kind: 'literal', value: true };
            }
            if (tok.value === 'False' || tok.value === 'false') {
              return { kind: 'literal', value: false };
            }
            if (tok.value === 'None' || tok.value === 'null') {
              return { kind: 'literal', value: null };
            }
            return { kind: 'ident', name: tok.value };
          }
          if (tok.type === 'LPAREN') {
            this.advance();
            const inner = this.parseOr();
            if (this.peek().type !== 'RPAREN') {
              throw new PythonRuntimeError(
                `Kurung tutup ')' belum lengkap pada baris ${this.line}.`,
                this.line
              );
            }
            this.advance();
            return inner;
          }
          if (tok.type === 'LBRACKET') {
            this.advance();
            const elements = [];
            if (this.peek().type !== 'RBRACKET') {
              elements.push(this.parseOr());
              while (this.peek().type === 'COMMA') {
                this.advance();
                if (this.peek().type === 'RBRACKET') break;
                elements.push(this.parseOr());
              }
            }
            if (this.peek().type !== 'RBRACKET') {
              throw new PythonRuntimeError(
                `Kurung siku list ']' belum ditutup pada baris ${this.line}.`,
                this.line
              );
            }
            this.advance();
            return { kind: 'list', elements };
          }

          throw new PythonRuntimeError(
            `Ekspresi tidak valid atau kosong di dekat '${tok.value || 'akhir baris'}' pada baris ${this.line}.`,
            this.line
          );
        }
      }

      function parseExprString(text, line) {
        const tokens = tokenizeExpression(text.trim(), line);
        return new ExprParser(tokens, line).parseFull();
      }

      function preprocessLines(code) {
        const rawLines = code.replace(/\r\n/g, '\n').split('\n');
        const result = [];

        rawLines.forEach((raw, idx) => {
          const withoutComment = stripInlineComment(raw);
          if (!withoutComment.trim()) return;
          let indent = 0;
          for (const ch of withoutComment) {
            if (ch === ' ') indent += 1;
            else if (ch === '\t') indent += 4;
            else break;
          }
          result.push({
            lineNum: idx + 1,
            indent,
            content: withoutComment.trim(),
          });
        });

        return result;
      }

      function extractHeaderCondition(content, keyword, lineNum, tips) {
        let rest = content.slice(keyword.length).trim();
        if (rest.endsWith(':')) {
          rest = rest.slice(0, -1).trim();
        } else {
          tips.push({
            line: lineNum,
            message: `Tips Python (Baris ${lineNum}): Biasakan akhiri baris '${keyword} ...' dengan tanda titik dua ':' sesuai standar Python.`,
          });
        }
        if (!rest) {
          throw new PythonRuntimeError(
            `Kondisi setelah '${keyword}' masih kosong pada baris ${lineNum}.`,
            lineNum
          );
        }
        return rest;
      }

      function parseBlock(lines, startIdx, expectedIndent, tips) {
        const stmts = [];
        let idx = startIdx;

        while (idx < lines.length) {
          const line = lines[idx];
          if (line.indent < expectedIndent) {
            break;
          }
          if (line.indent > expectedIndent) {
            throw new PythonRuntimeError(
              `Indentasi (spasi menjorok) pada baris ${line.lineNum} tidak sejajar dengan blok di atasnya.`,
              line.lineNum
            );
          }

          const { content, lineNum } = line;

          if (/^if(\s|\()/.test(content)) {
            const condText = extractHeaderCondition(content, 'if', lineNum, tips);
            const cond = parseExprString(condText, lineNum);
            idx++;
            if (idx >= lines.length || lines[idx].indent <= expectedIndent) {
              throw new PythonRuntimeError(
                `Blok 'if' pada baris ${lineNum} membutuhkan baris perintah yang menjorok ke dalam (indentasi 4 spasi).`,
                lineNum
              );
            }
            const firstBody = parseBlock(lines, idx, lines[idx].indent, tips);
            idx = firstBody.nextIdx;

            const branches = [{ line: lineNum, condText, cond, body: firstBody.stmts }];
            let elseBody = null;
            let elseLine = undefined;

            while (idx < lines.length && lines[idx].indent === expectedIndent) {
              const nextLine = lines[idx];
              if (/^elif(\s|\()/.test(nextLine.content)) {
                const elifCondText = extractHeaderCondition(
                  nextLine.content,
                  'elif',
                  nextLine.lineNum,
                  tips
                );
                const elifCond = parseExprString(elifCondText, nextLine.lineNum);
                idx++;
                if (idx >= lines.length || lines[idx].indent <= expectedIndent) {
                  throw new PythonRuntimeError(
                    `Blok 'elif' pada baris ${nextLine.lineNum} membutuhkan perintah yang menjorok ke dalam.`,
                    nextLine.lineNum
                  );
                }
                const elifBlock = parseBlock(lines, idx, lines[idx].indent, tips);
                idx = elifBlock.nextIdx;
                branches.push({
                  line: nextLine.lineNum,
                  condText: elifCondText,
                  cond: elifCond,
                  body: elifBlock.stmts,
                });
              } else if (/^else\s*:?$/.test(nextLine.content)) {
                if (!nextLine.content.endsWith(':')) {
                  tips.push({
                    line: nextLine.lineNum,
                    message: `Tips Python (Baris ${nextLine.lineNum}): Gunakan 'else:' dengan tanda titik dua ':'.`,
                  });
                }
                elseLine = nextLine.lineNum;
                idx++;
                if (idx >= lines.length || lines[idx].indent <= expectedIndent) {
                  throw new PythonRuntimeError(
                    `Blok 'else' pada baris ${nextLine.lineNum} membutuhkan perintah yang menjorok ke dalam.`,
                    nextLine.lineNum
                  );
                }
                const elseBlock = parseBlock(lines, idx, lines[idx].indent, tips);
                idx = elseBlock.nextIdx;
                elseBody = elseBlock.stmts;
                break;
              } else {
                break;
              }
            }

            stmts.push({ kind: 'if', line: lineNum, branches, elseBody, elseLine });
            continue;
          }

          if (/^elif(\s|\()/.test(content)) {
            throw new PythonRuntimeError(
              `'elif' pada baris ${lineNum} tidak memiliki pasangan 'if' yang sejajar di atasnya.`,
              lineNum
            );
          }

          if (/^else(\s|:|$)/.test(content)) {
            throw new PythonRuntimeError(
              `'else' pada baris ${lineNum} tidak memiliki pasangan 'if' yang sejajar di atasnya.`,
              lineNum
            );
          }

          if (/^while(\s|\()/.test(content)) {
            const condText = extractHeaderCondition(content, 'while', lineNum, tips);
            const cond = parseExprString(condText, lineNum);
            idx++;
            if (idx >= lines.length || lines[idx].indent <= expectedIndent) {
              throw new PythonRuntimeError(
                `Blok 'while' pada baris ${lineNum} membutuhkan perintah yang menjorok ke dalam (indentasi).`,
                lineNum
              );
            }
            const bodyBlock = parseBlock(lines, idx, lines[idx].indent, tips);
            idx = bodyBlock.nextIdx;
            stmts.push({
              kind: 'while',
              line: lineNum,
              condText,
              cond,
              body: bodyBlock.stmts,
            });
            continue;
          }

          if (content === 'pass') {
            stmts.push({ kind: 'pass', line: lineNum });
            idx++;
            continue;
          }

          const assignMatch = content.match(/^([a-zA-Z_][a-zA-Z0-9_]*)\s*=\s*(?!=)(.+)$/);
          if (assignMatch) {
            const target = assignMatch[1];
            const exprStr = assignMatch[2];
            const expr = parseExprString(exprStr, lineNum);
            stmts.push({ kind: 'assign', line: lineNum, target, expr });
            idx++;
            continue;
          }

          const expr = parseExprString(content, lineNum);
          stmts.push({ kind: 'expr', line: lineNum, expr });
          idx++;
        }

        return { stmts, nextIdx: idx };
      }

      function exprCallsQueueDequeue(node) {
        if (node.kind === 'call' && node.callee.kind === 'member') {
          if (
            node.callee.object.kind === 'ident' &&
            node.callee.object.name === 'antrean' &&
            ['ambil', 'dequeue', 'pop'].includes(node.callee.prop)
          ) {
            return true;
          }
        }
        return false;
      }

      function astUsesExplicitQueue(stmts) {
        for (const s of stmts) {
          if (s.kind === 'while') return true;
          if (s.kind === 'assign' && exprCallsQueueDequeue(s.expr)) return true;
          if (s.kind === 'expr' && exprCallsQueueDequeue(s.expr)) return true;
          if (s.kind === 'if') {
            for (const b of s.branches) {
              if (astUsesExplicitQueue(b.body)) return true;
            }
            if (s.elseBody && astUsesExplicitQueue(s.elseBody)) return true;
          }
        }
        return false;
      }

      const PACKAGE_SENTINEL = Symbol('PackageWrapper');
      const ROBOT_SENTINEL = Symbol('RobotObject');
      const QUEUE_SENTINEL = Symbol('QueueObject');

      function wrapPackage(pkg) {
        return { [PACKAGE_SENTINEL]: true, pkg };
      }

      function isPackageWrapper(val) {
        return typeof val === 'object' && val !== null && PACKAGE_SENTINEL in val;
      }

      function getPackageField(pkg, field, line) {
        switch (field) {
          case 'id':
            return pkg.id;
          case 'tujuan':
            return pkg.tujuan;
          case 'berat':
            return pkg.berat;
          case 'warna':
          case 'warna_label':
            return pkg.warna;
          case 'fragile':
            return pkg.fragile;
          default:
            throw new PythonRuntimeError(
              `Atribut/Key '${field}' tidak ada pada paket (baris ${line}). Gunakan: tujuan, berat, warna, fragile, atau id.`,
              line
            );
        }
      }

      function formatPythonValue(val) {
        if (val === true) return 'True';
        if (val === false) return 'False';
        if (val === null || val === undefined) return 'None';
        if (typeof val === 'string') return `"${val}"`;
        if (isPackageWrapper(val)) {
          return `Paket(${val.pkg.id}, ${val.pkg.tujuan}, ${val.pkg.berat}kg)`;
        }
        if (Array.isArray(val)) {
          return `[${val.map(formatPythonValue).join(', ')}]`;
        }
        return String(val);
      }

      function isPythonTruthy(val) {
        if (val === null || val === undefined || val === false || val === 0 || val === '') {
          return false;
        }
        if (Array.isArray(val)) return val.length > 0;
        return true;
      }

      function evalExpr(node, ctx, line) {
        switch (node.kind) {
          case 'literal':
            return node.value;

          case 'list':
            return node.elements.map((el) => evalExpr(el, ctx, line));

          case 'ident': {
            if (node.name === 'robot') return ROBOT_SENTINEL;
            if (node.name === 'antrean') return QUEUE_SENTINEL;
            if (node.name in ctx.env) return ctx.env[node.name];
            throw new PythonRuntimeError(
              `Variabel '${node.name}' belum didefinisikan pada baris ${line}. Apakah maksudmu 'paket', 'robot', atau 'antrean'?`,
              line
            );
          }

          case 'unary': {
            const val = evalExpr(node.arg, ctx, line);
            if (node.op === 'not') return !isPythonTruthy(val);
            if (node.op === '-') return -Number(val);
            if (node.op === '+') return +Number(val);
            return val;
          }

          case 'binary': {
            if (node.op === 'and') {
              const leftVal = evalExpr(node.left, ctx, line);
              if (!isPythonTruthy(leftVal)) return false;
              return isPythonTruthy(evalExpr(node.right, ctx, line));
            }
            if (node.op === 'or') {
              const leftVal = evalExpr(node.left, ctx, line);
              if (isPythonTruthy(leftVal)) return true;
              return isPythonTruthy(evalExpr(node.right, ctx, line));
            }

            const l = evalExpr(node.left, ctx, line);
            const r = evalExpr(node.right, ctx, line);

            switch (node.op) {
              case '==':
                return l === r;
              case '!=':
                return l !== r;
              case '<':
                return Number(l) < Number(r);
              case '>':
                return Number(l) > Number(r);
              case '<=':
                return Number(l) <= Number(r);
              case '>=':
                return Number(l) >= Number(r);
              case '+':
                if (typeof l === 'string' || typeof r === 'string') {
                  return String(l) + String(r);
                }
                return Number(l) + Number(r);
              case '-':
                return Number(l) - Number(r);
              case '*':
                return Number(l) * Number(r);
              case '/':
                if (Number(r) === 0) {
                  throw new PythonRuntimeError(`Pembagian dengan nol pada baris ${line}.`, line);
                }
                return Number(l) / Number(r);
              case '%':
                return Number(l) % Number(r);
              case 'in':
                if (Array.isArray(r)) return r.includes(l);
                if (typeof r === 'string') return r.includes(String(l));
                throw new PythonRuntimeError(
                  `Operator 'in' membutuhkan list atau teks di sebelah kanan (baris ${line}).`,
                  line
                );
              case 'not in':
                if (Array.isArray(r)) return !r.includes(l);
                if (typeof r === 'string') return !r.includes(String(l));
                throw new PythonRuntimeError(
                  `Operator 'not in' membutuhkan list atau teks di sebelah kanan (baris ${line}).`,
                  line
                );
            }
            return false;
          }

          case 'member': {
            const obj = evalExpr(node.object, ctx, line);
            if (isPackageWrapper(obj)) {
              return getPackageField(obj.pkg, node.prop, line);
            }
            if (obj === null) {
              throw new PythonRuntimeError(
                `Tidak dapat membaca atribut '.${node.prop}' karena objek bernilai None/kosong pada baris ${line}.`,
                line
              );
            }
            throw new PythonRuntimeError(
              `Tidak dapat mengakses atribut '.${node.prop}' pada baris ${line}.`,
              line
            );
          }

          case 'subscript': {
            const obj = evalExpr(node.object, ctx, line);
            const idxVal = evalExpr(node.index, ctx, line);
            if (isPackageWrapper(obj)) {
              return getPackageField(obj.pkg, String(idxVal), line);
            }
            if (Array.isArray(obj)) {
              const n = Number(idxVal);
              return obj[n < 0 ? obj.length + n : n] ?? null;
            }
            throw new PythonRuntimeError(
              `Akses kurung siku '[...]' hanya berlaku untuk dictionary paket atau list pada baris ${line}.`,
              line
            );
          }

          case 'call': {
            if (node.callee.kind === 'ident') {
              const fnName = node.callee.name;
              if (fnName === 'len') {
                if (node.args.length !== 1) {
                  throw new PythonRuntimeError(`len() membutuhkan tepat 1 argumen (baris ${line}).`, line);
                }
                const target = evalExpr(node.args[0], ctx, line);
                if (target === QUEUE_SENTINEL) return ctx.workingQueue.length;
                if (Array.isArray(target) || typeof target === 'string') return target.length;
                if (isPackageWrapper(target)) return 5;
                throw new PythonRuntimeError(`Objek pada len() tidak memiliki panjang (baris ${line}).`, line);
              }

              if (fnName === 'print') {
                const vals = node.args.map((a) => {
                  const v = evalExpr(a, ctx, line);
                  return typeof v === 'string' ? v : formatPythonValue(v);
                });
                const text = vals.join(' ');
                if (ctx.activePlan) {
                  ctx.activePlan.steps.push({
                    kind: 'print',
                    line,
                    message: `print -> ${text}`,
                  });
                }
                return null;
              }

              throw new PythonRuntimeError(
                `Fungsi '${fnName}()' tidak dikenal pada baris ${line}.`,
                line
              );
            }

            if (node.callee.kind === 'member') {
              const receiver = evalExpr(node.callee.object, ctx, line);
              const method = node.callee.prop;

              if (receiver === ROBOT_SENTINEL) {
                if (method === 'kirimKeJalur' || method === 'kirim_ke_jalur') {
                  if (node.args.length !== 1) {
                    throw new PythonRuntimeError(
                      `robot.${method}() membutuhkan 1 nomor jalur (1, 2, atau 3) pada baris ${line}.`,
                      line
                    );
                  }
                  const laneArg = Number(evalExpr(node.args[0], ctx, line));
                  if (laneArg !== 1 && laneArg !== 2 && laneArg !== 3) {
                    throw new PythonRuntimeError(
                      `Nomor jalur pada robot.${method}(${laneArg}) tidak valid (baris ${line}). Pilih jalur 1, 2, atau 3!`,
                      line
                    );
                  }
                  if (!ctx.activePlan) {
                    throw new PythonRuntimeError(
                      `robot.${method}(${laneArg}) dipanggil sebelum ada paket yang diambil dari antrean (baris ${line}). Panggil paket = antrean.ambil() terlebih dahulu!`,
                      line
                    );
                  }
                  if (ctx.activePlan.chosenLane !== null) {
                    throw new PythonRuntimeError(
                      `Paket ${ctx.activePlan.pkg.id} sudah dikirim ke Jalur ${ctx.activePlan.chosenLane}, tidak bisa dikirim dua kali (baris ${line}).`,
                      line
                    );
                  }
                  const lane = laneArg;
                  ctx.activePlan.chosenLane = lane;
                  ctx.activePlan.steps.push({
                    kind: 'route',
                    line,
                    lane,
                    packageId: ctx.activePlan.pkg.id,
                    message: `robot.${method}(${lane}) -> Arahkan ${ctx.activePlan.pkg.id} ke Jalur ${lane}`,
                  });
                  return null;
                }
                throw new PythonRuntimeError(
                  `Metode 'robot.${method}()' tidak dikenal pada baris ${line}. Gunakan robot.kirimKeJalur(1 | 2 | 3).`,
                  line
                );
              }

              if (receiver === QUEUE_SENTINEL) {
                if (method === 'ambil' || method === 'dequeue' || method === 'pop') {
                  if (ctx.workingQueue.length === 0) {
                    throw new PythonRuntimeError(
                      `antrean.${method}() gagal karena antrean sudah kosong (baris ${line}). Periksa len(antrean) > 0 terlebih dahulu!`,
                      line
                    );
                  }
                  const nextPkg = ctx.workingQueue.shift();
                  const newPlan = {
                    pkg: nextPkg,
                    steps: [
                      {
                        kind: 'dequeue',
                        line,
                        packageId: nextPkg.id,
                        message: `antrean.${method}() -> Mengeluarkan ${nextPkg.id} dari DEPAN antrean (FIFO)`,
                      },
                    ],
                    chosenLane: null,
                  };
                  ctx.plans.push(newPlan);
                  ctx.activePlan = newPlan;
                  return wrapPackage(nextPkg);
                }

                if (method === 'lihat_depan' || method === 'peek') {
                  if (ctx.workingQueue.length === 0) return null;
                  return wrapPackage(ctx.workingQueue[0]);
                }

                if (method === 'ukuran') {
                  return ctx.workingQueue.length;
                }

                if (method === 'kosong') {
                  return ctx.workingQueue.length === 0;
                }

                throw new PythonRuntimeError(
                  `Metode 'antrean.${method}()' tidak dikenal pada baris ${line}. Gunakan antrean.ambil(), antrean.lihat_depan(), atau len(antrean).`,
                  line
                );
              }

              if (isPackageWrapper(receiver)) {
                if (method === 'get') {
                  if (node.args.length < 1) {
                    throw new PythonRuntimeError(`paket.get() butuh nama key (baris ${line}).`, line);
                  }
                  const key = String(evalExpr(node.args[0], ctx, line));
                  const fallback = node.args[1] ? evalExpr(node.args[1], ctx, line) : null;
                  try {
                    return getPackageField(receiver.pkg, key, line);
                  } catch (e) {
                    return fallback;
                  }
                }
                throw new PythonRuntimeError(
                  `Metode 'paket.${method}()' tidak tersedia (baris ${line}). Baca atribut langsung seperti paket.tujuan atau paket["tujuan"].`,
                  line
                );
              }
            }

            throw new PythonRuntimeError(`Pemanggilan fungsi tidak valid pada baris ${line}.`, line);
          }
        }
      }

      function execBlock(stmts, ctx) {
        for (const stmt of stmts) {
          ctx.loopGuard++;
          if (ctx.loopGuard > 600) {
            throw new PythonRuntimeError(
              `Perulangan terlalu panjang (kemungkinan infinite loop). Pastikan memanggil paket = antrean.ambil() di dalam blok while!`,
              stmt.line
            );
          }

          switch (stmt.kind) {
            case 'pass':
              break;

            case 'assign': {
              const val = evalExpr(stmt.expr, ctx, stmt.line);
              ctx.env[stmt.target] = val;
              break;
            }

            case 'expr': {
              evalExpr(stmt.expr, ctx, stmt.line);
              break;
            }

            case 'if': {
              let matched = false;
              for (let i = 0; i < stmt.branches.length; i++) {
                const br = stmt.branches[i];
                const keyword = i === 0 ? 'if' : 'elif';
                const result = isPythonTruthy(evalExpr(br.cond, ctx, br.line));
                if (ctx.activePlan) {
                  ctx.activePlan.steps.push({
                    kind: 'condition',
                    line: br.line,
                    conditionResult: result,
                    message: `${keyword} ${br.condText} => ${result ? 'True' : 'False'}`,
                  });
                }
                if (result) {
                  matched = true;
                  execBlock(br.body, ctx);
                  break;
                }
              }
              if (!matched && stmt.elseBody) {
                if (ctx.activePlan && stmt.elseLine) {
                  ctx.activePlan.steps.push({
                    kind: 'condition',
                    line: stmt.elseLine,
                    conditionResult: true,
                    message: `else: => Dijalankan`,
                  });
                }
                execBlock(stmt.elseBody, ctx);
              }
              break;
            }

            case 'while': {
              let iter = 0;
              while (true) {
                iter++;
                if (iter > 150) {
                  throw new PythonRuntimeError(
                    `Perulangan 'while' pada baris ${stmt.line} melampaui batas aman. Pastikan memanggil paket = antrean.ambil() agar antrean berkurang!`,
                    stmt.line
                  );
                }
                const condVal = isPythonTruthy(evalExpr(stmt.cond, ctx, stmt.line));
                if (!condVal) break;
                execBlock(stmt.body, ctx);
              }
              break;
            }
          }
        }
      }

      function compileAndPlanQueue(code, queue) {
        const tips = [];

        try {
          const lines = preprocessLines(code);
          if (lines.length === 0) {
            return {
              ok: false,
              plans: [],
              tips: [],
              errorLine: 1,
              errorMessage: 'Kode Python masih kosong. Tulis logika penyortiran untuk SortirBot!',
              usedExplicitQueue: false,
            };
          }

          if (lines[0].indent > 0) {
            return {
              ok: false,
              plans: [],
              tips: [],
              errorLine: lines[0].lineNum,
              errorMessage: `Baris pertama (baris ${lines[0].lineNum}) tidak boleh menjorok ke dalam (hapus spasi di awal baris).`,
              usedExplicitQueue: false,
            };
          }

          const { stmts } = parseBlock(lines, 0, 0, tips);
          const explicitQueue = astUsesExplicitQueue(stmts);

          if (explicitQueue) {
            const ctx = {
              env: {},
              workingQueue: [...queue],
              activePlan: null,
              plans: [],
              loopGuard: 0,
            };
            execBlock(stmts, ctx);
            return {
              ok: true,
              plans: ctx.plans,
              tips,
              usedExplicitQueue: true,
            };
          } else {
            const plans = [];
            const remaining = [...queue];

            while (remaining.length > 0) {
              const currentPkg = remaining.shift();
              const plan = {
                pkg: currentPkg,
                steps: [],
                chosenLane: null,
              };
              const ctx = {
                env: { paket: wrapPackage(currentPkg) },
                workingQueue: remaining,
                activePlan: plan,
                plans: [plan],
                loopGuard: 0,
              };
              execBlock(stmts, ctx);
              plans.push(plan);
            }

            return {
              ok: true,
              plans,
              tips,
              usedExplicitQueue: false,
            };
          }
        } catch (err) {
          if (err instanceof PythonRuntimeError) {
            return {
              ok: false,
              plans: [],
              tips,
              errorLine: err.line,
              errorMessage: err.message,
              usedExplicitQueue: false,
            };
          }
          return {
            ok: false,
            plans: [],
            tips,
            errorLine: 1,
            errorMessage: err instanceof Error ? err.message : 'Terjadi kesalahan sintaks Python.',
            usedExplicitQueue: false,
          };
        }
      }

      // ============================================================================
      // MODULE: IsometricWarehouse3D.jsx
      // ============================================================================
      const LABEL_COLOR_HEX = {
        Merah: 0xef4444,
        Kuning: 0xf59e0b,
        Biru: 0x3b82f6,
        Hijau: 0x10b981,
      };

      const LABEL_BADGE_TAILWIND = {
        Merah: 'bg-red-500 text-white',
        Kuning: 'bg-amber-500 text-slate-950',
        Biru: 'bg-blue-500 text-white',
        Hijau: 'bg-emerald-500 text-white',
      };

      function buildPackageGroup(pkg, isSelected) {
        const group = new THREE.Group();
        group.userData.pkgId = pkg.id;

        const weightFactor = Math.min(Math.max((pkg.berat - 4) / 18, 0), 1);
        const w = 0.78 + weightFactor * 0.24;
        const h = 0.58 + weightFactor * 0.28;
        const d = 0.74 + weightFactor * 0.22;

        const boxGeo = new THREE.BoxGeometry(w, h, d);
        const boxMat = new THREE.MeshStandardMaterial({
          color: pkg.berat >= 15 ? 0xc2854c : 0xdba065,
          roughness: 0.78,
          metalness: 0.05,
        });
        const boxMesh = new THREE.Mesh(boxGeo, boxMat);
        boxMesh.position.y = h / 2;
        boxMesh.castShadow = true;

              const pkg = queue[i];
              visibleIds.add(pkg.id);
              const isSel = pkg.id === selectedId;
              let entry = meshCache.get(pkg.id);
              if (!entry || entry.selected !== isSel) {
                if (entry) packagesContainer.remove(entry.group);
                const grp = buildPackageGroup(pkg, isSel);
                packagesContainer.add(grp);
                entry = { group: grp, selected: isSel, pkg };
                meshCache.set(pkg.id, entry);
              }
              const targetX = -3.85 - i * 1.04;
              entry.group.position.x += (targetX - entry.group.position.x) * 0.22;
              if (Math.abs(entry.group.position.x - targetX) > 3.5) {
                entry.group.position.x = targetX;
              }
              entry.group.position.y = 0.77;
              entry.group.position.z = 0;
              entry.group.rotation.y = 0;
            }

            if (active) {
              const { pkg, stage, targetLane, progress } = active;
              visibleIds.add(pkg.id);
              const isSel = pkg.id === selectedId;
              let entry = meshCache.get(pkg.id);
              if (!entry || entry.selected !== isSel) {
                if (entry) packagesContainer.remove(entry.group);
                const grp = buildPackageGroup(pkg, isSel);
                grp.position.set(-3.85, 0.77, 0);
                packagesContainer.add(grp);
                entry = { group: grp, selected: isSel, pkg };
                meshCache.set(pkg.id, entry);
              }

              if (stage === 'approaching') {
                const x = -3.85 + (-2.4 - -3.85) * progress;
                entry.group.position.set(x, 0.77, 0);
                entry.group.rotation.y = 0;
              } else if (stage === 'scanning') {
                entry.group.position.set(-2.4, 0.77, 0);
                entry.group.rotation.y = 0;
              } else if (stage === 'routing') {
                const lane = targetLane ?? 3;
                if (progress <= 0.35) {
                  const t = progress / 0.35;
                  const x = -2.4 + 2.4 * t;
                  entry.group.position.set(x, 0.84, 0);
                  entry.group.rotation.y = 0;
                } else {
                  const t = (progress - 0.35) / 0.65;
                  const dist = t * 5.95;
                  if (lane === 1) {
                    entry.group.position.set(0, 0.77, -dist);
                    entry.group.rotation.y = Math.PI / 2;
                  } else if (lane === 2) {
                    entry.group.position.set(dist, 0.77, 0);
                    entry.group.rotation.y = 0;
                  } else {
                    entry.group.position.set(0, 0.77, dist);
                    entry.group.rotation.y = -Math.PI / 2;
                  }
                }
              }
            }

            for (const [id, entry] of meshCache.entries()) {
              if (!visibleIds.has(id)) {
                packagesContainer.remove(entry.group);
                meshCache.delete(id);
              }
            }
          }

          const raycaster = new THREE.Raycaster();
          const pointer = new THREE.Vector2();
          let isDragging = false;
          let dragStartX = 0;
          let pointerDownPos = { x: 0, y: 0 };
          const activePointers = new Map();
          let initialPinchDist = null;
          let initialPinchZoom = 1.05;

          function findPkgFromIntersect(obj) {
            let cur = obj;
            while (cur) {
              if (cur.userData?.pkgId) {
                const entry = meshCache.get(cur.userData.pkgId);
                return entry ? entry.pkg : null;
              }
              cur = cur.parent;
            }
            return null;
          }

          const handlePointerDown = (e) => {
            activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
            if (activePointers.size === 2) {
              const pts = Array.from(activePointers.values());
              initialPinchDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
              initialPinchZoom = cameraParamsRef.current.targetZoom;
              isDragging = false;
              return;
            }
            isDragging = true;
            dragStartX = e.clientX;
            pointerDownPos = { x: e.clientX, y: e.clientY };
          };

          const handlePointerMove = (e) => {
            if (activePointers.has(e.pointerId)) {
              activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
            }
            if (activePointers.size === 2 && initialPinchDist) {
              const pts = Array.from(activePointers.values());
              const dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
              const scale = dist / Math.max(initialPinchDist, 10);
              cameraParamsRef.current.targetZoom = Math.min(
                Math.max(initialPinchZoom * scale, 0.65),
                1.75
              );
              setHoveredPkg(null);
              return;
            }

            const rect = renderer.domElement.getBoundingClientRect();
            if (isDragging) {
              const dx = e.clientX - dragStartX;
              dragStartX = e.clientX;
              cameraParamsRef.current.targetAzimuth -= dx * 0.0065;
              setHoveredPkg(null);
              return;
            }

            if (e.pointerType === 'touch') return;

            pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
            pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
            raycaster.setFromCamera(pointer, camera);
            const hits = raycaster.intersectObjects(packagesContainer.children, true);
            if (hits.length > 0) {
              const found = findPkgFromIntersect(hits[0].object);
              if (found) {
                renderer.domElement.style.cursor = 'pointer';
                setHoveredPkg({
                  pkg: found,
                  x: e.clientX - rect.left,
                  y: e.clientY - rect.top,
                });
                return;
              }
            }
            renderer.domElement.style.cursor = isDragging ? 'grabbing' : 'grab';
            setHoveredPkg(null);
          };

          const handlePointerUp = (e) => {
            activePointers.delete(e.pointerId);
            if (activePointers.size < 2) {
              initialPinchDist = null;
            }
            if (!isDragging) return;
            isDragging = false;
            const moveDist = Math.hypot(
              e.clientX - pointerDownPos.x,
              e.clientY - pointerDownPos.y
            );
            if (moveDist < 8) {
              const rect = renderer.domElement.getBoundingClientRect();
              pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
              pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
              raycaster.setFromCamera(pointer, camera);
              const hits = raycaster.intersectObjects(packagesContainer.children, true);
              if (hits.length > 0) {
                const found = findPkgFromIntersect(hits[0].object);
                if (found) {
                  latestPropsRef.current.onSelectPackage(found);
                }
              }
            }
          };

          const handleWheel = (e) => {
            e.preventDefault();
            const next = cameraParamsRef.current.targetZoom - e.deltaY * 0.0008;
            cameraParamsRef.current.targetZoom = Math.min(Math.max(next, 0.65), 1.75);
          };

          const domEl = renderer.domElement;
          domEl.addEventListener('pointerdown', handlePointerDown);
          window.addEventListener('pointermove', handlePointerMove);
          window.addEventListener('pointerup', handlePointerUp);
          window.addEventListener('pointercancel', handlePointerUp);
          domEl.addEventListener('wheel', handleWheel, { passive: false });

          const updateSize = () => {
            if (!container) return;
            const w = container.clientWidth || 320;
            const h = Math.max(container.clientHeight, 250);
            const asp = w / h;
            const effectiveFrustum = w < 500 ? 17.5 : frustumSize;
            camera.left = (-effectiveFrustum * asp) / 2;
            camera.right = (effectiveFrustum * asp) / 2;
            camera.top = effectiveFrustum / 2;
            camera.bottom = -effectiveFrustum / 2;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
          };
          updateSize();
          const resizeObs = new ResizeObserver(updateSize);
          resizeObs.observe(container);

          const tempVec = new THREE.Vector3();
          function projectTo2D(x, y, z) {
            const w = container?.clientWidth || 1;
            const h = container?.clientHeight || 1;
            tempVec.set(x, y, z);
            tempVec.project(camera);
            return {
              x: (tempVec.x * 0.5 + 0.5) * w,
              y: (-tempVec.y * 0.5 + 0.5) * h,
              visible: tempVec.z < 1,
            };
          }

          let frameId = 0;
          const clock = new THREE.Clock();
          let hudTick = 0;

          const animate = () => {
            frameId = requestAnimationFrame(animate);
            const dt = Math.min(clock.getDelta(), 0.05);
            const elapsed = clock.getElapsedTime();
            const {
              queuePackages: qPkgs,
              activeVisual: actVis,
              selectedPackageId: selId,
              isRunning: running,
              deliveryFeedbacks: feedbacks,
            } = latestPropsRef.current;

            const camState = cameraParamsRef.current;
            camState.azimuth += (camState.targetAzimuth - camState.azimuth) * 0.12;
            camState.zoom += (camState.targetZoom - camState.zoom) * 0.14;
            if (Math.abs(camera.zoom - camState.zoom) > 0.001) {
              camera.zoom = camState.zoom;
              camera.updateProjectionMatrix();
            }
            const radius = 22;
            camera.position.set(
              Math.cos(camState.azimuth) * radius,
              16.5,
              Math.sin(camState.azimuth) * radius
            );
            camera.lookAt(0.2, 0.5, 0);

            const beltSpeed = running || actVis ? 2.1 : 0.45;
            for (const ch of chevrons) {
              const span = ch.max - ch.min;
              let coord = ch.axis === 'x' ? ch.mesh.position.x : ch.mesh.position.z;
              coord += ch.dir * beltSpeed * dt;
              if (ch.dir > 0 && coord > ch.max) coord -= span;
              if (ch.dir < 0 && coord < ch.min) coord += span;
              if (ch.axis === 'x') ch.mesh.position.x = coord;
              else ch.mesh.position.z = coord;
            }

            const isScanningNow = actVis?.stage === 'scanning';
            laserMat.opacity = isScanningNow ? 0.34 + Math.sin(elapsed * 14) * 0.12 : 0.1;
            laserLine.position.y = isScanningNow
              ? 1.15 + Math.sin(elapsed * 10) * 0.36
              : 1.45 + Math.sin(elapsed * 2) * 0.08;

            let desiredTurntable = 0;
            let desiredRobotAngle = Math.atan2(1.28, 1.48);
            if (actVis?.stage === 'scanning') {
              desiredRobotAngle = Math.atan2(-2.4 - -1.28, 0 - -1.48);
              visorMat.color.setHex(0x22d3ee);
              visorMat.emissive.setHex(0x06b6d4);
            } else if (actVis?.stage === 'routing' && actVis.targetLane) {
              if (actVis.targetLane === 1) {
                desiredTurntable = Math.PI / 2;
                desiredRobotAngle = Math.atan2(0 - -1.28, -3.0 - -1.48);
              } else if (actVis.targetLane === 2) {
                desiredTurntable = 0;
                desiredRobotAngle = Math.atan2(3.0 - -1.28, 0 - -1.48);
              } else {
                desiredTurntable = -Math.PI / 2;
                desiredRobotAngle = Math.atan2(0 - -1.28, 3.0 - -1.48);
              }
              const expected = actVis.pkg.expectedLane;
              const ok = actVis.targetLane === expected;
              visorMat.color.setHex(ok ? 0x34d399 : 0xf87171);
              visorMat.emissive.setHex(ok ? 0x10b981 : 0xef4444);
            } else {
              visorMat.color.setHex(0x38bdf8);
              visorMat.emissive.setHex(0x0284c7);
            }

            currentTurntableAngle += (desiredTurntable - currentTurntableAngle) * 0.16;
            turntableDisc.rotation.y = currentTurntableAngle;

            currentRobotAngle += (desiredRobotAngle - currentRobotAngle) * 0.15;
            robotTurret.rotation.y = currentRobotAngle;

            robotTurret.position.y = 0.88 + Math.sin(elapsed * 3.2) * 0.025;
            const armExtend =
              actVis?.stage === 'routing' && actVis.progress > 0.2 && actVis.progress < 0.65
                ? 0.25
                : 0;
            armPivot.position.z += (0.1 + armExtend - armPivot.position.z) * 0.2;

            const nowMs = performance.now();
            [1, 2, 3].forEach((laneId) => {
              const recent = feedbacks.find(
                (f) => f.lane === laneId && nowMs - f.createdAt < 650
              );
              const truckObj = trucks[laneId];
              if (recent) {
                const age = (nowMs - recent.createdAt) / 650;
                const bounce = Math.sin(age * Math.PI * 2) * (1 - age) * 0.14;
                truckObj.position.y = Math.max(0, bounce);
              } else {
                truckObj.position.y += (0 - truckObj.position.y) * 0.2;
              }
            });

            syncPackagesInScene(qPkgs, actVis, selId);

            renderer.render(scene, camera);

            hudTick++;
            if (hudTick % 3 === 0) {
              setTruckAnchors({
                1: projectTo2D(0, 3.25, -7.45),
                2: projectTo2D(7.45, 3.25, 0),
                3: projectTo2D(0, 3.25, 7.45),
              });
              setScannerAnchor(projectTo2D(-2.4, 2.95, 0));
            }
          };

          animate();

          return () => {
            cancelAnimationFrame(frameId);
            resizeObs.disconnect();
            domEl.removeEventListener('pointerdown', handlePointerDown);
            window.removeEventListener('pointermove', handlePointerMove);
            window.removeEventListener('pointerup', handlePointerUp);
            window.removeEventListener('pointercancel', handlePointerUp);
            domEl.removeEventListener('wheel', handleWheel);
            if (renderer.domElement.parentNode === container) {
              container.removeChild(renderer.domElement);
            }
            renderer.dispose();
          };
        }, []);

        const rotateCamera = (deltaRad) => {
          cameraParamsRef.current.targetAzimuth += deltaRad;
        };

        const adjustZoom = (delta) => {
          cameraParamsRef.current.targetZoom = Math.min(
            Math.max(cameraParamsRef.current.targetZoom + delta, 0.65),
            1.75
          );
        };

        const resetCamera = () => {
          cameraParamsRef.current.targetAzimuth = Math.PI / 4;
          cameraParamsRef.current.targetZoom = 1.05;
        };

        return (
          <div className="relative w-full h-full min-h-[260px] sm:min-h-[380px] select-none overflow-hidden rounded-2xl border border-slate-200/90 bg-[#EEF2F7] shadow-sm touch-none">
            <div ref={mountRef} className="w-full h-full cursor-grab active:cursor-grabbing touch-none" />

            <div className="pointer-events-none absolute top-2.5 left-2.5 flex flex-wrap items-center gap-1.5">
              <div className="flex items-center gap-1.5 rounded-xl bg-white/90 px-2.5 py-1 text-[11px] sm:text-xs font-semibold text-slate-700 shadow-sm backdrop-blur-md border border-slate-200/80">
                <span className="inline-block h-2 w-2 rounded-full bg-amber-500 animate-pulse" />
                <span>Gudang 3D</span>
                <span className="hidden sm:inline">• SortirBot v2.6</span>
              </div>
              <div className="hidden md:flex items-center gap-1.5 rounded-xl bg-slate-900/80 px-2.5 py-1 text-[11px] font-medium text-slate-200 backdrop-blur-md">
                <Eye className="w-3.5 h-3.5 text-cyan-400" />
                <span>Geser untuk putar • Klik kardus untuk inspeksi</span>
              </div>
            </div>

            <div className="absolute top-2.5 right-2.5 flex items-center gap-0.5 sm:gap-1 rounded-xl bg-white/95 p-1 shadow-sm backdrop-blur-md border border-slate-200/80">
              <button
                type="button"
                onClick={() => rotateCamera(-Math.PI / 4)}
                title="Putar Kamera Kiri 45°"
                className="rounded-lg p-1.5 text-slate-600 hover:bg-slate-100 active:bg-slate-200 hover:text-slate-900 transition"
              >
                <RotateCcw className="w-3.5 h-3.5 sm:w-4 sm:h-4" />
              </button>
              <button
                type="button"
                onClick={() => rotateCamera(Math.PI / 4)}
                title="Putar Kamera Kanan 45°"
                className="rounded-lg p-1.5 text-slate-600 hover:bg-slate-100 active:bg-slate-200 hover:text-slate-900 transition"
              >
                <RotateCw className="w-3.5 h-3.5 sm:w-4 sm:h-4" />
              </button>
              <div className="h-4 w-px bg-slate-200 mx-0.5" />
              <button
                type="button"
                onClick={() => adjustZoom(0.15)}
                title="Perbesar (Zoom In)"
                className="rounded-lg p-1.5 text-slate-600 hover:bg-slate-100 active:bg-slate-200 hover:text-slate-900 transition"
              >
                <ZoomIn className="w-3.5 h-3.5 sm:w-4 sm:h-4" />
              </button>
              <button
                type="button"
                onClick={() => adjustZoom(-0.15)}
                title="Perkecil (Zoom Out)"
                className="rounded-lg p-1.5 text-slate-600 hover:bg-slate-100 active:bg-slate-200 hover:text-slate-900 transition"
              >
                <ZoomOut className="w-3.5 h-3.5 sm:w-4 sm:h-4" />
              </button>
              <button
                type="button"
                onClick={resetCamera}
                title="Reset Sudut Isometri"
                className="rounded-lg px-2 py-1 text-[10px] sm:text-[11px] font-semibold text-slate-700 hover:bg-amber-100 active:bg-amber-200 hover:text-amber-900 transition"
              >
                Reset
              </button>
            </div>

            {activeVisual && scannerAnchor.visible && (
              <div
                style={{
                  left: `${scannerAnchor.x}px`,
                  top: `${scannerAnchor.y}px`,
                }}
                className="pointer-events-none absolute -translate-x-1/2 -translate-y-full z-10 transition-all duration-75"
              >
                <div className="flex items-center gap-1 rounded-lg bg-slate-900/92 px-2 py-0.5 sm:px-2.5 sm:py-1 text-[10px] sm:text-[11px] font-mono-code text-cyan-300 shadow-lg border border-cyan-500/40 whitespace-nowrap">
                  <Sparkles className="w-3 h-3 text-cyan-400 animate-spin shrink-0" />
                  <span>
                    {activeVisual.stage === 'scanning'
                      ? `SCAN: ${activeVisual.pkg.id} (${activeVisual.pkg.tujuan})`
                      : activeVisual.targetLane
                      ? `${activeVisual.pkg.id} → Jalur ${activeVisual.targetLane}`
                      : `${activeVisual.pkg.id}`}
                  </span>
                </div>
              </div>
            )}

            {laneRules.map((rule) => {
              const anchor = truckAnchors[rule.lane];
              if (!anchor?.visible) return null;
              const stat = laneStats[rule.lane];
              const latestToast = deliveryFeedbacks
                .filter((f) => f.lane === rule.lane)
                .slice(-1)[0];

              return (
                <div
                  key={rule.lane}
                  style={{
                    left: `${anchor.x}px`,
                    top: `${anchor.y}px`,
                  }}
                  className="pointer-events-none absolute -translate-x-1/2 -translate-y-full z-10 flex flex-col items-center gap-0.5 sm:gap-1"
                >
                  {latestToast && (
                    <div
                      key={latestToast.uid}
                      className={`animate-bounce rounded-full px-2 py-0.5 text-[10px] sm:text-[11px] font-bold shadow-md whitespace-nowrap ${
                        latestToast.correct
                          ? 'bg-emerald-500 text-white'
                          : 'bg-rose-600 text-white'
                      }`}
                    >
                      {latestToast.correct
                        ? `✓ ${latestToast.pkgId} +100`
                        : `✗ ${latestToast.pkgId} Salah!`}
                    </div>
                  )}

                  <div className="rounded-xl bg-white/95 px-2 py-1 sm:px-2.5 sm:py-1.5 shadow-md border border-slate-200/90 backdrop-blur-sm text-center min-w-[96px] sm:min-w-[128px]">
                    <div className="flex items-center justify-between gap-1.5">
                      <span
                        style={{ backgroundColor: rule.accentHex }}
                        className="rounded px-1.5 py-0.5 text-[9px] sm:text-[10px] font-extrabold uppercase tracking-wider text-white"
                      >
                        Jalur {rule.lane}
                      </span>
                      <span className="text-[10px] sm:text-[11px] font-bold text-slate-700 font-mono-code">
                        {stat.correct}✓ {stat.wrong > 0 ? `${stat.wrong}✗` : ''}
                      </span>
                    </div>
                    <div className="hidden sm:block mt-0.5 text-[11px] font-semibold text-slate-800 font-mono-code truncate max-w-[155px]">
                      {rule.badge}
                    </div>
                  </div>
                </div>
              );
            })}

            {hoveredPkg && (
              <div
                style={{
                  left: `${Math.min(hoveredPkg.x + 14, 240)}px`,
                  top: `${Math.max(hoveredPkg.y - 12, 12)}px`,
                }}
                className="pointer-events-none absolute z-20 rounded-xl bg-slate-900/95 px-3 py-2 text-xs text-slate-100 shadow-xl border border-slate-700 backdrop-blur-md"
              >
                <div className="flex items-center justify-between gap-3 border-b border-slate-700/80 pb-1 mb-1">
                  <span className="font-mono-code font-bold text-amber-400">{hoveredPkg.pkg.id}</span>
                  <span
                    className={`rounded px-1.5 py-0.2 text-[10px] font-bold ${
                      LABEL_BADGE_TAILWIND[hoveredPkg.pkg.warna]
                    }`}
                  >
                    {hoveredPkg.pkg.warna}
                  </span>
                </div>
                <div className="font-mono-code text-[11px] space-y-0.5">
                  <div>
                    <span className="text-slate-400">tujuan:</span>{' '}
                    <span className="text-emerald-300">"{hoveredPkg.pkg.tujuan}"</span>
                  </div>
                  <div>
                    <span className="text-slate-400">berat:</span>{' '}
                    <span className="text-cyan-300">{hoveredPkg.pkg.berat}</span> kg
                  </div>
                  <div>
                    <span className="text-slate-400">fragile:</span>{' '}
                    <span className={hoveredPkg.pkg.fragile ? 'text-rose-400 font-bold' : 'text-slate-300'}>
                      {hoveredPkg.pkg.fragile ? 'True' : 'False'}
                    </span>
                  </div>
                </div>
              </div>
            )}

            <div className="pointer-events-none absolute bottom-2.5 left-3 hidden md:flex items-center gap-3 rounded-xl bg-white/88 px-3 py-1.5 text-[11px] text-slate-600 border border-slate-200/80 backdrop-blur-sm">
              <span className="flex items-center gap-1 font-medium">
                <span className="inline-block w-2.5 h-2.5 rounded-sm bg-red-600" /> Pita Merah ={' '}
                <code className="font-mono-code text-slate-800">fragile: True</code>
              </span>
              <span className="text-slate-300">|</span>
              <span className="flex items-center gap-1 font-medium">
                <span className="inline-block w-2.5 h-2.5 rounded-sm bg-slate-800" /> Sabuk Hitam ={' '}
                <code className="font-mono-code text-slate-800">berat &gt;= 12kg</code>
              </span>
            </div>
          </div>
        );
      };

      // ============================================================================
      // MODULE: LearningDrawer.jsx
      // ============================================================================
      const LearningDrawer = ({ open, onClose }) => {
        const [activeTab, setActiveTab] = useState('objdict');
        const [condA, setCondA] = useState(true);
        const [condB, setCondB] = useState(false);

        if (!open) return null;

        const resAnd = condA && condB;
        const resOr = condA || condB;
        const resNotA = !condA;

        return (
          <div className="fixed inset-0 z-50 flex justify-end bg-slate-900/45 backdrop-blur-sm">
            <div className="relative flex h-full w-full max-w-xl flex-col bg-white shadow-2xl border-l border-slate-200">
              <div className="flex items-center justify-between border-b border-slate-200 px-5 py-4 bg-slate-50">
                <div className="flex items-center gap-2.5">
                  <div className="flex h-9 w-9 items-center justify-center rounded-xl bg-amber-500 text-slate-950 shadow-sm">
                    <BookOpen className="w-5 h-5" />
                  </div>
                  <div>
                    <h2 className="font-display text-base font-bold text-slate-900">
                      Modul Materi Python • SortirBot
                    </h2>
                    <p className="text-xs text-slate-500">
                      Referensi interaktif Objek/Dictionary, Logika, & Queue (FIFO)
                    </p>
                  </div>
                </div>
                <button
                  type="button"
                  onClick={onClose}

      function highlightPythonLine(line) {
        let codePart = line;
        let commentPart = '';
        let inSingle = false;
        let inDouble = false;
        for (let i = 0; i < line.length; i++) {
          const ch = line[i];
          if (ch === "'" && !inDouble) inSingle = !inSingle;
          else if (ch === '"' && !inSingle) inDouble = !inDouble;
          else if (ch === '#' && !inSingle && !inDouble) {
            codePart = line.slice(0, i);
            commentPart = line.slice(i);
            break;
          }
        }

        const tokens = [];
        const tokenRegex =
          /("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*'|\b(?:if|elif|else|while|and|or|not|in|pass)\b|\b(?:True|False|true|false|None)\b|\b(?:paket|robot|antrean|len|print)\b|\b(?:kirimKeJalur|kirim_ke_jalur|ambil|lihat_depan|ukuran|kosong)\b|\b\d+(?:\.\d+)?\b)/g;

        let lastIndex = 0;
        let match;
        let keyIdx = 0;

        while ((match = tokenRegex.exec(codePart)) !== null) {
          if (match.index > lastIndex) {
            tokens.push(
              <span key={`t-${keyIdx++}`} className="text-slate-200">
                {codePart.slice(lastIndex, match.index)}
              </span>
            );
          }
          const word = match[0];
          let cls = 'text-slate-200';
          if (word.startsWith('"') || word.startsWith("'")) {
            cls = 'text-emerald-300';
          } else if (/^(if|elif|else|while|and|or|not|in|pass)$/.test(word)) {
            cls = 'text-pink-400 font-semibold';
          } else if (/^(True|False|true|false|None)$/.test(word)) {
            cls = 'text-amber-300 font-semibold';
          } else if (/^(paket|robot|antrean|len|print)$/.test(word)) {
            cls = 'text-cyan-300';
          } else if (/^(kirimKeJalur|kirim_ke_jalur|ambil|lihat_depan|ukuran|kosong)$/.test(word)) {
            cls = 'text-sky-300';
          } else if (/^\d/.test(word)) {
            cls = 'text-purple-300';
          }
          tokens.push(
            <span key={`m-${keyIdx++}`} className={cls}>
              {word}
            </span>
          );
          lastIndex = tokenRegex.lastIndex;
        }

        if (lastIndex < codePart.length) {
          tokens.push(
            <span key={`r-${keyIdx++}`} className="text-slate-200">
              {codePart.slice(lastIndex)}
            </span>
          );
        }

        if (commentPart) {
          tokens.push(
            <span key="comment" className="text-slate-500 italic">
              {commentPart}
            </span>
          );
        }

        return tokens;
      }

      const PythonEditor = ({
        code,
        onChange,
        activeLine,
        errorLine,
        onResetCode,
        onLoadSolution,
        hintText,
        readOnly,
      }) => {
        const textareaRef = useRef(null);
        const backdropRef = useRef(null);
        const gutterRef = useRef(null);
        const [showHint, setShowHint] = useState(false);

        const lines = code.split('\n');

        const syncScroll = () => {
          if (!textareaRef.current) return;
          const top = textareaRef.current.scrollTop;
          const left = textareaRef.current.scrollLeft;
          if (backdropRef.current) {
            backdropRef.current.scrollTop = top;
            backdropRef.current.scrollLeft = left;
          }
          if (gutterRef.current) {
            gutterRef.current.scrollTop = top;
          }
        };

        const insertSnippet = (snippet) => {
          if (readOnly) return;
          const el = textareaRef.current;
          if (!el) {
            onChange(code + snippet);
            return;
          }
          const start = el.selectionStart;
          const end = el.selectionEnd;
          const next = code.slice(0, start) + snippet + code.slice(end);
          onChange(next);
          requestAnimationFrame(() => {
            el.focus();
            const pos = start + snippet.length;
            el.setSelectionRange(pos, pos);
          });
        };

        const handleKeyDown = (e) => {
          if (readOnly) return;
          const el = e.currentTarget;
          const start = el.selectionStart;
          const end = el.selectionEnd;

          if (e.key === 'Tab') {
            e.preventDefault();
            const next = code.slice(0, start) + '    ' + code.slice(end);
            onChange(next);
            requestAnimationFrame(() => {
              el.selectionStart = el.selectionEnd = start + 4;
            });
            return;
          }

          if (e.key === 'Enter') {
            e.preventDefault();
            const before = code.slice(0, start);
            const currentLine = before.split('\n').pop() ?? '';
            const indentMatch = currentLine.match(/^\s*/);
            let indent = indentMatch ? indentMatch[0] : '';
            const trimmed = currentLine.replace(/#.*$/, '').trim();
            if (trimmed.endsWith(':')) {
              indent += '    ';
            }
            const insertion = '\n' + indent;
            const next = code.slice(0, start) + insertion + code.slice(end);
            onChange(next);
            requestAnimationFrame(() => {
              const pos = start + insertion.length;
              el.selectionStart = el.selectionEnd = pos;
            });
          }
        };

      // ============================================================================
      // MODULE: App.jsx
