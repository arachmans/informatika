      function nowTimeStr() {
        const d = new Date();
        return d.toTimeString().slice(0, 8);
      }

      function App() {
        const [levelIdx, setLevelIdx] = useState(0);
        const currentLevel = LEVELS[levelIdx];

        const [codeByLevel, setCodeByLevel] = useState(() => {
          const map = {};
          LEVELS.forEach((lv) => {
            map[lv.id] = lv.starterCode;
          });
          return map;
        });
        const currentCode = codeByLevel[currentLevel.id] ?? currentLevel.starterCode;

        const [completedLevels, setCompletedLevels] = useState(() => new Set());

        const [baseQueue, setBaseQueue] = useState(() => buildLevelQueue(LEVELS[0]));
        const [displayQueue, setDisplayQueue] = useState(() => buildLevelQueue(LEVELS[0]));

        const [activeVisual, setActiveVisual] = useState(null);
        const [selectedPkg, setSelectedPkg] = useState(() => buildLevelQueue(LEVELS[0])[0] ?? null);

        const [mode, setMode] = useState('idle');
        const [speed, setSpeed] = useState(1);
        const [activeLine, setActiveLine] = useState(null);
        const [errorLine, setErrorLine] = useState(null);
        const [logs, setLogs] = useState([]);
        const [laneStats, setLaneStats] = useState({
          1: { correct: 0, wrong: 0 },
          2: { correct: 0, wrong: 0 },
          3: { correct: 0, wrong: 0 },
        });
        const [score, setScore] = useState(0);
        const [deliveryFeedbacks, setDeliveryFeedbacks] = useState([]);

        const [soundEnabled, setSoundEnabled] = useState(true);
        const [drawerOpen, setDrawerOpen] = useState(false);
        const [customCounter, setCustomCounter] = useState(1);

        // Mobile view mode ('split' = keduanya tampil vertikal, '3d' = fokus gudang, 'code' = fokus koding)
        const [mobileTab, setMobileTab] = useState('split');
        const [showBriefMobile, setShowBriefMobile] = useState(false);

        const cursorRef = useRef(null);
        const consoleEndRef = useRef(null);
        const warehouseSectionRef = useRef(null);

        const pushLog = useCallback((type, message, line) => {
          setLogs((prev) => [
            ...prev.slice(-80),
            {
              id: `${Date.now()}-${Math.random().toString(36).slice(2, 7)}`,
              timestamp: nowTimeStr(),
              type,
              line,
              message,
            },
          ]);
        }, []);

        useEffect(() => {
          consoleEndRef.current?.scrollIntoView({ behavior: 'smooth' });
        }, [logs]);

        const resetSimulationState = useCallback((queueToUse) => {
          cursorRef.current = null;
          setMode('idle');
          setDisplayQueue(queueToUse);
          setActiveVisual(null);
          setSelectedPkg(queueToUse[0] ?? null);
          setActiveLine(null);
          setErrorLine(null);
          setLaneStats({
            1: { correct: 0, wrong: 0 },
            2: { correct: 0, wrong: 0 },
            3: { correct: 0, wrong: 0 },
          });
          setDeliveryFeedbacks([]);
        }, []);

        const selectLevel = (idx) => {
          const lv = LEVELS[idx];
          setLevelIdx(idx);
          const fresh = buildLevelQueue(lv);
          setBaseQueue(fresh);
          resetSimulationState(fresh);
          setLogs([
            {
              id: `init-${lv.id}`,
              timestamp: nowTimeStr(),
              type: 'info',
              message: `Memuat ${lv.title} — ${fresh.length} paket siap di antrean konveyor.`,
            },
          ]);
        };

        useEffect(() => {
          setLogs([
            {
              id: 'welcome-1',
              timestamp: nowTimeStr(),
              type: 'info',
              message:
                'Sistem SortirBot 3D aktif! Periksa aturan jalur di atas, lengkapi kode Python, lalu klik "Jalankan Kode".',
            },
          ]);
        }, []);

        const handleCodeChange = (next) => {
          setCodeByLevel((prev) => ({ ...prev, [currentLevel.id]: next }));
          if (errorLine !== null) setErrorLine(null);
        };

        const handleEnqueueCustom = (raw) => {
          const newId = `UJI-${10 + customCounter}`;
          const newPkg = {
            id: newId,
            ...raw,
            expectedLane: currentLevel.evaluateExpectedLane({ id: newId, ...raw }),
          };
          setCustomCounter((c) => c + 1);
          const updatedBase = [...baseQueue, newPkg];
          setBaseQueue(updatedBase);

          if (mode === 'idle' || mode === 'completed' || mode === 'error') {
            const updatedDisp = [...displayQueue, newPkg];
            setDisplayQueue(updatedDisp);
            setSelectedPkg(newPkg);
          }
          pushLog(
            'info',
            `antrean.enqueue(${newPkg.id}) -> Paket uji (${newPkg.tujuan}, ${newPkg.berat}kg, ${newPkg.warna}, fragile=${newPkg.fragile ? 'True' : 'False'}) masuk ke BELAKANG antrean.`
          );
        };

        const initializeSession = useCallback(() => {
          const freshQueue = [...baseQueue];
          setDisplayQueue(freshQueue);
          setActiveVisual(null);
          setErrorLine(null);
          setActiveLine(null);
          setLaneStats({
            1: { correct: 0, wrong: 0 },
            2: { correct: 0, wrong: 0 },
            3: { correct: 0, wrong: 0 },
          });
          setDeliveryFeedbacks([]);

          const compiled = compileAndPlanQueue(currentCode, freshQueue);
          if (!compiled.ok) {
            setErrorLine(compiled.errorLine ?? 1);
            setMode('error');
            soundFx.playWrong();
            pushLog(
              'error',
              `Syntax / Runtime Error: ${compiled.errorMessage}`,
              compiled.errorLine
            );
            return false;
          }

          compiled.tips.forEach((tip) => {
            pushLog('tip', tip.message, tip.line);
          });

          if (compiled.plans.length === 0) {
            setMode('error');
            soundFx.playWrong();
            pushLog(
              'error',
              'Tidak ada paket yang diproses! Pastikan memanggil paket = antrean.ambil() di dalam perulangan while.'
            );
            return false;
          }

          cursorRef.current = {
            plans: compiled.plans,
            initialTotal: freshQueue.length,
            planIdx: 0,
            stage: 'approaching',
            stepIdx: 0,
            progress: 0,
            scanLogged: false,
          };

          const firstPlan = compiled.plans[0];
          setDisplayQueue(freshQueue.slice(1));
          setSelectedPkg(firstPlan.pkg);
          setActiveVisual({
            pkg: firstPlan.pkg,
            stage: 'approaching',
            targetLane: null,
            progress: 0,
          });
          pushLog(
            'info',
            `Memulai eksekusi sortir_bot.py untuk ${freshQueue.length} paket dalam antrean FIFO...`
          );
          return true;
        }, [baseQueue, currentCode, pushLog]);

        const finalizeCurrentPackage = useCallback(
          (cur) => {
            const plan = cur.plans[cur.planIdx];
            const pkg = plan.pkg;
            const laneUsed = plan.chosenLane ?? 3;
            const isCorrect = plan.chosenLane !== null && plan.chosenLane === pkg.expectedLane;

            setLaneStats((prev) => {
              const nextLane = { ...prev[laneUsed] };
              if (isCorrect) nextLane.correct += 1;
              else nextLane.wrong += 1;
              return { ...prev, [laneUsed]: nextLane };
            });

            setDeliveryFeedbacks((prev) => [
              ...prev.slice(-8),
              {
                uid: `${pkg.id}-${Date.now()}`,
                lane: laneUsed,
                correct: isCorrect,
                pkgId: pkg.id,
                createdAt: performance.now(),
              },
            ]);

            if (isCorrect) {
              soundFx.playSuccess();
              setScore((s) => s + 100);
              pushLog(
                'success',
                `✓ TEPAT! ${pkg.id} masuk ke Truk Jalur ${laneUsed} (+100 poin).`
              );
            } else if (plan.chosenLane === null) {
              soundFx.playWrong();
              pushLog(
                'error',
                `✗ TANPA PERINTAH! ${pkg.id} tidak dikirim oleh robot.kirimKeJalur(), dialihkan darurat ke Jalur 3 (Seharusnya Jalur ${pkg.expectedLane}).`
              );
            } else {
              soundFx.playWrong();
              pushLog(
                'error',
                `✗ SALAH JALUR! ${pkg.id} (${pkg.tujuan}, ${pkg.berat}kg, ${pkg.warna}, fragile=${
                  pkg.fragile ? 'True' : 'False'
                }) dikirim ke Jalur ${plan.chosenLane}, seharusnya Jalur ${pkg.expectedLane}.`
              );
            }

            const nextIdx = cur.planIdx + 1;
            if (nextIdx < cur.plans.length) {
              cur.planIdx = nextIdx;
              cur.stage = 'approaching';
              cur.stepIdx = 0;
              cur.progress = 0;
              cur.scanLogged = false;

              const nextPlan = cur.plans[nextIdx];
              setDisplayQueue(baseQueue.slice(nextIdx + 1));
              setSelectedPkg(nextPlan.pkg);
              setActiveLine(null);
              setActiveVisual({
                pkg: nextPlan.pkg,
                stage: 'approaching',
                targetLane: null,
                progress: 0,
              });
            } else {
              cursorRef.current = null;
              setActiveVisual(null);
              setActiveLine(null);
              setMode('completed');

              const remainingUnprocessed = cur.initialTotal - cur.plans.length;
              if (remainingUnprocessed > 0) {
                pushLog(
                  'error',
                  `Program selesai lebih awal, masih tersisa ${remainingUnprocessed} paket di antrean! Gunakan while len(antrean) > 0: agar seluruh paket diambil.`
                );
              }
            }
          },
          [baseQueue, pushLog]
        );

        const executeDiscreteScannerStep = useCallback(
          (cur) => {
            const plan = cur.plans[cur.planIdx];
            if (!cur.scanLogged) {
              cur.scanLogged = true;
              soundFx.playScan();
              pushLog(
                'scan',
                `SCAN ${plan.pkg.id} -> { tujuan: "${plan.pkg.tujuan}", berat: ${
                  plan.pkg.berat
                }, warna: "${plan.pkg.warna}", fragile: ${plan.pkg.fragile ? 'True' : 'False'} }`
              );
              if (plan.steps.length === 0) {
                cur.stage = 'routing';
                cur.progress = 0;
                soundFx.playRobotServo();
                setActiveVisual({
                  pkg: plan.pkg,
                  stage: 'routing',
                  targetLane: plan.chosenLane ?? 3,
                  progress: 0,
                });
              }
              return;
            }

            if (cur.stepIdx < plan.steps.length) {
              const step = plan.steps[cur.stepIdx];
              cur.stepIdx += 1;
              setActiveLine(step.line);

              if (step.kind === 'condition') {
                soundFx.playStepTick(step.conditionResult);
                pushLog('condition', step.message, step.line);
              } else if (step.kind === 'print') {
                soundFx.playStepTick();
                pushLog('print', step.message, step.line);
              } else if (step.kind === 'dequeue') {
                soundFx.playStepTick(true);
                pushLog('action', step.message, step.line);
              } else if (step.kind === 'route') {
                soundFx.playRobotServo();
                pushLog('action', step.message, step.line);
              }
            } else {
              cur.stage = 'routing';
              cur.progress = 0;
              soundFx.playRobotServo();
              setActiveVisual({
                pkg: plan.pkg,
                stage: 'routing',
                targetLane: plan.chosenLane ?? 3,
                progress: 0,
              });
            }
          },
          [pushLog]
        );

        useEffect(() => {
          if (mode !== 'running') return;

          let animId = 0;
          let lastTime = performance.now();
          let scanStepAccumulator = 0;

          const tick = (now) => {
            const dt = Math.min((now - lastTime) / 1000, 0.08);
            lastTime = now;

            const cur = cursorRef.current;
            if (!cur) return;
            const plan = cur.plans[cur.planIdx];

            if (cur.stage === 'approaching') {
              cur.progress += dt * 2.7 * speed;
              if (cur.progress >= 1) {
                cur.progress = 0;
                cur.stage = 'scanning';
                scanStepAccumulator = 0.5;
                setActiveVisual({
                  pkg: plan.pkg,
                  stage: 'scanning',
                  targetLane: null,
                  progress: 0,
                });
              } else {
                setActiveVisual({
                  pkg: plan.pkg,
                  stage: 'approaching',
                  targetLane: null,
                  progress: cur.progress,
                });
              }
            } else if (cur.stage === 'scanning') {
              scanStepAccumulator += dt * speed;
              const interval = 0.44;
              if (scanStepAccumulator >= interval) {
                scanStepAccumulator = 0;
                executeDiscreteScannerStep(cur);
              }
            } else if (cur.stage === 'routing') {
              cur.progress += dt * 1.45 * speed;
              if (cur.progress >= 1) {
                finalizeCurrentPackage(cur);
              } else {
                setActiveVisual({
                  pkg: plan.pkg,
                  stage: 'routing',
                  targetLane: plan.chosenLane ?? 3,
                  progress: cur.progress,
                });
              }
            }

            if (cursorRef.current) {
              animId = requestAnimationFrame(tick);
            }
          };

          animId = requestAnimationFrame(tick);
          return () => cancelAnimationFrame(animId);
        }, [mode, speed, executeDiscreteScannerStep, finalizeCurrentPackage]);

        const summaryStats = useMemo(() => {
          const totalCorrect =
            laneStats[1].correct + laneStats[2].correct + laneStats[3].correct;
          const totalWrong = laneStats[1].wrong + laneStats[2].wrong + laneStats[3].wrong;
          const totalSorted = totalCorrect + totalWrong;
          const totalExpected = baseQueue.length;
          const accuracy =
            totalSorted > 0 ? Math.round((totalCorrect / totalSorted) * 100) : 0;
          const isPerfect =
            mode === 'completed' &&
            totalCorrect === totalExpected &&
            totalWrong === 0 &&
            totalExpected > 0;
          return { totalCorrect, totalWrong, totalSorted, totalExpected, accuracy, isPerfect };
        }, [laneStats, baseQueue.length, mode]);

        useEffect(() => {
          if (summaryStats.isPerfect) {
            soundFx.playLevelComplete();
            setCompletedLevels((prev) => {
              const next = new Set(prev);
              next.add(currentLevel.id);
              return next;
            });
          }
        }, [summaryStats.isPerfect, currentLevel.id]);

        const handleRunOrPause = () => {
          if (mode === 'running') {
            setMode('paused');
            pushLog('info', 'Simulasi dijeda. Klik "Lanjutkan" atau "Langkah" untuk meneruskan.');
            return;
          }
          if (mode === 'paused' && cursorRef.current) {
            setMode('running');
            return;
          }
          if (initializeSession()) {
            setMode('running');
            // Di HP jika sedang tab fokus 'code', pindah otomatis ke 'split' agar robot 3D terlihat beraksi
            if (mobileTab === 'code') {
              setMobileTab('split');
            }
          }
        };

        const handleStepOnce = () => {
          if (mode === 'running') {
            setMode('paused');
            return;
          }
          if (!cursorRef.current) {
            if (!initializeSession()) return;
            setMode('paused');
            if (mobileTab === 'code') {
              setMobileTab('split');
            }
            return;
          }

          setMode('paused');
          const cur = cursorRef.current;
          const plan = cur.plans[cur.planIdx];

          if (cur.stage === 'approaching') {
            cur.stage = 'scanning';
            cur.progress = 0;
            setActiveVisual({
              pkg: plan.pkg,
              stage: 'scanning',
              targetLane: null,
              progress: 0,
            });
            executeDiscreteScannerStep(cur);
          } else if (cur.stage === 'scanning') {
            executeDiscreteScannerStep(cur);
          } else if (cur.stage === 'routing') {
            finalizeCurrentPackage(cur);
          }
        };

        const handleResetRun = () => {
          const fresh = buildLevelQueue(currentLevel);
          setBaseQueue(fresh);
          resetSimulationState(fresh);
          pushLog('info', 'Konveyor dan antrean paket telah diatur ulang.');

          const next = !soundEnabled;
          soundFx.enabled = next;
          setSoundEnabled(next);
        };

        return (
          <div className="min-h-screen flex flex-col bg-[#F4F6F9] text-slate-900 pb-20 lg:pb-4">
            {/* TOP NAVIGATION & LEVEL BAR */}
            <header className="sticky top-0 z-30 border-b border-slate-200/90 bg-white/95 backdrop-blur-md">
              <div className="mx-auto flex max-w-[1440px] flex-col sm:flex-row sm:items-center sm:justify-between gap-2 px-3 sm:px-4 py-2">
                {/* Baris Atas Mobile: Brand + Skor + Tombol Aksi */}
                <div className="flex items-center justify-between gap-2">
                  <div className="flex items-center gap-2">
                    <div className="flex h-8 w-8 sm:h-9 sm:w-9 items-center justify-center rounded-xl bg-amber-500 text-slate-950 shadow-sm shrink-0">
                      <Cpu className="w-4 h-4 sm:w-5 sm:h-5" />
                    </div>
                    <div>
                      <div className="flex items-center gap-1.5">
                        <h1 className="font-display text-sm sm:text-base font-bold tracking-tight text-slate-950">

                        </h1>
                        <span className="rounded bg-slate-900 px-1.5 py-0.5 text-[9px] sm:text-[10px] font-mono-code font-semibold text-amber-400">
                          PYTHON
                        </span>
                      </div>
                      <p className="text-[11px] text-slate-500 hidden xl:block">
                        Belajar Objek/Dict, Logika, & Antrean (Queue) di Gudang Logistik Isometrik
                      </p>
                    </div>
                  </div>

                  {/* Skor Ringkas di HP + Sound + Materi */}
                  <div className="flex items-center gap-1.5 sm:hidden">
                    <div className="flex items-center gap-1.5 rounded-lg border border-slate-200 bg-slate-50 px-2 py-1 text-[11px]">
                      <Trophy className="w-3.5 h-3.5 text-amber-500 shrink-0" />
                      <span className="font-mono-code font-bold text-slate-900">{score}</span>
                      <span className="text-slate-300">|</span>
                      <strong className="font-mono-code text-emerald-600">
                        {summaryStats.totalCorrect}/{summaryStats.totalExpected}
                      </strong>
                    </div>

                    <button
                      type="button"
                      onClick={toggleSound}
                      aria-label="Toggle Suara"
                      className="rounded-lg border border-slate-200 bg-white p-1.5 text-slate-600 active:bg-slate-100"
                    >
                      {soundEnabled ? (
                        <Volume2 className="w-4 h-4 text-slate-700" />
                      ) : (
                        <VolumeX className="w-4 h-4 text-slate-400" />
                      )}
                    </button>

                    <button
                      type="button"
                      onClick={() => setDrawerOpen(true)}
                      className="inline-flex items-center gap-1 rounded-lg bg-amber-500 px-2.5 py-1.5 text-[11px] font-bold text-slate-950 shadow-sm active:bg-amber-400"
                    >
                      <BookOpen className="w-3.5 h-3.5" />
                      <span>Materi</span>
                    </button>
                  </div>
                </div>

                {/* Baris Pemilihan Level (Mudah di-scroll di HP) */}
                <nav className="flex items-center gap-1 rounded-xl bg-slate-100 p-1 border border-slate-200/80 overflow-x-auto no-scrollbar">

                      <button

                          active
                            ? 'bg-slate-900 text-amber-400 shadow-sm'

                            : 'text-slate-600 hover:bg-white/80 hover:text-slate-900'

                        <span>Lv.{lv.id}</span>

                </nav>

                {/* Skor & Tombol Materi di Tablet/Desktop */}
                <div className="hidden sm:flex items-center gap-2">

                    {soundEnabled ? (
                      <Volume2 className="w-4 h-4 text-slate-700" />

                      <VolumeX className="w-4 h-4 text-slate-400" />

                  </button>

                  <button
                    type="button"
                    onClick={() => setDrawerOpen(true)}
                    className="inline-flex items-center gap-1.5 rounded-xl bg-amber-500 px-3 py-2 text-xs font-bold text-slate-950 shadow-sm hover:bg-amber-400 transition"

                    <BookOpen className="w-4 h-4" />
                    <span>Materi Python</span>
                  </button>
                </div>
              </div>
            </header>

            {/* MISSION BRIEF & LANE TARGET RULES STRIP (Bisa di-collapse di HP agar hemat layar) */}
            <section className="mx-auto w-full max-w-[1440px] px-3 sm:px-4 pt-2.5 sm:pt-3">
              <div className="rounded-2xl border border-slate-200/90 bg-white p-3 sm:p-3.5 shadow-sm">
                <div className="flex flex-col lg:flex-row lg:items-center justify-between gap-2.5 sm:gap-3">
                  <div className="space-y-1 max-w-2xl">
                    <div className="flex items-center justify-between gap-2">
                      <div className="flex flex-wrap items-center gap-1.5 sm:gap-2">
                        <span className="font-display text-xs sm:text-sm font-bold text-slate-950">
                          {currentLevel.title}
                        </span>
                        {currentLevel.concepts.map((tag) => (
                          <span
                            key={tag}

                          >

                          </span>
                        ))}
                      </div>
                      <button
                        type="button"
                        onClick={() => setShowBriefMobile((v) => !v)}
                        className="sm:hidden shrink-0 rounded-lg border border-slate-200 bg-slate-50 px-2 py-1 text-[10px] font-bold text-slate-600"
                      >

                    </div>
                    <p
                      className={`text-xs text-slate-600 leading-relaxed ${
                        showBriefMobile ? 'block' : 'hidden sm:block'

                      {currentLevel.missionBrief}
                    </p>
                  </div>

                  {/* Kartu Aturan 3 Jalur: Scrollable horizontal di layar sempit, Grid di layar lebar */}
                  <div className="flex sm:grid sm:grid-cols-3 gap-2 overflow-x-auto no-scrollbar shrink-0 pb-0.5 sm:pb-0">
                    {currentLevel.laneRules.map((rule) => (
                      <div

                        className="shrink-0 w-[190px] sm:w-auto rounded-xl border border-slate-200/90 bg-slate-50/80 px-2.5 py-1.5 sm:px-3 sm:py-2 sm:min-w-[168px]"
                      >
                        <div className="flex items-center justify-between gap-1.5">
                          <span
                            style={{ backgroundColor: rule.accentHex }}

                          >
                            {rule.title}
                          </span>
                        </div>
                        <div className="mt-1 font-mono-code text-[10px] sm:text-[11px] font-semibold text-slate-800 truncate sm:whitespace-normal">
                          {rule.description}
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            </section>

            {/* MAIN WORKSPACE */}
            <main className="mx-auto flex-1 w-full max-w-[1440px] px-3 sm:px-4 py-2.5 sm:py-3">
              <div className="grid grid-cols-1 lg:grid-cols-12 gap-3 sm:gap-4 items-start">
                {/* KOLOM KIRI: 3D GUDANG + ANTREAN FIFO */}
                <div
                  ref={warehouseSectionRef}
                  className={`lg:col-span-7 flex flex-col gap-3 ${
                    mobileTab === 'code' ? 'hidden lg:flex' : 'flex'
                  }`}
                >
                  <div
                    className={`relative w-full ${
                      mobileTab === '3d'
                        ? 'h-[390px] sm:h-[465px]'
                        : 'h-[280px] sm:h-[430px] lg:h-[465px]'
                    }`}
                  >
                    <IsometricWarehouse3D
                      queuePackages={displayQueue}
                      activeVisual={activeVisual}
                      laneRules={currentLevel.laneRules}
                      laneStats={laneStats}
                      deliveryFeedbacks={deliveryFeedbacks}
                      selectedPackageId={selectedPkg?.id ?? null}
                      onSelectPackage={(pkg) => setSelectedPkg(pkg)}
                      isRunning={mode === 'running'}
                    />

                    {mode === 'completed' && (
                      <div className="absolute bottom-2.5 right-2.5 left-2.5 sm:left-auto sm:max-w-sm z-20 rounded-2xl border border-slate-200 bg-white/95 p-3.5 sm:p-4 shadow-xl backdrop-blur-md">
                        {summaryStats.isPerfect ? (
                          <div className="space-y-2">
                            <div className="flex items-center gap-2 text-emerald-700 font-display font-bold text-xs sm:text-sm">
                              <CheckCircle2 className="w-5 h-5 text-emerald-500 shrink-0" />
                              <span>Sempurna! Akurasi Sortir 100%</span>
                            </div>
                            <p className="text-[11px] sm:text-xs text-slate-600">
                              Seluruh {summaryStats.totalCorrect} paket berhasil dikirim ke jalur truk
                              yang tepat menggunakan logika Python-mu!
                            </p>
                            <div className="flex items-center gap-2 pt-1">
                              {levelIdx < LEVELS.length - 1 ? (
                                <button
                                  type="button"
                                  onClick={() => selectLevel(levelIdx + 1)}
                                  className="inline-flex items-center gap-1 rounded-xl bg-emerald-600 px-3 py-2 text-xs font-bold text-white hover:bg-emerald-500 transition"
                                >
                                  <span>Lanjut Level {LEVELS[levelIdx + 1].id}</span>
                                  <ChevronRight className="w-4 h-4" />
                                </button>
                              ) : (
                                <span className="rounded-xl bg-amber-100 px-3 py-1.5 text-xs font-bold text-amber-900">
                                  🏆 Semua 5 Level Lulus!
                                </span>
                              )}
                              <button
                                type="button"
                                onClick={handleResetRun}
                                className="rounded-xl border border-slate-200 px-3 py-2 text-xs font-semibold text-slate-700 hover:bg-slate-100 transition"
                              >
                                Ulangi
                              </button>
                            </div>
                          </div>
                        ) : (
                          <div className="space-y-2">
                            <div className="flex items-center gap-2 text-amber-700 font-display font-bold text-xs sm:text-sm">
                              <AlertCircle className="w-5 h-5 text-amber-500 shrink-0" />
                              <span>
                                Tersortir Tepat: {summaryStats.totalCorrect}/
                                {summaryStats.totalExpected} Paket ({summaryStats.accuracy}%)
                              </span>
                            </div>
                            <p className="text-[11px] sm:text-xs text-slate-600">
                              Masih ada paket yang salah jalur atau belum terambil. Cek konsol log di
                              bawah, perbaiki kode Python, lalu jalankan kembali!
                            </p>
                            <button
                              type="button"
                              onClick={handleResetRun}
                              className="rounded-xl bg-slate-900 px-3.5 py-1.5 text-xs font-bold text-amber-400 hover:bg-slate-800 transition"
                            >
                              Atur Ulang & Perbaiki Kode
                            </button>
                          </div>
                        )}
                      </div>
                    )}
                  </div>

                  <QueueStrip
                    queue={displayQueue}
                    activePkg={activeVisual?.pkg ?? null}
                    selectedPkgId={selectedPkg?.id ?? null}
                    onSelectPackage={(pkg) => setSelectedPkg(pkg)}
                    onEnqueueCustom={handleEnqueueCustom}
                    disabledEnqueue={mode === 'running' || mode === 'paused'}
                  />
                </div>

                {/* KOLOM KANAN: INSPEKTOR + PYTHON EDITOR + KONTROL + KONSOL */}
                <div
                  className={`lg:col-span-5 flex flex-col gap-3 ${
                    mobileTab === '3d' ? 'hidden lg:flex' : 'flex'
                  }`}
                >
                  <PackageInspector
                    pkg={activeVisual?.pkg ?? selectedPkg}
                    isLiveScanning={activeVisual?.stage === 'scanning'}
                  />

                  {/* Baris Tombol Eksekusi di Atas Editor khusus Mobile agar langsung terlihat */}
                  <div className="flex flex-wrap items-center justify-between gap-2 rounded-2xl border border-slate-200/90 bg-white p-2.5 shadow-sm">
                    <div className="flex items-center gap-1.5">
                      <button
                        type="button"
                        onClick={handleRunOrPause}
                        className={`inline-flex items-center gap-1.5 rounded-xl px-3.5 sm:px-4 py-2 text-xs font-bold shadow-sm active:scale-95 transition ${
                          mode === 'running'
                            ? 'bg-amber-500 text-slate-950 hover:bg-amber-400'
                            : 'bg-emerald-600 text-white hover:bg-emerald-500'
                        }`}
                      >
                        {mode === 'running' ? (
                          <>
                            <Pause className="w-4 h-4 fill-current" />
                            <span>Jeda</span>
                          </>
                        ) : (
                          <>
                            <Play className="w-4 h-4 fill-current" />
                            <span>{mode === 'paused' ? 'Lanjutkan' : 'Jalankan Kode'}</span>
                          </>
                        )}
                      </button>

                      <button
                        type="button"
                        onClick={handleStepOnce}
                        title="Eksekusi baris demi baris (Step Debugger)"
                        className="inline-flex items-center gap-1 rounded-xl border border-slate-300 bg-slate-50 px-2.5 sm:px-3 py-2 text-xs font-bold text-slate-800 hover:bg-slate-100 active:scale-95 transition"
                      >
                        <StepForward className="w-4 h-4 text-cyan-600" />
                        <span>Langkah</span>
                      </button>

                      <button
                        type="button"
                        onClick={handleResetRun}
                        title="Ulangi antrean dari awal"
                        className="inline-flex items-center gap-1 rounded-xl border border-slate-200 bg-white px-2.5 py-2 text-xs font-semibold text-slate-600 hover:bg-slate-100 hover:text-slate-900 active:scale-95 transition"
                      >
                        <RotateCcw className="w-4 h-4" />
                      </button>
                    </div>

                    <div className="flex items-center gap-1 rounded-xl bg-slate-100 p-1 border border-slate-200/80">
                      <FastForward className="w-3.5 h-3.5 text-slate-400 ml-1 hidden sm:inline" />
                      {[1, 2, 3].map((sp) => (
                        <button
                          key={sp}
                          type="button"
                          onClick={() => setSpeed(sp)}
                          className={`rounded-lg px-2 py-1 text-[11px] font-mono-code font-bold transition ${

                        >
                          {sp}x

                  </div>

                  <PythonEditor
                    code={currentCode}

                    errorLine={errorLine}
                    readOnly={mode === 'running'}
                    hintText={currentLevel.hintText}

                    onLoadSolution={() => {

                        onClick={() => setLogs([])}
                        title="Bersihkan log konsol"
                        className="rounded p-1 text-slate-500 hover:bg-slate-800 hover:text-slate-300 transition"
                      >
                        <Trash2 className="w-3.5 h-3.5" />
                      </button>
                    </div>

                    <div className="h-[135px] sm:h-[146px] overflow-y-auto dark-scrollbar px-3.5 py-2.5 font-mono-code text-[11px] sm:text-[11.5px] leading-5 space-y-1">
                      {logs.length === 0 ? (
                        <div className="text-slate-500 italic">
                          Log evaluasi kondisi (True/False) dan aksi robot akan tampil di sini...
                        </div>
                      ) : (
                        logs.map((entry) => {
                          let badgeCls = 'text-slate-400';
                          if (entry.type === 'scan') badgeCls = 'text-cyan-300';
                          else if (entry.type === 'condition') badgeCls = 'text-amber-200';
                          else if (entry.type === 'action') badgeCls = 'text-sky-300 font-semibold';
                          else if (entry.type === 'print') badgeCls = 'text-purple-300';
                          else if (entry.type === 'success') badgeCls = 'text-emerald-400 font-semibold';
                          else if (entry.type === 'error') badgeCls = 'text-rose-400 font-semibold';
                          else if (entry.type === 'tip') badgeCls = 'text-amber-400 italic';

                          return (
                            <div key={entry.id} className="flex items-start gap-2">
                              <span className="text-[10px] text-slate-500 shrink-0 select-none mt-0.5">
                                {entry.line ? `L${entry.line}` : entry.timestamp.slice(3)}
                              </span>
                              <span className={`break-words ${badgeCls}`}>{entry.message}</span>
                            </div>
                          );
                        })
                      )}
                      <div ref={consoleEndRef} />
                    </div>
                  </div>
                </div>
              </div>
            </main>

            {/* BOTTOM NAVIGATION & QUICK RUN BAR KHUSUS MOBILE (HP) */}
            <div className="lg:hidden fixed bottom-0 inset-x-0 z-40 border-t border-slate-200 bg-white/95 backdrop-blur-md px-2.5 py-2 shadow-lg">
              <div className="mx-auto flex max-w-lg items-center justify-between gap-1.5">
                {/* Mode Tampilan HP */}
                <div className="flex items-center rounded-xl bg-slate-100 p-1 border border-slate-200/80">
                  <button
                    type="button"
                    onClick={() => setMobileTab('split')}
                    className={`rounded-lg px-2.5 py-1.5 text-[11px] font-bold transition ${
                      mobileTab === 'split'
                        ? 'bg-slate-900 text-amber-400 shadow-sm'
                        : 'text-slate-600'
                    }`}
                  >
                    Semua
                  </button>
                  <button
                    type="button"
                    onClick={() => setMobileTab('3d')}
                    className={`rounded-lg px-2.5 py-1.5 text-[11px] font-bold transition ${
                      mobileTab === '3d'
                        ? 'bg-slate-900 text-amber-400 shadow-sm'
                        : 'text-slate-600'
                    }`}
                  >
                    3D Gudang
                  </button>
                  <button
                    type="button"
                    onClick={() => setMobileTab('code')}
                    className={`rounded-lg px-2.5 py-1.5 text-[11px] font-bold transition ${
                      mobileTab === 'code'
                        ? 'bg-slate-900 text-amber-400 shadow-sm'
                        : 'text-slate-600'
                    }`}
                  >
                    Kode Python
                  </button>
                </div>

                {/* Tombol Cepat Jalankan / Langkah di Jempol Kanan */}
                <div className="flex items-center gap-1.5">
                  <button
                    type="button"
                    onClick={handleStepOnce}
                    title="Langkah demi langkah"
                    className="inline-flex items-center justify-center rounded-xl border border-slate-300 bg-slate-50 p-2 text-slate-800 active:scale-95"
                  >
                    <StepForward className="w-4 h-4 text-cyan-600" />
                  </button>
                  <button
                    type="button"
                    onClick={handleRunOrPause}
                    className={`inline-flex items-center gap-1 rounded-xl px-3.5 py-2 text-xs font-bold shadow-sm active:scale-95 transition ${
                      mode === 'running'
                        ? 'bg-amber-500 text-slate-950'
                        : 'bg-emerald-600 text-white'
                    }`}
                  >
                    {mode === 'running' ? (
                      <>
                        <Pause className="w-3.5 h-3.5 fill-current" />
                        <span>Jeda</span>
                      </>
                    ) : (
                      <>
                        <Play className="w-3.5 h-3.5 fill-current" />
                        <span>{mode === 'paused' ? 'Lanjut' : 'Jalankan'}</span>
                      </>
                    )}
                  </button>
                </div>
              </div>
            </div>

            <LearningDrawer open={drawerOpen} onClose={() => setDrawerOpen(false)} />
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>

    <script>
      (function () {
        const jsxSource = document.getElementById('app-jsx').textContent;
        const compiled = Babel.transform(jsxSource, {
          presets: [['react', { runtime: 'classic' }]],
        }).code;
        const scriptEl = document.createElement('script');
        scriptEl.text = compiled;
        document.body.appendChild(scriptEl);
      })();
    </script>
  </body>
</html>
