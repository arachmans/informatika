<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulasi Instalasi Ubuntu 26.04 LTS</title>
<link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@300;400;500;700&family=Ubuntu+Mono:wght@400;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{--or:#E95420;--or2:#c7431a;--au:#772953;--txt:#f4f4f2;--dim:#b0b0ac;--mono:'Ubuntu Mono',monospace}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#000;font-family:Ubuntu,'Segoe UI',sans-serif;color:var(--txt);overflow:hidden;-webkit-user-select:none;user-select:none}
input,select,textarea,button{font-family:Ubuntu,'Segoe UI',sans-serif;font-size:14px}
input,textarea,select{user-select:text;-webkit-user-select:text}
#stage{position:fixed;inset:0}
#stage.a11y-big{zoom:1.15}
#stage.a11y-contrast{filter:contrast(1.25) brightness(1.05)}
.ic{flex:none;vertical-align:-3px}
#errbox{position:fixed;top:0;left:0;right:0;z-index:99999;background:#7a1f1f;color:#ffd9d9;font-family:var(--mono);font-size:12px;padding:8px 12px;display:none}
@keyframes blink{50%{opacity:0}}
@keyframes pw{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes ply{0%,100%{background:#8c8c88;transform:scale(1)}45%{background:var(--or);transform:scale(1.25)}}
@keyframes winin{from{opacity:0;transform:scale(.96)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
@keyframes ping{0%{r:4;opacity:.6}100%{r:13;opacity:0}}
.pwscr{position:absolute;inset:0;background:#0a0a0b;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px}
.pw-brand{position:absolute;top:34px;left:38px;display:flex;gap:14px;align-items:center;color:#d6d6d2}
.pw-brand b{font-size:19px;font-weight:500;display:block}
.pw-brand span{font-size:12.5px;color:#8f8f8a;display:block}
.pw-spec{position:absolute;bottom:30px;font-family:var(--mono);font-size:12px;color:#6f6f6a}
.pwbtn{background:none;border:1px solid #2e2e2c;color:#9a9a96;width:104px;height:104px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.25s;animation:pw 3.2s ease-in-out infinite}
.pwbtn:hover{color:var(--or);border-color:var(--or)}
.pw-hint{font-family:var(--mono);font-size:13px;color:#7c7c78}
.phase-black{position:absolute;inset:0;background:#000;overflow:hidden;font-family:var(--mono);color:#cfcfcb}
.klog{position:absolute;inset:0;overflow:hidden;padding:10px 14px;font-size:12.5px;line-height:1.32}
.ll{white-space:pre-wrap;word-break:break-all}
.ll.ok{color:#e8e8e4}
.ll.ok em{color:#4cd137;font-style:normal;font-weight:700}
.post-hint{position:absolute;bottom:36px;left:0;right:0;text-align:center;color:#efe9d0;font-size:14px}
.post-hint b{color:#fff}
.blink{animation:blink 1s steps(1) infinite}
.bios{position:absolute;inset:0;background:#a9a89f;font-family:var(--mono);color:#1d1d1a;display:flex;flex-direction:column;padding:10px;font-size:14px}
.b-head{background:#1f3a5f;color:#e8e8e2;padding:6px 12px;font-weight:700}
.b-tabs{display:flex;gap:2px;background:#8f8e85;padding:3px 4px 0}
.b-tab{padding:5px 18px;background:#c8c7bd;cursor:pointer;border:1px solid #7a7970;border-bottom:none}
.b-tab.cur{background:#1f3a5f;color:#fff;font-weight:700}
.b-main{flex:1;display:flex;background:#d8d7cd;border:1px solid #7a7970;overflow:hidden}
.b-menu{flex:1;padding:10px 0;overflow:auto}
.b-help{width:320px;background:#cdccc1;border-left:1px solid #7a7970;padding:14px;font-size:12.5px;color:#3c3b36;line-height:1.5}
.b-row{display:flex;padding:5px 16px;cursor:pointer;white-space:pre}
.b-row .bv{margin-left:auto;color:#33322d}
.b-row.cur{background:#1f3a5f;color:#fff}
.b-row.cur .bv{color:#fff}
.b-foot{background:#1f3a5f;color:#cfd6e2;padding:6px 12px;font-size:12.5px}
.b-title{padding:8px 16px;font-weight:700;background:#c2c1b7;border-bottom:1px solid #8f8e85}
.bmenu{position:absolute;inset:0;background:#000;color:#eee;font-family:var(--mono);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-size:16px}
.bmenu .bi{padding:5px 26px;cursor:pointer;width:440px}
.bmenu .bi.cur{background:#1f3a5f;color:#fff}
.bmenu h3{margin-bottom:18px;letter-spacing:2px}
.noboot{position:absolute;inset:0;background:#000;color:#cfcfcf;font-family:var(--mono);display:flex;align-items:center;justify-content:center;text-align:center;font-size:17px;line-height:2;cursor:pointer}
.grub{position:absolute;inset:0;background:#000;color:#eee;font-family:var(--mono);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:16px}
.g-ver{color:#888;font-size:13px;margin-bottom:26px}
.g-cd{color:#bbb;margin-bottom:10px;font-size:14px}
.g-box{border:1px solid #9a9a96;min-width:560px}
.g-it{padding:7px 26px;cursor:pointer;white-space:pre}
.g-it.cur{background:#5e2750;color:#fff}
.g-help{margin-top:26px;color:#9a9a96;font-size:13px;text-align:center;line-height:1.7}
.ply{position:absolute;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:38px}
.ply .cof{color:var(--or)}
.ply-dots{display:flex;gap:12px}
.ply-dots span{width:9px;height:9px;border-radius:50%;background:#8c8c88;animation:ply 1.25s infinite}
.rbnote{position:absolute;inset:0;background:#000;color:#ddd;font-family:var(--mono);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font-size:18px;text-align:center}
.btn{border:none;border-radius:5px;padding:10px 24px;font-size:15px;font-weight:500;cursor:pointer}
.btn.primary{background:var(--or);color:#fff}
.btn.primary:hover{background:var(--or2)}
.btn.primary:disabled{background:#5a4237;color:#c9b6ac;cursor:not-allowed}
.btn.ghost{background:transparent;color:#e9e9e5;border:1px solid #66645f}
.btn.ghost:hover{border-color:#9a9892}
.inst-btns{display:flex;gap:10px}
.inst{display:flex;flex-direction:column;height:100%;background:#262626}
.inst-h{padding:26px 38px 4px}
.inst-h h2{font-size:23px;font-weight:500}
.inst-h p{font-size:13px;color:var(--dim);margin-top:4px}
.inst-b{flex:1;overflow:auto;padding:14px 38px 10px}
.inst-f{border-top:1px solid #383836;padding:14px 38px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.inst-note{font-size:12.5px;color:var(--dim);flex:1}
.ipt,.sel{background:#1c1c1a;border:1px solid #4a4a46;border-radius:6px;color:#eee;padding:9px 12px;outline:none;width:100%}
.ipt:focus,.sel:focus{border-color:var(--or)}
.lbl{display:block;font-size:12.5px;color:var(--dim);margin:14px 0 6px}
.opt-card{border:1px solid #454542;border-radius:8px;padding:15px 18px;cursor:pointer;display:flex;gap:14px;align-items:flex-start;transition:.15s}
.opt-card:hover{border-color:#6a6862}
.opt-card.sel{border-color:var(--or);background:rgba(233,84,32,.09)}
.opt-card.dis{opacity:.55}
.opt-card .oc-ic{color:var(--or);flex:none;margin-top:2px}
.opt-card h4{font-size:15.5px;font-weight:500}
.opt-card p{font-size:12.5px;color:var(--dim);margin-top:3px;line-height:1.45}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin-top:12px}
.lbtn{display:flex;justify-content:space-between;align-items:center;background:#1c1c1a;border:1px solid #454542;border-radius:6px;color:#e6e6e2;padding:9px 13px;cursor:pointer;text-align:left}
.lbtn:hover{border-color:#6a6862}
.lbtn.sel{border-color:var(--or);background:rgba(233,84,32,.12)}
.chk{display:flex;gap:11px;align-items:flex-start;padding:9px 2px;cursor:pointer;font-size:14px;line-height:1.4}
.chk input{accent-color:var(--or);width:17px;height:17px;margin-top:1px;flex:none}
.chk small{display:block;color:var(--dim);font-size:12.5px;margin-top:2px}
.pgw{display:flex;gap:34px;align-items:stretch}
.modal-ov{position:absolute;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:5}
.modal{background:#2b2b2b;border:1px solid #484844;border-radius:10px;padding:26px 30px;width:440px;max-width:92%;box-shadow:0 18px 60px rgba(0,0,0,.5)}
.modal h3{font-size:18px;font-weight:500;margin-bottom:8px}
.modal p{font-size:13.5px;color:var(--dim);line-height:1.55}
.m-btns{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}
.alert{border:1px solid #8c4a35;background:rgba(233,84,32,.1);color:#f3c9b6;border-radius:8px;padding:12px 15px;font-size:13px;display:flex;gap:11px;line-height:1.45;margin-top:16px}
.alert .ic{color:var(--or)}
.crow{display:flex;align-items:center;gap:12px;padding:11px 6px;border-bottom:1px solid #353533;cursor:pointer;font-size:14px}
.crow:hover{background:#2e2e2c}
.crow span{color:var(--dim);width:150px;flex:none}
.crow b{font-weight:400;flex:1}
.crow .ic{color:#7c7a74}
.bar{height:7px;background:#3a3a37;border-radius:4px;overflow:hidden;margin:10px 0}
.bar i{display:block;height:100%;background:var(--or);width:0%}
.strow{display:flex;gap:10px;align-items:center;padding:5px 0;color:var(--dim);font-size:13.5px}
.strow.on{color:#fff}
.strow.on .ic{color:var(--or)}
.map-wrap{background:#1d1d1c;border:1px solid #3b3b38;border-radius:8px;overflow:hidden;position:relative;min-width:0}
.map-wrap svg{display:block}
.city{fill:#cfcfca;cursor:pointer}
.city:hover{fill:#fff}
.pin{fill:var(--or)}
.pin-ring{fill:none;stroke:var(--or);opacity:.5;animation:ping 1.6s infinite}
.slide{background:#1d1d1c;border:1px solid #3b3b38;border-radius:10px;padding:26px;display:flex;flex-direction:column;gap:12px}
.slide .ic{color:var(--or);width:38px;height:38px}
.slide h4{font-size:19px;font-weight:500}
.slide p{font-size:13.5px;color:var(--dim);line-height:1.55}
.pct{font-size:44px;font-weight:300}
.parts-t{width:100%;border-collapse:collapse;font-size:13px;margin-top:14px}
.parts-t th{text-align:left;color:var(--dim);font-weight:400;padding:6px 8px;border-bottom:1px solid #40403d;font-size:12px}
.parts-t td{padding:8px;border-bottom:1px solid #333330}
.parts-t button{background:none;border:none;color:#d08a70;cursor:pointer;padding:2px}
.parts-t button:hover{color:var(--or)}
.dbar{display:flex;height:16px;border-radius:4px;overflow:hidden;margin:12px 0 4px;background:#3a3a37}
.dbar i{background:var(--or);border-right:1px solid #262626}
.desk{position:absolute;inset:0;overflow:hidden}
.wall{position:absolute;inset:0}
.wall svg{width:100%;height:100%}
.topbar{position:absolute;top:0;left:0;right:0;height:32px;background:rgba(0,0,0,.82);display:flex;align-items:center;justify-content:space-between;padding:0 8px;z-index:100;font-size:13px}
.tb-b{background:none;border:none;color:#eee;cursor:pointer;padding:4px 12px;border-radius:4px;font-size:13px}
.tb-b:hover{background:rgba(255,255,255,.12)}
.tb-c{position:absolute;left:50%;transform:translateX(-50%)}
.tb-r{display:flex;align-items:center;gap:7px;cursor:pointer;padding:4px 12px;border-radius:4px}
.tb-r:hover{background:rgba(255,255,255,.12)}
.dock{position:absolute;left:8px;top:44px;bottom:8px;width:60px;background:rgba(20,12,20,.72);border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 0;z-index:90}
.dk{position:relative;width:46px;height:46px;border:none;background:none;cursor:pointer;border-radius:12px;display:flex;align-items:center;justify-content:center}
.dk:hover{background:rgba(255,255,255,.09)}
.dk .dk-dot{position:absolute;left:-5px;top:50%;transform:translateY(-50%);width:4px;height:4px;border-radius:50%;background:transparent}
.dk.run .dk-dot{background:var(--or)}
.dk-tip{position:absolute;left:60px;top:50%;transform:translateY(-50%);background:#1c1c1c;border:1px solid #3c3c39;color:#eee;font-size:12px;padding:5px 11px;border-radius:6px;white-space:nowrap;opacity:0;pointer-events:none;transition:.15s;z-index:200}
.dk:hover .dk-tip{opacity:1}
.tile{width:42px;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;color:#fff}
.dk-apps{margin-top:auto;width:42px;height:42px;display:grid;grid-template-columns:repeat(3,1fr);place-items:center;padding:7px;border-radius:10px;cursor:pointer;border:none;background:none}
.dk-apps:hover{background:rgba(255,255,255,.09)}
.dk-apps i{width:4px;height:4px;border-radius:50%;background:#e8e8e4}
.dicons{position:absolute;left:86px;top:48px;display:flex;flex-direction:column;gap:10px;z-index:20}
.dic{width:96px;padding:8px 4px;border-radius:8px;display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer;border:1px solid transparent}
.dic:hover{background:rgba(255,255,255,.1)}
.dic.sel{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.25)}
.dic span{font-size:11.5px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.8);text-align:center;line-height:1.3}
.winlayer{position:absolute;inset:0;pointer-events:none}
.win{position:absolute;background:#242423;border:1px solid #3c3c39;border-radius:10px;overflow:hidden;display:flex;flex-direction:column;pointer-events:auto;box-shadow:0 14px 44px rgba(0,0,0,.45);animation:winin .16s ease-out}
.win-h{height:38px;background:#2e2e2d;display:flex;align-items:center;padding:0 6px 0 14px;cursor:grab;flex:none;border-bottom:1px solid #262625;touch-action:none}
.win-t{flex:1;font-size:13.5px;font-weight:500;text-align:center;color:#e9e9e5;pointer-events:none;overflow:hidden;white-space:nowrap}
.win-x{width:28px;height:28px;border-radius:50%;border:none;background:none;color:#d6d6d2;cursor:pointer;display:flex;align-items:center;justify-content:center}
.win-x:hover{background:#4a4a48}
.win.focused{border-color:#5a5a56}
.win-b{flex:1;overflow:hidden;display:flex;flex-direction:column}
.term{flex:1;overflow-y:auto;background:#300a24;color:#f2f2ee;font-family:var(--mono);font-size:13.5px;line-height:1.42;padding:10px 12px;outline:none;cursor:text}
.tl{white-space:pre-wrap;word-break:break-all;min-height:19px}
.pu{color:#33d17a;font-weight:700}
.pwd2{color:#99c1f1;font-weight:700}
.dir{color:#5b9dff;font-weight:700}
.cr{display:inline-block;width:8px;height:16px;background:#f2f2ee;vertical-align:-3px;animation:blink 1.1s steps(1) infinite}
.files{flex:1;display:flex;overflow:hidden}
.f-side{width:172px;background:#2a2a29;border-right:1px solid #363634;padding:12px 8px;overflow:auto;flex:none}
.f-pl{display:flex;gap:9px;align-items:center;padding:7px 10px;border-radius:6px;cursor:pointer;font-size:13px;color:#d8d8d4}
.f-pl:hover{background:#373736}
.f-pl.cur{background:#3f3f3d}
.f-pl .ic{color:var(--or)}
.f-main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.f-bar{display:flex;gap:10px;align-items:center;padding:9px 12px;border-bottom:1px solid #363634}
.f-bar button{background:none;border:none;color:#d6d6d2;cursor:pointer;padding:4px 6px;border-radius:5px}
.f-bar button:hover{background:#3a3a38}
.f-path{font-size:13px;color:#b8b8b3;overflow:hidden;white-space:nowrap}
.f-path b{font-weight:500;color:#eee}
.f-grid{flex:1;overflow:auto;padding:12px;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start}
.f-it{width:104px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:8px;border-radius:8px;cursor:pointer;border:1px solid transparent}
.f-it:hover{background:#323230}
.f-it.sel{background:#3c3c3a;border-color:#5a5a56}
.f-it span{font-size:11.5px;text-align:center;word-break:break-word;line-height:1.25}
.f-empty{padding:40px;color:#9a9a96;font-size:13.5px;text-align:center;width:100%}
.ed{flex:1;display:flex;flex-direction:column}
.ed textarea{flex:1;background:#1e1e1d;color:#eee;border:none;outline:none;padding:14px;font-family:var(--mono);font-size:13.5px;line-height:1.5;resize:none}
.ed-info{padding:6px 14px;font-size:12px;color:#9a9a96;border-bottom:1px solid #363634}
.ffx{flex:1;display:flex;flex-direction:column;background:#1f1f1e;overflow:hidden}
.fx-tab{background:#2c2c2b;border:1px solid #3a3a38;border-bottom:none;color:#dcdcd8;font-size:12.5px;padding:6px 16px;border-radius:7px 7px 0 0;max-width:220px;overflow:hidden;white-space:nowrap;margin:4px 6px 0}
.fx-nav{display:flex;gap:8px;align-items:center;padding:8px 10px;background:#262625;border-bottom:1px solid #363634}
.fx-nav button{background:none;border:none;color:#d6d6d2;cursor:pointer;padding:4px 7px;border-radius:5px}
.fx-nav button:hover{background:#3a3a38}
.fx-addr{flex:1}
.fx-body{flex:1;overflow:auto;display:flex}
.fx-start{flex:1;display:flex;flex-direction:column;align-items:center;padding-top:60px;background:#f7f6f3;color:#2b2b28}
.fx-srch{width:min(560px,80%);display:flex;margin:30px 0 26px}
.fx-srch input{flex:1;padding:12px 18px;border:1px solid #cfcac2;border-radius:22px 0 0 22px;outline:none;font-size:14px}
.fx-srch button{padding:12px 20px;border:1px solid #cfcac2;border-left:none;border-radius:0 22px 22px 0;background:#fff;cursor:pointer;color:#a1401f}
.fx-tiles{display:flex;gap:18px}
.fx-tile{width:100px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;color:#55524c;font-size:12px;border:none;background:none;padding:6px;border-radius:8px}
.fx-tile:hover{background:#ecebe6}
.fx-tb{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;margin-bottom:4px}
.fx-page{flex:1;padding:36px 56px;background:#f7f6f3;color:#2b2b28}
.fx-page h1{font-size:30px;margin-bottom:14px;font-weight:500}
.fx-page p{font-size:14.5px;line-height:1.7;margin-bottom:12px;max-width:640px}
.fx-res{flex:1;padding:26px 40px;background:#fff;color:#222}
.fx-res h3{font-size:13px;color:#777;font-weight:400;margin-bottom:18px}
.fx-r{margin-bottom:22px}
.fx-r b{font-size:17px;font-weight:500;color:#1a0dab;cursor:pointer;display:block}
.fx-r span{font-size:13px;color:#0a7d33}
.fx-r p{font-size:13.5px;color:#444;line-height:1.5}
.set{flex:1;display:flex;overflow:hidden}
.st-side{width:190px;background:#2a2a29;border-right:1px solid #363634;padding:12px 8px;flex:none}
.st-pl{display:flex;gap:10px;align-items:center;padding:8px 12px;border-radius:6px;cursor:pointer;font-size:13.5px;color:#d8d8d4}
.st-pl:hover{background:#373736}
.st-pl.cur{background:#3f3f3d}
.st-pl .ic{color:var(--or)}
.st-main{flex:1;overflow:auto;padding:24px 30px}
.st-main h2{font-size:20px;font-weight:500;margin-bottom:18px}
.st-row{display:flex;justify-content:space-between;align-items:center;padding:12px 2px;border-bottom:1px solid #353533;font-size:14px;gap:16px}
.st-row span{color:var(--dim)}
.sw{position:relative;width:44px;height:24px;flex:none;cursor:pointer;display:inline-block}
.sw input{opacity:0;width:0;height:0}
.sw i{position:absolute;inset:0;background:#4a4a46;border-radius:12px;transition:.2s}
.sw i:before{content:'';position:absolute;width:18px;height:18px;border-radius:50%;background:#eee;top:3px;left:3px;transition:.2s}
.sw input:checked+i{background:var(--or)}
.sw input:checked+i:before{left:23px}
.st-head{display:flex;gap:18px;align-items:center;margin-bottom:22px}
.st-head .cof{color:var(--or)}
.pop{position:absolute;top:38px;background:#1c1c1b;border:1px solid #3c3c39;border-radius:12px;box-shadow:0 16px 50px rgba(0,0,0,.5);padding:14px;z-index:180;color:#eee}
.cal{width:290px}
.cal-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:13.5px}
.cal-h button{background:none;border:none;color:#ddd;cursor:pointer;padding:3px 8px;border-radius:5px}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;font-size:12px}
.cal-g b{color:var(--dim);font-weight:400;padding:5px 0}
.cal-g span{padding:6px 0;border-radius:50%}
.cal-g span.today{background:var(--or);color:#fff;font-weight:700}
.sysm{width:320px;display:flex;flex-direction:column;gap:12px}
.sysm .sr{display:flex;gap:11px;align-items:center;font-size:13.5px}
.sysm .sr small{color:var(--dim);display:block;font-size:12px}
.sysm input[type=range]{width:100%;accent-color:var(--or)}
.sm-btns{display:flex;gap:8px}
.sm-btn{flex:1;background:#333330;border:none;color:#eee;padding:11px 0;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px}
.sm-btn:hover{background:#3f3f3c}
.sm-pw{display:none;flex-direction:column;gap:8px}
.sm-pw button{background:#333330;border:none;color:#eee;padding:10px;border-radius:8px;cursor:pointer;text-align:left;padding-left:16px}
.sm-pw button:hover{background:#3f3f3c}
.ov{position:absolute;inset:0;background:rgba(12,6,12,.55);backdrop-filter:blur(26px);z-index:150;display:flex;flex-direction:column;align-items:center;padding-top:60px}
.ov input{width:min(520px,70%);padding:12px 20px;border-radius:24px;border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.4);color:#fff;outline:none;font-size:14px}
.ov-grid{display:flex;flex-wrap:wrap;gap:26px;justify-content:center;margin-top:70px;max-width:760px}
.ov-app{width:110px;display:flex;flex-direction:column;align-items:center;gap:9px;cursor:pointer;border:none;background:none}
.ov-app span{color:#eee;font-size:12.5px}
.lockov{position:absolute;inset:0;background:rgba(8,4,8,.66);backdrop-filter:blur(30px);z-index:220;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.lk-t{font-size:82px;font-weight:300}
.lk-d{font-size:24px;font-weight:300;color:#ddd}
.login{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:13vh;overflow:hidden}
.login .wall{filter:blur(26px) brightness(.45);transform:scale(1.1)}
.lg-top{position:absolute;top:15vh;text-align:center}
.lg-card{position:relative;display:flex;flex-direction:column;align-items:center;gap:12px}
.lg-av{width:84px;height:84px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:500;color:#fff;box-shadow:0 6px 30px rgba(0,0,0,.4)}
.lg-name{font-size:19px;font-weight:500}
.lg-form{display:flex;flex-direction:column;align-items:center;gap:8px}
.lg-in{display:flex;align-items:center;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.3);border-radius:22px;padding:3px 3px 3px 18px}
.lg-in input{background:none;border:none;outline:none;color:#fff;width:230px;font-size:14px}
.lg-in button{width:34px;height:34px;border-radius:50%;border:none;background:var(--or);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none}
.lg-err{color:#f5a49a;font-size:13px;min-height:18px}
.lg-card.shake{animation:shake .4s}
.lg-power{position:absolute;bottom:26px;right:30px}
.lg-power button{background:rgba(0,0,0,.4);border:none;color:#eee;width:44px;height:44px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center}
.lg-note{font-size:11.5px;color:#9a9a96}
.wmodal{position:absolute;inset:0;background:rgba(0,0,0,.45);z-index:230;display:flex;align-items:center;justify-content:center}
.wm-card{background:#262626;border:1px solid #454542;border-radius:14px;padding:34px 38px;width:470px;max-width:92%;display:flex;flex-direction:column;gap:18px}
.wm-card .cof{color:var(--or)}
.wm-card h3{font-size:22px;font-weight:500}
.wm-card p{font-size:14px;color:var(--dim);line-height:1.55}
.wm-li{display:flex;gap:12px;align-items:center;font-size:13.5px;padding:7px 0}
.wm-li .ic{color:var(--or)}
#simbar{position:fixed;right:12px;bottom:10px;display:flex;gap:6px;align-items:center;z-index:999;opacity:.75;transition:.2s}
#simbar:hover{opacity:1}
.sb-phase{font-family:var(--mono);font-size:11px;color:#8a8a86;background:rgba(20,20,20,.85);padding:5px 10px;border-radius:6px;border:1px solid #333330}
.sb-btn{display:flex;gap:6px;align-items:center;background:rgba(20,20,20,.85);border:1px solid #333330;color:#b8b8b4;padding:6px 10px;border-radius:6px;cursor:pointer;font-size:11.5px;font-family:var(--mono)}
.sb-btn:hover{color:#fff;border-color:#55534e}
.sb-btn.on{color:var(--or);border-color:#6b3a26}
#toast{position:fixed;left:50%;bottom:56px;transform:translateX(-50%) translateY(20px);background:#1c1c1a;color:#eee;border:1px solid #3c3c39;padding:11px 22px;border-radius:9px;font-size:13.5px;opacity:0;pointer-events:none;transition:.3s;z-index:1000}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#hint{position:fixed;left:12px;bottom:12px;font-family:var(--mono);font-size:11.5px;color:#78786f;max-width:440px;z-index:999;line-height:1.5}

/* Pemantau error — dipasang di skrip TERPISAH sebelum skrip utama,
   sehingga error parse pada skrip utama pun tetap tampil sebagai banner merah. */
(function(){
  var shown=false;
  function show(msg){
    var d=document.getElementById('errbox');
    if(!d)return;
    d.style.display='block';
    d.textContent=msg;
    shown=true;
  }
  window.addEventListener('error',function(e){
    show('Kesalahan skrip: '+(e.message||'?')+(e.lineno?(' (baris '+e.lineno+')'):''));
  });
  setTimeout(function(){
    var ph=document.getElementById('bootph');
    if(ph&&ph.isConnected&&!shown){
      show('Simulator gagal dimulai. Muat ulang halaman (F5). Bila berulang, buka F12 lalu lihat tab Console untuk detailnya.');
    }
  },4000);
})();
</script>

/* ============ FASE 2: POST ============ */
async function post(fast){
  setPhase('post');
  var sc=h('<div class="phase-black"></div>');
  var log=document.createElement('div');
  log.className='klog';
  sc.appendChild(log);
  mount(sc);
  var del=false,f12=false;
  var kh=function(e){
    if(e.key==='Delete'||e.key==='Del'||e.key==='F2')del=true;
    if(e.key==='F12')f12=true;
  };
  window.addEventListener('keydown',kh);
  function add(txt){var d=document.createElement('div');d.className='ll';d.textContent=txt;log.appendChild(d);}
  add('SIM BIOS v2.17.1246  Copyright (C) 2026 SimMegatrends, Inc.');
  add('BIOS Date: 01/15/2026 18:30:00  Ver: 09.12.24');
  add('');
  await wait(fast?120:350);
  add('CPU : Intel(R) Core(TM) i5-14600K CPU @ 3.50GHz');
  add('     Core Count : 14    /    Thread Count : 20');
  await wait(fast?100:260);
  var mem=document.createElement('div');
  mem.className='ll';
  log.appendChild(mem);
  var m=0;
  while(m<=32768){
    mem.textContent='Memory Test : '+String(m).padStart(6,'0')+' MB'+(m===32768?'  OK':'');
    await wait(fast?6:22);
    m+=2048;
  }
  await wait(fast?80:240);
  add('Detecting Storage Devices ...');
  await wait(fast?120:380);
  add('  NVMe0 : SIM SSD 1024GB');
  if(S.usb)add('  USB1  : SanDisk Ultra FIT 32GB');
  await wait(fast?80:220);
  add('Detecting Keyboard / Mouse ... Done');
  add('');
  var hint=h('<div class="post-hint">Press <b>DEL</b> to enter Setup, <b>F12</b> for Boot Menu&nbsp;<span class="blink">_</span></div>');
  sc.appendChild(hint);
  setHint('Tip: tekan DEL untuk masuk BIOS, atau F12 untuk memilih perangkat boot. Tanpa input, urutan boot normal dijalankan.');
  var winMs=fast?1100:2400;
  var t0=Date.now();
  while(Date.now()-t0<winMs){
    if(del||f12)break;
    await wait(80);
  }
  window.removeEventListener('keydown',kh);
  if(del)return bios();
  if(f12)return bootMenu();
  bootSequence();
}
function bootSequence(){
  for(var i=0;i<S.boot.length;i++){
    var d=S.boot[i];
    if(d==='usb'&&S.usb)return grub('live');

  }
  noBoot();
}
function noBoot(){

  }else{
    setHint('Tip: pasang media USB dari panel kanan bawah, lalu klik layar / tekan tombol apa pun untuk mencoba boot lagi.');

}

/* ============ FASE 3: BIOS ============ */
function bios(){
  setPhase('bios');
  var tabs=['Main','Advanced','Boot','Security','Exit'];
  var tab=0,idx=0;
  var draft={boot:S.boot.slice(),opts:{svm:1,rtc:0,num:0,virus:0}};
  var DEV={usb:'UEFI: SanDisk Ultra FIT 32GB',ssd:'UEFI: SIM SSD 1024GB',net:'PXE: Network Boot'};
  function hhmmss(){var d=new Date();return pad2(d.getHours())+':'+pad2(d.getMinutes())+':'+pad2(d.getSeconds());}
  function dstr(){return new Date().toLocaleDateString('en-CA');}
  var sc=h('<div class="bios">'+
   '<div class="b-head">Aptio Setup Utility - Copyright (C) 2026 SimMegatrends, Inc.</div>'+
   '<div class="b-tabs" id="bt"></div>'+
   '<div class="b-main"><div class="b-menu" id="bm"></div><div class="b-help" id="bh"></div></div>'+
   '<div class="b-foot">Panah: pilih - Enter: ubah - Esc: keluar (mouse juga bisa dipakai)</div></div>');
  mount(sc);
  function items(){
    if(tab===0)return[
      {l:'BIOS Version',v:'2.17.1246'},
      {l:'Build Date',v:'01/15/2026'},
      {l:'Processor',v:'Intel Core i5-14600K @ 3.50GHz'},
      {l:'Core/Thread Count',v:'14 / 20'},
      {l:'Total Memory',v:'32768 MB (DDR5)'},
      {l:'System Time',v:hhmmss()},
      {l:'System Date',v:dstr()}
    ];
    if(tab===1)return[
      {l:'CPU Multi-Core Support',o:'svm',opts:['Enabled','Disabled'],help:'Aktifkan semua inti prosesor.'},
      {l:'SVM Mode',o:'svm',opts:['Enabled','Disabled'],help:'Aktifkan virtualisasi (diperlukan oleh KVM/VirtualBox).'},
      {l:'Power On By RTC',o:'rtc',opts:['Disabled','Enabled'],help:'Menyalakan komputer pada jadwal RTC tertentu.'},
      {l:'Boot Up NumLock State',o:'num',opts:['On','Off']}
    ];
    if(tab===2)return[
      {l:'Boot Option #1',boot:0,help:'Perangkat boot pertama yang dicoba firmware. Tekan Enter untuk mengganti.'},
      {l:'Boot Option #2',boot:1,help:'Perangkat boot kedua.'},
      {l:'Boot Option #3',boot:2,help:'Perangkat boot ketiga.'},
      {l:'UEFI/Legacy Boot',v:'UEFI Only'}
    ];
    if(tab===3)return[
      {l:'Supervisor Password',v:'Not Installed',help:'Kata sandi administrator BIOS. Belum dipasang.'},
      {l:'User Password',v:'Not Installed'},
      {l:'Boot Sector Virus Protection',o:'virus',opts:['Disabled','Enabled']}
    ];
    return[
      {l:'Save Changes and Exit',act:'save',help:'Simpan perubahan lalu mulai ulang sistem.'},
      {l:'Discard Changes and Exit',act:'discard',help:'Buang perubahan lalu mulai ulang sistem.'},
      {l:'Load Optimized Defaults',act:'defaults',help:'Kembalikan seluruh pengaturan ke nilai pabrik.'}
    ];
  }
  function value(it){
    if(it.boot!==undefined)return DEV[draft.boot[it.boot]]||'';
    if(it.v!==undefined)return it.v;
    if(it.o!==undefined)return it.opts[draft.opts[it.o]];
    return '';
  }
  function activate(it){
    if(it.boot!==undefined){
      var cur=draft.boot[it.boot];
      var avail=['ssd','net'];
      if(S.usb)avail.unshift('usb');
      var pos=avail.indexOf(cur);
      if(pos<0)pos=0;
      var next=avail[(pos+1)%avail.length];
      draft.boot=draft.boot.map(function(v,j){
        if(j===it.boot)return next;
        if(v===next)return cur;
        return v;
      });
    }else if(it.o){
      draft.opts[it.o]=(draft.opts[it.o]+1)%it.opts.length;
    }else if(it.act){
      doExit(it.act);
    }
  }
  function doExit(k){
    if(k==='save'){S.boot=draft.boot.slice();toast('Perubahan BIOS disimpan');}
    else if(k==='defaults'){draft.boot=['usb','ssd','net'];toast('Pengaturan pabrik dimuat');render();return;}
    else{toast('Perubahan BIOS dibuang');}
    post(true);
  }
  function render(){
    var bt=document.getElementById('bt');
    if(!bt)return;
    var th='';
    tabs.forEach(function(x,i){th+='<span class="b-tab'+(i===tab?' cur':'')+'" data-t="'+i+'">'+x+'</span>';});
    bt.innerHTML=th;
    bt.querySelectorAll('.b-tab').forEach(function(el){
      el.onclick=function(){tab=+el.getAttribute('data-t');idx=0;render();};
    });
    var its=items();
    if(idx>=its.length)idx=its.length-1;
    if(idx<0)idx=0;
    var html='<div class="b-title">'+tabs[tab]+'</div>';
    its.forEach(function(it,i){
      html+='<div class="b-row'+(i===idx?' cur':'')+'" data-i="'+i+'"><span>    '+esc(it.l)+'</span><span class="bv">'+esc(value(it))+'</span></div>';
    });
    var bm=document.getElementById('bm');
    bm.innerHTML=html;
    bm.querySelectorAll('.b-row').forEach(function(r){
      r.onclick=function(){
        var i=+r.getAttribute('data-i');
        if(i===idx){activate(its[i]);render();}
        else{idx=i;render();}
      };
    });
    var help=its[idx].help||'Pilih item dengan tombol panah; tekan Enter untuk mengubah nilainya.';
    document.getElementById('bh').innerHTML='<b style="display:block;margin-bottom:8px">Item Help</b>'+esc(help);
  }
  setKeyHandler(function(e){
    if(e.key==='ArrowRight'){tab=(tab+1)%tabs.length;idx=0;render();e.preventDefault();}
    else if(e.key==='ArrowLeft'){tab=(tab+tabs.length-1)%tabs.length;idx=0;render();e.preventDefault();}
    else if(e.key==='ArrowDown'){idx=Math.min(items().length-1,idx+1);render();e.preventDefault();}
    else if(e.key==='ArrowUp'){idx=Math.max(0,idx-1);render();e.preventDefault();}
    else if(e.key==='Enter'){activate(items()[idx]);render();e.preventDefault();}
    else if(e.key==='Escape'){tab=tabs.length-1;idx=0;render();e.preventDefault();}
  });
  addTimer(render,1000);
  render();
  setHint('BIOS: ke tab Boot, ubah Boot Option #1 ke USB (tekan Enter untuk berganti), lalu Exit - Save Changes and Exit.');
}

  function draw(){
    var bi=document.getElementById('bi');

    bi.innerHTML=html;
    bi.querySelectorAll('.bi').forEach(function(b){
      b.onclick=function(){sel=+b.getAttribute('data-i');choose();};
    });
  }
  function choose(){
    var d=list[sel][1];
    if(d==='usb'&&S.usb)return grub('live');
    if(d==='ssd'&&S.diskHasOS)return grub('installed');
    noBoot();
  }
  setKeyHandler(function(e){
    if(e.key==='ArrowDown'){sel=(sel+1)%list.length;draw();e.preventDefault();}
    else if(e.key==='ArrowUp'){sel=(sel+list.length-1)%list.length;draw();e.preventDefault();}
    else if(e.key==='Enter'){choose();e.preventDefault();}
    else if(e.key==='Escape'){post(true);e.preventDefault();}
  });
  draw();
  setHint('Pilih USB installer untuk melanjutkan ke GRUB.');
}

/* ============ FASE 4: GRUB ============ */
function grub(mode){
  setPhase('grub');
  var live=(mode==='live');
  var entries;
  if(live){
    entries=[['Try or Install Ubuntu','live'],['Ubuntu (safe graphics)','safe'],['OEM install (for manufacturers)','oem'],['Boot from next volume','next'],['UEFI Firmware Settings','fw']];
  }else{
    entries=[['Ubuntu','installed'],['Advanced options for Ubuntu','adv']];
  }
  var sel=0,cd=live?10:5,done=false;
  var box=h('<div class="grub">'+
   '<div class="g-ver">GNU GRUB version 2.12-1ubuntu26.04</div>'+
   '<div class="g-cd" id="gcd"></div>'+
   '<div class="g-box" id="gbox"></div>'+
   '<div class="g-help">Use the up and down keys to select which entry is highlighted.<br>Press Enter to boot the selected entry.</div></div>');
  mount(box);
  function draw(){
    var gb=document.getElementById('gbox');
    if(!gb)return;
    var html='';
    entries.forEach(function(e,i){html+='<div class="g-it'+(i===sel?' cur':'')+'" data-i="'+i+'">'+esc(e[0])+'</div>';});
    gb.innerHTML=html;
    gb.querySelectorAll('.g-it').forEach(function(b){
      b.onclick=function(){sel=+b.getAttribute('data-i');go();};
    });
    var gcd=document.getElementById('gcd');
    if(gcd)gcd.textContent=(cd<=90&&cd>0)?('The highlighted entry will be executed automatically in '+cd+'s.'):'';
  }
  function bootMsg(name,cb){
    mount(h('<div class="grub" style="color:#ddd">Booting '+esc(name)+'...</div>'));
    setTimeout(cb,600/S.speed);
  }
  function go(){
    if(done)return;
    var a=entries[sel][1];
    if(a==='live'||a==='safe'){
      done=true;
      bootMsg(entries[sel][0],function(){kernelLog(a);});
    }else if(a==='installed'){
      done=true;
      bootMsg('Ubuntu, with Linux 6.17.0-12-generic',function(){kernelLog('installed');});
    }else if(a==='adv'){
      entries=[['Ubuntu, with Linux 6.17.0-12-generic','installed'],['Ubuntu, with Linux 6.17.0-12-generic (recovery mode)','recovery'],['Back','back']];
      sel=0;cd=999;done=false;draw();
    }else if(a==='recovery'){
      done=true;
      mount(h('<div class="phase-black"><div class="klog"><div class="ll">Ubuntu 26.04 LTS recovery mode (simulasi)</div><div class="ll ok">Melanjutkan boot normal...</div></div></div>'));
      setTimeout(function(){kernelLog('installed');},2000/S.speed);
    }else if(a==='back'){
      grub(mode);
    }else if(a==='oem'){
      toast('OEM install dinonaktifkan dalam simulasi');
    }else if(a==='fw'){
      done=true;
      bootMsg('Rebooting into firmware setup...',function(){bios();});
    }else if(a==='next'){
      done=true;
      if(S.usb&&S.diskHasOS)grub('live');
      else if(S.diskHasOS)grub('installed');
      else noBoot();
    }
  }
  setKeyHandler(function(e){
    if(e.key==='ArrowDown'){sel=(sel+1)%entries.length;cd=999;draw();e.preventDefault();}
    else if(e.key==='ArrowUp'){sel=(sel+entries.length-1)%entries.length;cd=999;draw();e.preventDefault();}
    else if(e.key==='Enter'){go();e.preventDefault();}
    else if(e.key==='e'||e.key==='c'){toast('Pengeditan entri GRUB dinonaktifkan dalam simulasi');e.preventDefault();}
  });
  draw();
  setHint('GRUB: panah memilih entri, Enter untuk boot. Entri pertama otomatis dijalankan setelah hitungan mundur.');
  (async function(){
    while(cd>0){
      await wait(1000);
      cd--;
      draw();
      if(cd<=0){go();return;}
    }
  })();
}

async function plymouth(mode){

function TermBuild(body,rec){
  var U=DESK.user;
  var isLive=DESK.live;
  var cwd='/home/'+U.user;
  var buf='';
  var busy=false;
  var pwPending=null;
  var sudoTries=0;
  var hist=[];
  var hidx=0;
  var curTx=null;
  var curCr=null;
  var el=document.createElement('div');
  el.className='term';
  el.tabIndex=0;
  body.appendChild(el);
  function short(p){
    var hm='/home/'+U.user;
    if(p===hm)return '~';
    if(p.indexOf(hm)===0)return '~'+p.slice(hm.length);
    return p;
  }
  function outp(txt){var d=document.createElement('div');d.className='tl';d.textContent=txt;el.appendChild(d);el.scrollTop=1e9;}
  function outh(html){var d=document.createElement('div');d.className='tl';d.innerHTML=html;el.appendChild(d);el.scrollTop=1e9;}
  function freeze(){
    if(curTx)curTx.textContent='';
    if(curCr){curCr.remove();curCr=null;}
  }
  function newPrompt(prefix){
    var line=document.createElement('div');
    line.className='tl';
    if(prefix!==undefined){
      line.textContent=prefix;
    }else{
      var u=document.createElement('span');u.className='pu';u.textContent=U.user+'@'+U.host;
      var c=document.createElement('span');c.textContent=':';
      var d=document.createElement('span');d.className='pwd2';d.textContent=short(cwd);
      var dl=document.createElement('span');dl.textContent='$ ';
      line.appendChild(u);line.appendChild(c);line.appendChild(d);line.appendChild(dl);
    }
    var tx=document.createElement('span');
    var cr=document.createElement('span');
    cr.className='cr';
    line.appendChild(tx);
    line.appendChild(cr);
    el.appendChild(line);
    curTx=tx;
    curCr=cr;
    el.scrollTop=1e9;
  }
  function renderBuf(){
    if(curTx)curTx.textContent=pwPending?'':buf;
  }
  function resolve(p){
    var hm='/home/'+U.user;
    if(!p)return cwd;
    if(p==='~')return hm;
    if(p.slice(0,2)==='~/')return hm+'/'+p.slice(2);
    if(p.charAt(0)!=='/')return cwd+'/'+p;
    var parts=[];
    var segs=p.split('/');
    for(var i=0;i<segs.length;i++){
      var s2=segs[i];
      if(!s2||s2==='.')continue;
      if(s2==='..'){parts.pop();}
      else{parts.push(s2);}
    }
    return '/'+parts.join('/');
  }
  function nodeAt(p){
    var hm='/home/'+U.user;
    if(p===hm||p===hm+'/')return{dir:true,ch:FSY};
    if(p.indexOf(hm+'/')!==0)return null;
    var rel=p.slice(hm.length+1);
    while(rel.length&&rel.charAt(rel.length-1)==='/')rel=rel.slice(0,-1);
    if(!rel)return{dir:true,ch:FSY};
    var cur=FSY;
    var seg=rel.split('/');
    for(var i=0;i<seg.length;i++){
      var s2=seg[i];
      if(cur===null||typeof cur!=='object')return null;
      if(!(s2 in cur))return null;
      cur=cur[s2];
    }
    if(typeof cur==='string')return{file:cur};
    if(cur&&typeof cur==='object')return{dir:true,ch:cur};
    return null;
  }
  var LOCKMSG='E: Could not open lock file /var/lib/dpkg/lock-frontend - open (13: Permission denied)\nE: Unable to acquire the dpkg frontend lock, are you root?';

    var wrap=document.createElement('div');

    var art=document.createElement('pre');
    art.style.cssText='color:#E95420;font-family:inherit;font-size:12.5px;line-height:1.18;margin:0';
    art.textContent=UBUART.join('\n');

    inf.innerHTML=info;
    wrap.appendChild(art);
    wrap.appendChild(inf);

    el.scrollTop=1e9;
  };
  CM.lsb_release=function(){outp('No LSB modules are available.\nDistributor ID:\tUbuntu\nDescription:\tUbuntu 26.04 LTS\nRelease:\t26.04\nCodename:\tresolute');};
  CM.uname=function(){outp('Linux '+U.host+' 6.17.0-12-generic #26.04.1-Ubuntu SMP PREEMPT_DYNAMIC Fri Jan  9 18:12:41 UTC 2026 x86_64 x86_64 x86_64 GNU/Linux');};
  CM.df=function(){

    outp('Filesystem      Size  Used Avail Use% Mounted on\ntmpfs           3.1G  2.1M  3.1G   1% /run\n'+dev+'  968G   24G  895G   3% /\ntmpfs            16G     0   16G   0% /dev/shm\n/dev/nvme0n1p1  1.1G  6.1M  1.1G   1% /boot/efi\ntmpfs           3.2G  128K  3.2G   1% /run/user/1000');
  };
  CM.free=function(){outp('               total        used        free      shared  buff/cache   available\nMem:            31Gi       2.1Gi        28Gi       412Mi       1.2Gi        29Gi\nSwap:          8.0Gi          0B       8.0Gi');};
  CM.whoami=function(){outp(U.user);};
  CM.hostname=function(){outp(U.host);};
  CM.pwd=function(){outp(cwd);};
  CM.date=function(){

    var tzl={'Asia/Jakarta':'WIB','Asia/Makassar':'WITA','Asia/Jayapura':'WIT'}[z]||'';
    try{

    }catch(e){outp(new Date().toString());}
  };
  CM.uptime=function(){

    outp(' '+new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'})+' up '+up+' min,  1 user,  load average: 0.31, 0.25, 0.19');
  };
  CM.echo=function(a2){
    var s=a2.join(' ');
    s=s.split('$USER').join(U.user);

  };
  CM.history=function(){hist.forEach(function(x,i){outp('  '+(i+1)+'  '+x);});};
  CM.clear=function(){el.innerHTML='';};

  CM.reboot=function(a2,had){

  };
  CM.poweroff=function(a2,had){
    if(!isLive&&!had){outp('poweroff: Permission denied (coba: sudo poweroff)');return;}
    setTimeout(powerOffAll,400/S.speed);
  };
  CM.ls=function(a2){
    var showAll=(a2.indexOf('-a')>=0);
    var long=(a2.indexOf('-l')>=0);
    var pathArg=null;
    for(var i=0;i<a2.length;i++){if(a2[i].charAt(0)!=='-'){pathArg=a2[i];break;}}
    var n=nodeAt(resolve(pathArg||''));
    if(!n){outp("ls: cannot access '"+(pathArg||'')+"': No such file or directory");return;}
    if(n.file!==undefined){outp(pathArg||short(cwd));return;}
    var keys=Object.keys(n.ch);
    var list=showAll?['.','..'].concat(keys):keys.filter(function(k){return k.charAt(0)!=='.';});
    if(long){
      outp('total '+(list.length*4));
      list.forEach(function(x){
        var isD=(x==='.'||x==='..')||typeof n.ch[x]==='object';
        outp((isD?'drwxr-xr-x':'-rw-r--r--')+'  2 '+U.user+' '+U.user+'  4096 Jan 12 10:03 '+x);
      });
    }else{
      outh(list.map(function(x){
        var isD=(x==='.'||x==='..')||typeof n.ch[x]==='object';
        return isD?'<span class="dir">'+esc(x)+'</span>':esc(x);
      }).join('  '));
    }
  };
  CM.cd=function(a2){
    var p=a2[0]||'~';
    var tgt=resolve(p);
    var n=nodeAt(tgt);
    if(n&&n.dir)cwd=tgt;
    else outp('bash: cd: '+p+': No such file or directory');
  };
  CM.cat=function(a2){
    if(!a2[0]){outp('cat: missing operand');return;}
    var n=nodeAt(resolve(a2[0]));
    if(!n){outp('cat: '+a2[0]+': No such file or directory');return;}
    if(n.dir){outp('cat: '+a2[0]+': Is a directory');return;}
    outp(n.file);
  };
  CM.apt=function(a2,had){
    var sub=a2[0];
    if(sub!=='update'&&sub!=='install'&&sub!=='remove'){
      outp('apt 2.8.1 (amd64)\nUsage: apt [update|install|remove] <paket>');
      return;
    }
    if(!had){outp(LOCKMSG);return;}
    busy=true;
    (async function(){
      try{
        var lines=['Reading package lists... Done','Building dependency tree... Done','Reading state information... Done'];
        if(sub==='update'){
          lines=['Hit:1 http://id.archive.ubuntu.com/ubuntu resolute InRelease','Get:2 http://id.archive.ubuntu.com/ubuntu resolute-updates InRelease [118 kB]','Get:3 http://security.ubuntu.com/ubuntu resolute-security InRelease [126 kB]','Fetched 244 kB in 1s (218 kB/s)','Reading package lists... Done','All packages are up to date.'];
        }
        for(var i=0;i<lines.length;i++){outp(lines[i]);await wait(140);}
        var pkg=a2[1];
        if(sub!=='update'){
          if(!pkg||!/^[a-z0-9][a-z0-9.+-]*$/.test(pkg)){
            outp('E: Unable to locate package '+(pkg||''));
          }else if(sub==='install'){
            outp('The following NEW packages will be installed:');
            outp('  '+pkg);
            outp('0 upgraded, 1 newly installed, 0 to remove and 0 not upgraded.');
            await wait(200);
            outp('Get:1 http://id.archive.ubuntu.com/ubuntu resolute/universe amd64 '+pkg+' [1,204 kB]');
            await wait(300);
            outp('Unpacking '+pkg+' (1.2-1) ...');
            await wait(260);
            outp('Setting up '+pkg+' (1.2-1) ...');
            await wait(200);
            outp('Processing triggers for man-db (2.13.0-1) ...');
            S.pkgs++;
          }else{
            outp('The following packages will be REMOVED:');
            outp('  '+pkg);
            outp('Removing '+pkg+' (1.2-1) ...');
          }
        }
      }finally{
        busy=false;
        newPrompt();
      }
    })();
  };
  async function runLine(line){
    var tr=line.trim();
    if(!tr){newPrompt();return;}
    hist.push(tr);
    hidx=hist.length;
    var parts=tr.split(/\s+/);
    var hadSudo=false;
    if(parts[0]==='sudo'){
      hadSudo=true;
      parts=parts.slice(1);
      if(!isLive&&S.user.pass){
        pwPending={parts:parts};
        newPrompt('[sudo] password for '+U.user+': ');
        return;
      }
    }
    await execCmd(parts,hadSudo);
  }
  async function execCmd(a,hadSudo){
    if(!a.length){outp('usage: sudo command');newPrompt();return;}
    var c=a[0];
    var fn=CM[c];
    if(fn){
      await fn(a.slice(1),hadSudo);
    }else{
      outp('bash: '+c+': command not found');
    }
    if(!busy&&c!=='exit'&&c!=='reboot'&&c!=='poweroff')newPrompt();
  }
  el.addEventListener('keydown',function(e){
    if(busy){e.preventDefault();return;}
    if(pwPending){
      if(e.key==='Enter'){
        e.preventDefault();
        var v=buf;
        buf='';
        freeze();
        var pp=pwPending;
        pwPending=null;
        if(v===S.user.pass){
          execCmd(pp.parts,true);
        }else{
          sudoTries++;
          outp('Sorry, try again.');
          if(sudoTries>=3){
            outp('sudo: 3 incorrect password attempts');
            sudoTries=0;
          }
          newPrompt();
        }
        return;
      }
      if(e.key==='Backspace'){e.preventDefault();buf=buf.slice(0,-1);renderBuf();return;}
      if(e.key.length===1&&!e.ctrlKey&&!e.metaKey){e.preventDefault();buf+=e.key;renderBuf();return;}
      return;
    }
    if(e.key==='Enter'){
      e.preventDefault();
      var cmd=buf;
      buf='';
      freeze();
      runLine(cmd);
    }else if(e.key==='Backspace'){
      e.preventDefault();
      buf=buf.slice(0,-1);
      renderBuf();
    }else if(e.key==='ArrowUp'){
      e.preventDefault();
      if(hist.length){hidx=Math.max(0,hidx-1);buf=hist[hidx]||'';renderBuf();}
    }else if(e.key==='ArrowDown'){
      e.preventDefault();
      hidx=Math.min(hist.length,hidx+1);
      buf=hist[hidx]||'';
      renderBuf();
    }else if(e.ctrlKey&&(e.key==='l'||e.key==='L')){
      e.preventDefault();
      el.innerHTML='';
      newPrompt();
    }else if(e.ctrlKey&&(e.key==='c'||e.key==='C')){
      e.preventDefault();
      outh('^C');
      buf='';
      newPrompt();
    }else if(e.key.length===1&&!e.ctrlKey&&!e.metaKey){
      buf+=e.key;
      renderBuf();
    }
  });
  el.addEventListener('click',function(){el.focus();});
  outp('Ubuntu 26.04 LTS '+U.host+' tty1');
  outp('');
  outp('Ketik "help" untuk daftar perintah simulasi.');
  outp('');
  newPrompt();
  setTimeout(function(){el.focus();},80);
}

function FilesBuild(body,rec,isTrash){
  var cwd=isTrash?'trash':[];

   '<div class="f-bar"><button id="fb">'+ic('chevron-left',16)+'</button><span class="f-path" id="fp"></span></div>'+
   '<div class="f-grid" id="fg"></div></div></div>');

  function draw(){
    var side=document.getElementById('fside');
    if(!side)return;
    var sh='';
    places.forEach(function(p){
      var cur=(cwd==='trash'&&p[0]==='trash')||(p[0]!=='trash'&&(p[0]==='home'?cwd.length===0:cwd[0]===p[0]));
      sh+='<div class="f-pl'+(cur?' cur':'')+'" data-k="'+p[0]+'">'+ic(p[1],15)+p[2]+'</div>';
    });
    side.innerHTML=sh;
    side.querySelectorAll('.f-pl').forEach(function(p){
      p.onclick=function(){
        var k=p.getAttribute('data-k');
        cwd=(k==='home')?[]:(k==='trash'?'trash':[k]);
        draw();
      };
    });
    var g=document.getElementById('fg');
    var fp=document.getElementById('fp');
    if(cwd==='trash'||isTrash){
      fp.textContent='';
      g.innerHTML='<div class="f-empty">'+esc(t('fi-trash'))+'</div>';
      return;
    }
    var n=FSY;
    for(var i=0;i<cwd.length&&n;i++){n=n[cwd[i]];}
    if(!n||typeof n!=='object')n={};
    fp.innerHTML='<b>Beranda</b>'+(cwd.length?' > '+cwd.map(esc).join(' > '):'');
    var keys=Object.keys(n);
    if(!keys.length){g.innerHTML='<div class="f-empty">'+esc(t('fi-empty'))+'</div>';return;}
    var html='';
    keys.forEach(function(k){
      var isDir=typeof n[k]!=='string';
      html+='<div class="f-it" data-k="'+esc(k)+'" data-d="'+(isDir?1:0)+'">'+(isDir?FICON:PICON)+'<span>'+esc(k)+'</span></div>';
    });
    g.innerHTML=html;
    g.querySelectorAll('.f-it').forEach(function(it){
      it.onclick=function(){
        g.querySelectorAll('.f-it').forEach(function(x){x.classList.remove('sel');});
        it.classList.add('sel');
      };
      it.ondblclick=function(){
        var k=it.getAttribute('data-k');
        if(it.getAttribute('data-d')==='1'){cwd=cwd.concat([k]);draw();}
        else openEditor(cwd.concat([k]),n[k]);
      };
    });
  }
  document.getElementById('fb').onclick=function(){
    if(cwd==='trash')cwd=[];
    else cwd=cwd.slice(0,-1);
    draw();
  };
  draw();

       '<div class="fx-srch"><input id="fxs" placeholder="'+esc(t('ff-search'))+'"><button>'+ic('search',15)+'</button></div>'+
       '<div class="fx-tiles" id="fxt2"></div></div>');
      B.appendChild(start);
      var tiles=[['ubuntu.com','#E95420',cof(30)],['wikipedia.org','#5a5a58',ic('globe',26)],['kernel.org','#2b6b3a',ic('cpu',26)]];
      var th='';
      tiles.forEach(function(x){th+='<button class="fx-tile" data-u="'+x[0]+'"><span class="fx-tb" style="background:'+x[1]+'">'+x[2]+'</span>'+x[0]+'</button>';});
      var t2=document.getElementById('fxt2');

      t2.querySelectorAll('.fx-tile').forEach(function(b){b.onclick=function(){go(b.getAttribute('data-u'));};});
      var inp=document.getElementById('fxs');
      inp.onkeydown=function(e){if(e.key==='Enter')search(inp.value);};
      inp.parentElement.querySelector('button').onclick=function(){search(inp.value);};
      tab.textContent='Ubuntu Start';
      addr.value='';
    }else if(st.view==='page'){
      var P=WEB[st.page][S.lang==='id'?'id':'en'];
      var ph='<div class="fx-page"><h1>'+esc(P.h)+'</h1>';
      P.p.forEach(function(x){ph+='<p>'+esc(x)+'</p>';});
      ph+='<p style="color:#777;font-size:12px">- halaman simulasi -</p></div>';
      B.appendChild(h(ph));
      tab.textContent=st.page;
      addr.value='https://'+st.page;
    }else if(st.view==='results'){
      var res=[[t('fx-res1'),'ubuntu.com'],[t('fx-res2'),'wikipedia.org'],[t('fx-res3'),'kernel.org']];
      var rh='<div class="fx-res"><h3>'+esc(st.q)+' - '+(S.lang==='id'?'hasil pencarian (simulasi)':'search results (simulated)')+'</h3>';
      res.forEach(function(r){
        rh+='<div class="fx-r"><b data-u="'+r[1]+'">'+esc(r[0])+'</b><span>'+r[1]+'</span><p>'+esc((WEB[r[1]][S.lang==='id'?'id':'en'].p[0]||'').slice(0,110))+'...</p></div>';
      });
      rh+='</div>';
      B.appendChild(h(rh));
      B.querySelectorAll('.fx-r b').forEach(function(b){b.onclick=function(){go(b.getAttribute('data-u'));};});
      tab.textContent=(S.lang==='id'?'Hasil: ':'Results: ')+st.q;
      addr.value='duckduckgo.com/?q='+encodeURIComponent(st.q);
    }else{
      B.appendChild(h('<div class="fx-page"><h1>'+(S.lang==='id'?'Situs tidak tersedia':'Site unavailable')+'</h1><p>'+esc(t('fx-doc'))+'</p></div>'));
    }
  }
  function go(u){st.view='page';st.page=u;draw();}
  function search(q){
    if(!q.trim())return;
    st.view='results';
    st.q=q.trim();
    draw();
  }
  function nav(v){
    if(!v.trim())return;
    var u=v.trim();
    if(WEB[u])go(u);
    else if(u.indexOf('.')>0&&u.indexOf(' ')<0){st.view='off';draw();}
    else search(u);
  }
  document.getElementById('fxb').onclick=function(){st.view='start';draw();};
  document.getElementById('fxr').onclick=function(){draw();};
  document.getElementById('fxg').onclick=function(){nav(document.getElementById('fxa').value);};
  document.getElementById('fxa').onkeydown=function(e){if(e.key==='Enter')nav(e.target.value);};
  draw();
}

/* ============ INSTALLER ============ */
function openInstaller(){
  if(!DESK)return;
  openWindow({id:'installer',title:t('i-title'),w:960,h:650,build:function(b,rec){
    INST.el=b;
    INST.rec=rec;
    renderInstPage();
  }});
}
function instChain(){
  var c=['welcome','access','kb','net','ti','mode','apps','disk'];
  if(S.diskMode==='manual')c.push('parts');
  c.push('tz','user','confirm');
  return c;
}
function renderInstPage(){
  if(!INST.el||!INST.el.isConnected)return;
  var chain=instChain();
  var pid=INST.special||chain[Math.min(INST.page,chain.length-1)];
  INST.el.innerHTML='';
  var fr=h('<div class="inst"><div class="inst-h"><h2 id="ih"></h2><p id="ihp"></p></div>'+
   '<div class="inst-b" id="ib"></div>'+
   '<div class="inst-f"><span class="inst-note" id="ifn"></span><div class="inst-btns">'+
   '<button class="btn ghost" id="ibk">'+esc(t('k-back'))+'</button>'+
   '<button class="btn primary" id="inx"></button></div></div></div>');
  INST.el.appendChild(fr);
  if(INST.rec){
    var wt=INST.rec.el.querySelector('.win-t');
    if(wt)wt.textContent=t('i-title');
  }
  var A={
    body:document.getElementById('ib'),
    setHead:function(ti,su){document.getElementById('ih').textContent=ti;document.getElementById('ihp').textContent=su||'';},
    setNote:function(n){document.getElementById('ifn').textContent=n||'';},
    setNext:function(label,fn,en){
      var b=document.getElementById('inx');
      b.textContent=label;
      b.disabled=(en===false);
      b.onclick=function(){if(b.disabled)return;fn();};
    }
  };
  var bk=document.getElementById('ibk');
  bk.onclick=function(){
    if(INST.special)return;
    INST.page=Math.max(0,INST.page-1);
    renderInstPage();
  };
  bk.style.visibility=(INST.page===0&&!INST.special)?'hidden':'visible';
  PAGES[pid](A);
}

PAGES.net=function(A){
  A.setHead(t('n-title'),t('n-sub'));
  var wrap=h('<div><div id="nc"></div><div id="nw"></div></div>');
  A.body.appendChild(wrap);
  function draw(){
    var nc=document.getElementById('nc');
    if(!nc)return;
    var icn,name,desc;
    if(S.net.type==='ethernet'){icn='network';name=t('n-eth');desc=t('n-ethd');}
    else if(S.net.type==='wifi'){icn='wifi';name=S.net.ssid;desc=(S.lang==='id'?'Terhubung':'Connected');}
    else{icn='wifi-off';name=(S.lang==='id'?'Offline':'Offline');desc=t('n-offd');}
    nc.innerHTML='<div class="opt-card sel" style="cursor:default"><span class="oc-ic">'+ic(icn,22)+'</span><div><h4>'+esc(name)+'</h4><p>'+esc(desc)+'</p></div></div>'+
     '<label class="chk" style="margin-top:6px"><input type="checkbox" id="noff" '+((S.net.type==='off')?'checked':'')+'><span>'+esc(t('n-off'))+'<small>'+esc(t('n-offd'))+'</small></span></label>';
    document.getElementById('noff').onchange=function(e){
      if(e.target.checked){S.prevNet=S.net;S.net={type:'off'};}
      else{S.net=S.prevNet||{type:'ethernet'};}
      draw();
    };
    var nw=document.getElementById('nw');
    nw.innerHTML='';
    if(!S.wifiOn)return;
    nw.appendChild(h('<label class="lbl">'+esc(t('n-wifi'))+'</label><div id="nwl"><p style="color:var(--dim);font-size:13px">'+esc(t('n-scan'))+'</p></div>'));
    setTimeout(function(){
      var nwl=document.getElementById('nwl');
      if(!nwl)return;
      var wh='';
      WIFIS.forEach(function(w,i){wh+='<div class="crow" data-i="'+i+'"><span style="width:auto">'+ic('lock',14)+'</span><b>'+esc(w.s)+'</b><span style="flex:none">'+ic('wifi',15)+'</span></div>';});
      nwl.innerHTML=wh;
      nwl.querySelectorAll('.crow').forEach(function(r){
        r.onclick=function(){connect(WIFIS[+r.getAttribute('data-i')]);};
      });
    },1000/S.speed);
  }
  function connect(w){
    if(A.body.querySelector('.modal-ov'))return;
    var ov=h('<div class="modal-ov"><div class="modal"><h3>'+esc(w.s)+'</h3><p>'+esc(t('n-pass'))+'</p>'+
     '<input type="password" class="ipt" id="nwp" style="margin-top:12px" placeholder="'+esc(t('n-pass'))+'">'+
     '<p style="font-size:12px;margin-top:8px">'+esc(t('n-hint'))+'</p>'+
     '<div class="m-btns"><button class="btn ghost" id="nwx">'+esc(t('k-cancel'))+'</button><button class="btn primary" id="nwc">'+esc(t('n-conn'))+'</button></div></div></div>');
    A.body.appendChild(ov);
    document.getElementById('nwx').onclick=function(){ov.remove();};
    document.getElementById('nwc').onclick=async function(){
      var p=document.getElementById('nwp').value;
      if(p.length<8){document.getElementById('nwp').style.borderColor='#c01c28';return;}
      ov.remove();
      var nw=document.getElementById('nw');
      if(nw)nw.innerHTML='<p style="color:var(--dim);font-size:13px">'+(S.lang==='id'?'Menghubungkan...':'Connecting...')+'</p>';
      await wait(1500);
      S.net={type:'wifi',ssid:w.s};
      draw();
    };
  }
  draw();
  A.setNext(t('k-next'),function(){INST.page++;renderInstPage();});
};

PAGES.parts=function(A){
  A.setHead(t('pt-title'),t('pt-sub'));
  var TOTAL=1024;
  function free(){return TOTAL-S.parts.reduce(function(s,p){return s+p.size;},0);}
  A.body.appendChild(h('<div>'+
   '<div class="dbar" id="pdb"></div><div style="font-size:12px;color:var(--dim)" id="pfr"></div>'+
   '<table class="parts-t"><thead><tr><th>Nama</th><th>'+esc(t('pt-size'))+'</th><th>'+esc(t('pt-fs'))+'</th><th>'+esc(t('pt-mt'))+'</th><th></th></tr></thead><tbody id="ptb"></tbody></table>'+
   '<div style="display:flex;gap:10px;margin-top:16px"><button class="btn ghost" id="pnew">'+ic('plus',14)+' '+esc(t('pt-new'))+'</button><button class="btn ghost" id="pres">'+esc(t('pt-reset'))+'</button></div></div>'));
  var TYPES={efi:{l:t('pt-efi'),fs:'fat32',mt:'/boot/efi',def:1},
             swap:{l:t('pt-swap'),fs:'linux-swap',mt:'swap',def:8},
             root:{l:t('pt-root'),fs:'ext4',mt:'/',def:100},
             home:{l:t('pt-home'),fs:'ext4',mt:'/home',def:0},
             cust:{l:t('pt-cust'),fs:'ext4',mt:'',def:0}};
  function draw(){
    if(!document.getElementById('pdb'))return;
    var bh='';
    S.parts.forEach(function(p){bh+='<i style="width:'+(p.size/TOTAL*100)+'%"></i>';});
    document.getElementById('pdb').innerHTML=bh;
    document.getElementById('pfr').textContent=t('pt-free')+': '+free().toFixed(1)+' GB';
    var th='';
    S.parts.forEach(function(p,i){
      th+='<tr><td>nvme0n1p'+(i+1)+'</td><td>'+p.size+' GB</td><td>'+p.fs+'</td><td>'+esc(p.mt)+'</td><td><button data-i="'+i+'" title="'+esc(t('pt-del'))+'">'+ic('trash-2',14)+'</button></td></tr>';
    });
    document.getElementById('ptb').innerHTML=th;
    document.getElementById('ptb').querySelectorAll('button').forEach(function(b){
      b.onclick=function(){S.parts.splice(+b.getAttribute('data-i'),1);draw();};
    });
    var hasRoot=S.parts.some(function(p){return p.mt==='/';});
    var hasEfi=S.parts.some(function(p){return p.mt==='/boot/efi';});
    var note=(hasRoot?'':t('pt-needroot')+' ')+(hasRoot&&!hasEfi?t('pt-noefi'):'');
    A.setNote(note);
    A.setNext(t('k-next'),function(){INST.page++;renderInstPage();},hasRoot);
  }
  draw();
  document.getElementById('pres').onclick=function(){S.parts=[];draw();};
  document.getElementById('pnew').onclick=function(){
    if(free()<=0){toast(t('pt-err-size'));return;}
    var oh='';
    Object.keys(TYPES).forEach(function(k){oh+='<option value="'+k+'">'+esc(TYPES[k].l)+'</option>';});
    var ov=h('<div class="modal-ov"><div class="modal"><h3>'+esc(t('pt-new'))+'</h3>'+
     '<label class="lbl">'+esc(t('pt-type'))+'</label><select class="sel" id="ppty">'+oh+'</select>'+
     '<label class="lbl">'+esc(t('pt-size'))+'</label><input type="number" class="ipt" id="pptz" min="0.1" step="0.1" value="100">'+
     '<div id="ppmtw" style="display:none"><label class="lbl">'+esc(t('pt-mt'))+'</label><input class="ipt" id="ppmt" placeholder="/data"></div>'+
     '<p id="pperr" style="color:#f5a49a;font-size:12.5px;margin-top:8px"></p>'+
     '<div class="m-btns"><button class="btn ghost" id="ppx">'+esc(t('k-cancel'))+'</button><button class="btn primary" id="ppk">'+esc(t('k-next'))+'</button></div></div></div>');
    A.body.appendChild(ov);
    function sync(){
      var k=document.getElementById('ppty').value;
      document.getElementById('pptz').value=Math.min(TYPES[k].def||1,Math.max(0.1,free()));
      document.getElementById('ppmtw').style.display=(k==='cust')?'block':'none';
    }
    document.getElementById('ppty').onchange=sync;
    sync();
    document.getElementById('ppx').onclick=function(){ov.remove();};
    document.getElementById('ppk').onclick=function(){
      var k=document.getElementById('ppty').value;
      var sz=parseFloat(document.getElementById('pptz').value);
      if(!sz||sz<=0||sz>free()){document.getElementById('pperr').textContent=t('pt-err-size');return;}
      var mt=(k==='cust')?(document.getElementById('ppmt').value||'/data'):TYPES[k].mt;
      S.parts.push({size:sz,fs:TYPES[k].fs,mt:mt});
      ov.remove();
      draw();
    };
  };
};

PAGES.user=function(A){
  A.setHead(t('u-title'),t('u-sub'));
  A.body.appendChild(h('<div>'+
   '<label class="lbl">'+esc(t('u-name'))+'</label><input class="ipt" id="un" value="'+esc(S.user.name)+'">'+
   '<label class="lbl">'+esc(t('u-host'))+'</label><input class="ipt" id="uh" value="'+esc(S.user.host)+'">'+
   '<label class="lbl">'+esc(t('u-user'))+'</label><input class="ipt" id="uu" value="'+esc(S.user.user)+'">'+
   '<div style="display:flex;gap:18px;margin-top:16px">'+
   '<div style="flex:1"><label class="lbl">'+esc(t('u-pass'))+'</label><input type="password" class="ipt" id="up"><div class="bar" style="width:200px"><i id="ups"></i></div><div style="font-size:12px;color:var(--dim)" id="upl"></div></div>'+
   '<div style="flex:1"><label class="lbl">'+esc(t('u-pass2'))+'</label><input type="password" class="ipt" id="up2"><div style="font-size:12.5px;margin-top:12px" id="upe"></div></div></div>'+
   '<div style="margin-top:20px;display:flex;flex-direction:column;gap:2px">'+
   '<label class="chk"><input type="radio" name="lg" id="ua" '+((S.user.autologin)?'checked':'')+'><span>'+esc(t('u-auto'))+'</span></label>'+
   '<label class="chk"><input type="radio" name="lg" id="ur" '+((!S.user.autologin)?'checked':'')+'><span>'+esc(t('u-req'))+'</span></label></div>'+
   '<div class="alert" style="display:none" id="uerr">'+ic('triangle-alert',18)+'<span></span></div></div>'));
  var userDirty=S.user.user!=='';
  var hostDirty=S.user.host!=='';
  function validate(){
    var name=document.getElementById('un').value.trim();
    var user=document.getElementById('uu').value.trim();
    var host=document.getElementById('uh').value.trim();
    var p1=document.getElementById('up').value;
    var p2=document.getElementById('up2').value;
    if(!name)return[false,t('u-e-name')];
    if(!user||!/^[a-z_][a-z0-9_-]*$/.test(user))return[false,t('u-e-user')];
    if(!host||!/^[a-zA-Z0-9][a-zA-Z0-9.-]*$/.test(host))return[false,t('u-e-host')];
    if(p1.length<5)return[false,t('u-e-pass')];
    if(p1!==p2)return[false,t('u-e-match')];
    return[true,''];
  }
  function val(){
    var r=validate();
    A.setNext(t('k-next'),commit,r[0]);
    var er=document.getElementById('uerr');
    er.style.display=r[0]?'none':'flex';
    er.querySelector('span').textContent=r[1];
  }
  function commit(){
    var r=validate();
    if(!r[0])return;
    S.user={
      name:document.getElementById('un').value.trim(),
      host:document.getElementById('uh').value.trim(),
      user:document.getElementById('uu').value.trim(),
      pass:document.getElementById('up').value,
      autologin:document.getElementById('ua').checked
    };
    INST.page++;renderInstPage();
  }
  document.getElementById('un').oninput=function(e){
    var v=e.target.value;
    if(!userDirty){
      var u=v.trim().split(/\s+/)[0].toLowerCase().replace(/[^a-z0-9_-]/g,'');
      document.getElementById('uu').value=u;
    }
    if(!hostDirty&&document.getElementById('uu').value){
      document.getElementById('uh').value=document.getElementById('uu').value+'-desktop';
    }
    val();
  };
  document.getElementById('uh').oninput=function(e){hostDirty=(e.target.value!=='');val();};
  document.getElementById('uu').oninput=function(e){userDirty=(e.target.value!=='');val();};
  function strength(v){
    var s=0;
    if(v.length>=5)s++;
    if(v.length>=8)s++;
    if(v.length>=12)s++;
    if((/[a-z]/.test(v)&&/[A-Z]/.test(v))||/[0-9]/.test(v))s++;
    if(s>3)s=3;
    return s;
  }
  function pv(){
    var v=document.getElementById('up').value;
    var s=strength(v);
    var bar=document.getElementById('ups');
    bar.style.width=(v.length?(s*33):0)+'%';
    bar.style.background=['#c01c28','#E95420','#e9a13b','#3e9e4f'][s];
    var labels=[t('u-str1'),t('u-str2'),t('u-str3')];
    document.getElementById('upl').textContent=v?(labels[Math.max(0,s-1)]||''):'';
    var p2=document.getElementById('up2').value;
    var upe=document.getElementById('upe');
    if(p2&&p2===v)upe.innerHTML='<span style="color:#3e9e4f">'+ic('check',14)+'</span>';
    else if(p2)upe.innerHTML='<span style="color:#f5a49a">'+esc(t('u-e-match'))+'</span>';
    else upe.innerHTML='';
    val();
  }
  document.getElementById('up').oninput=pv;
  document.getElementById('up2').oninput=pv;
  document.getElementById('ua').onchange=val;
  document.getElementById('ur').onchange=val;
  A.setNext(t('k-next'),commit,false);
};
PAGES.confirm=function(A){

PAGES.progress=function(A){
  A.setHead(t('p-title'),t('p-sub'));
  A.setNote('');
  var steps=[t('st1'),t('st2'),t('st3'),t('st4'),t('st5'),t('st6')];
  var sh='';
  steps.forEach(function(s,i){sh+='<div class="strow" data-i="'+i+'">'+ic('circle',14)+'<span>'+esc(s)+'</span></div>';});
  A.body.appendChild(h('<div class="pgw"><div style="flex:1">'+
   '<div class="pct" id="pgp">0%</div><div class="bar"><i id="pgb"></i></div>'+
   '<div id="pgs">'+sh+'</div></div>'+
   '<div style="flex:1"><div class="slide" id="pgsl"></div></div></div>'));
  drawSlide(0);
  if(INST.rec)INST.rec.o.onClose=function(){showCancel();return true;};
  function drawSlide(idx){
    var el2=document.getElementById('pgsl');
    if(!el2)return;
    var sl=SLIDES[idx%SLIDES.length];
    var c=sl[S.lang==='id'?'id':'en'];
    el2.innerHTML=ic(sl.icn,38)+'<h4>'+esc(c.t)+'</h4><p>'+esc(c.d)+'</p>';
  }
  function showCancel(){
    if(A.body.querySelector('.modal-ov'))return;
    var ov=h('<div class="modal-ov"><div class="modal"><h3>'+esc(t('d-p-title'))+'</h3><p>'+esc(t('d-p-sub'))+'</p>'+
     '<div class="m-btns"><button class="btn ghost" id="cpx">'+esc(t('d-p-c'))+'</button><button class="btn primary" id="cpg">'+esc(t('d-p-go'))+'</button></div></div></div>');
    A.body.appendChild(ov);
    document.getElementById('cpg').onclick=function(){ov.remove();};
    document.getElementById('cpx').onclick=function(){
      INST.abort=true;
      ov.remove();
      closeWin('installer');
      INST.special=null;
      INST.page=instChain().indexOf('confirm');
    };
  }
};
async function runInstall(){
  INST.abort=false;
  var steps=[t('st1'),t('st2'),t('st3'),t('st4'),t('st5'),t('st6')];
  var w=[8,45,18,14,10,5];
  var p=0;
  var ticks=0;
  for(var i=0;i<steps.length;i++){
    if(INST.abort)return;
    markStep(i,steps[i]);
    var n=Math.max(4,Math.ceil(w[i]*16));
    for(var j=0;j<n;j++){
      if(INST.abort)return;
      await wait(50);
      var pg=document.getElementById('pgp');
      if(!pg)return;
      p+=w[i]/n;
      pg.textContent=Math.floor(p)+'%';
      document.getElementById('pgb').style.width=p+'%';
      ticks++;
      if(ticks%80===0)drawInstallSlide(Math.floor(ticks/80));
    }
  }
  if(INST.abort)return;
  S.diskHasOS=true;
  renderDicons();
  if(INST.rec)INST.rec.o.onClose=null;
  INST.special='done';
  renderInstPage();
  toast('Instalasi selesai');
}
function markStep(i,label){
  var row=document.querySelector('#pgs [data-i="'+i+'"]');
  if(!row)return;
  row.classList.add('on');
  row.innerHTML=ic('circle-check',14)+'<span>'+esc(label)+'</span>';
}
function drawInstallSlide(idx){
  var el2=document.getElementById('pgsl');
  if(!el2)return;
  var sl=SLIDES[idx%SLIDES.length];
  var c=sl[S.lang==='id'?'id':'en'];
  el2.innerHTML=ic(sl.icn,38)+'<h4>'+esc(c.t)+'</h4><p>'+esc(c.d)+'</p>';
}
PAGES.done=function(A){
  A.setHead(t('d-title'),t('d-sub'));

  document.getElementById('ibk').style.visibility='hidden';
  A.setNext(t('d-restart'),function(){rebootNotice();});

  document.getElementById('inx').parentElement.insertBefore(g,document.getElementById('inx'));

/* ============ REBOOT & LOGIN ============ */
async function rebootNotice(){
  DESK=null;
  setPhase('reboot');
  mount(h('<div class="rbnote"><div class="blink" style="color:#fff">Please remove the installation medium, then press ENTER:</div>'+
   '<div style="font-size:13px;color:#888">(Lepaskan media instalasi, lalu tekan ENTER)</div></div>'));
  S.usb=false;
  renderSimbar();
  toast('Media USB dilepas');
  setHint('Tekan ENTER (atau tunggu sebentar) untuk memulai ulang komputer.');
  var fired=false;
  function go(){if(fired)return;fired=true;post(true);}
  setKeyHandler(function(e){if(e.key==='Enter')go();});
  setTimeout(go,5000);
}
function loginScreen(){
  setPhase('login');
  var nm=S.user.name||S.user.user||'user';
  var cols=['#772953','#E95420','#2e7d32','#35507a','#8a4fbf'];
  var seed=S.user.user||'u';
  var acc=0;
  for(var i=0;i<seed.length;i++)acc+=seed.charCodeAt(i);
  var col=cols[acc%cols.length];
  var timeStr='',dateStr='';
  try{
    timeStr=new Intl.DateTimeFormat(LOC(),{timeZone:S.tz.zone,hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).format(new Date());
    dateStr=new Intl.DateTimeFormat(LOC(),{timeZone:S.tz.zone,weekday:'long',day:'numeric',month:'long'}).format(new Date());
  }catch(e){timeStr=new Date().toLocaleTimeString();}
  var sc=h('<div class="login"><div class="wall">'+WALL+'</div>'+
   '<div class="lg-top"><div class="lk-t" id="lgt">'+esc(timeStr)+'</div><div class="lk-d" id="lgd">'+esc(dateStr)+'</div></div>'+
   '<div class="lg-card"><div class="lg-av" style="background:'+col+'">'+esc((nm[0]||'u').toUpperCase())+'</div>'+
   '<div class="lg-name">'+esc(nm)+'</div>'+
   '<form class="lg-form" id="lgf"><div class="lg-in"><input type="password" id="lgi" placeholder="'+esc(t('lg-pass'))+'" autocomplete="off"><button type="submit">'+ic('chevron-right',17)+'</button></div>'+
   '<div class="lg-err" id="lge"></div></form>'+
   '<div class="lg-note">'+esc(t('lg-note'))+'</div></div>'+
   '<div class="lg-power"><button id="lgp">'+ic('power',18)+'</button></div></div>');
  mount(sc);
  function upd(){
    try{
      document.getElementById('lgt').textContent=new Intl.DateTimeFormat(LOC(),{timeZone:S.tz.zone,hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).format(new Date());
      document.getElementById('lgd').textContent=new Intl.DateTimeFormat(LOC(),{timeZone:S.tz.zone,weekday:'long',day:'numeric',month:'long'}).format(new Date());
    }catch(e){}
  }
  upd();
  addTimer(upd,5000);
  var inp=document.getElementById('lgi');
  setTimeout(function(){inp.focus();},150);
  document.getElementById('lgf').onsubmit=function(e){
    e.preventDefault();
    if(inp.value===S.user.pass){
      inp.blur();
      var ov=h('<div style="position:absolute;inset:0;background:#0a0a0b;opacity:0;transition:opacity .7s;z-index:5"></div>');
      sc.appendChild(ov);
      requestAnimationFrame(function(){ov.style.opacity='1';});
      setTimeout(startDesktop,750);
    }else{
      document.getElementById('lge').textContent=t('lg-err');
      var card=sc.querySelector('.lg-card');
      card.classList.remove('shake');
      void card.offsetWidth;
      card.classList.add('shake');
      beep(300,140);
      inp.select();
    }
  };
  var pwopen=false;
  document.getElementById('lgp').onclick=function(){
    if(pwopen)return;
    pwopen=true;
    var p=h('<div class="pop sysm" style="position:absolute;right:20px;bottom:80px"><div class="sm-pw" style="display:flex">'+
     '<button id="lgr">'+ic('rotate-ccw',15)+' '+esc(t('sm-re'))+'</button>'+
     '<button id="lgo">'+ic('power',15)+' '+esc(t('sm-off'))+'</button></div></div>');
    sc.appendChild(p);
    document.getElementById('lgr').onclick=function(){p.remove();pwopen=false;DESK=null;post(true);};
    document.getElementById('lgo').onclick=function(){p.remove();powerOffAll();};
  };
  setHint('Login GDM: masukkan kata sandi yang Anda buat pada langkah Siapa Anda?, lalu tekan Enter.');
}

/* ============ MULAI ============ */
try{
  S=freshState();
  renderSimbar();
  powerScreen();
}catch(err){
  var eb=document.getElementById('errbox');
  if(eb){eb.style.display='block';eb.textContent='Gagal memulai: '+(err.message||err);}
}
})();
