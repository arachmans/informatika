/* ============ Excel ============ */
function openExcel(seed){
  createWindow({app:APPS.excel,title:'Buku1 — Excel',w:940,h:620,build:function(body,win){
    var cells={};
    if(seed)Object.assign(cells,seed);
    var COLS='ABCDEFGHIJ'.split(''),ROWS=24;
    var namebox=h('div',{class:'xl-name'},'A1');
    var fx=h('input',{spellcheck:'false'});
    var grid=h('div',{class:'xl-grid',tabindex:'0'});
    var cur='A1',editKey=null;
    function disp(raw){
      if(raw===null||raw===undefined||raw==='')return '';
      if(raw.charAt(0)==='='){
        var ex=raw.slice(1).toUpperCase().replace(/\b([A-J])([1-9]|1\d|2[0-4])\b/g,function(m,c,r){
          var v=disp(cells[c+r]||'');
          var n=parseFloat(String(v).replace(',','.'));
          return isNaN(n)?'0':String(n);
        });
        if(!ex||/[^0-9+\-*/(). ]/.test(ex))return '#NAME?';
        try{
          var v=Function('"use strict";return ('+ex+')')();
          return(typeof v==='number'&&isFinite(v))?String(Math.round(v*1e10)/1e10):'#DIV/0!';
        }catch(e){return '#ERROR?'}
      }
      return raw;
    }
    function cellEl(k){return grid.querySelector('[data-k="'+k+'"]')}
    function renderCell(k){
      var el=cellEl(k);
      if(!el)return;
      var v=disp(cells[k]);
      el.textContent=v;
      el.classList.toggle('num',v!==''&&/^-?[\d.,]+$/.test(v));
      el.classList.toggle('errc',typeof v==='string'&&v.charAt(0)==='#');
    }
    function setCur(k){
      var old=cellEl(cur);
      if(old)old.classList.remove('cur');
      cur=k;
      var el=cellEl(k);
      el.classList.add('cur');
      namebox.textContent=k;
      if(!editKey)fx.value=cells[k]||'';
      $$('.xl-h.hl,.xl-rh.hl',grid).forEach(function(x){x.classList.remove('hl')});
      var ch=grid.querySelector('.xl-h[data-c="'+k.charAt(0)+'"]');
      var rh=grid.querySelector('.xl-rh[data-r="'+k.slice(1)+'"]');
      if(ch)ch.classList.add('hl');
      if(rh)rh.classList.add('hl');
      el.scrollIntoView({block:'nearest',inline:'nearest'});
    }
    var html='<div class="xl-row"><div class="xl-rh" style="height:22px"></div>'+
      COLS.map(function(c){return '<div class="xl-h" data-c="'+c+'">'+c+'</div>'}).join('')+'</div>';
    var r;
    for(r=1;r<=ROWS;r++){
      html+='<div class="xl-row"><div class="xl-rh" data-r="'+r+'">'+r+'</div>'+
        COLS.map(function(cc){return '<div class="xl-c" data-k="'+cc+r+'"></div>'}).join('')+'</div>';
    }
    grid.innerHTML=html;
    var k;
    for(k in cells)renderCell(k);
    function move(k,d){
      var ci=COLS.indexOf(k.charAt(0)),ri=parseInt(k.slice(1),10);
      var nc=clamp(ci+(d==='right'?1:d==='left'?-1:0),0,COLS.length-1);
      var nr=clamp(ri+(d==='down'?1:d==='up'?-1:0),1,ROWS);
      return COLS[nc]+nr;
    }
    function beginEdit(ch){
      editKey=cur;
      fx.value=ch;
      var el=cellEl(cur);
      if(el){el.classList.add('edit');el.textContent=ch}
      fx.focus();
      fx.setSelectionRange(fx.value.length,fx.value.length);
    }
    function commitEdit(d){
      if(!editKey)return;
      var kk=editKey;
      editKey=null;
      cells[kk]=fx.value||null;
      var el=cellEl(kk);
      if(el)el.classList.remove('edit');
      renderCell(kk);
      if(d!=='none')setCur(move(kk,d));
      grid.focus();
    }
    grid.addEventListener('pointerdown',function(e){
      var cell=e.target.closest('.xl-c');
      if(cell){commitEdit('none');setCur(cell.dataset.k);grid.focus();return}
      var hh=e.target.closest('.xl-h');
      if(hh){commitEdit('none');setCur(hh.dataset.c+'1');grid.focus();return}
      var rh=e.target.closest('.xl-rh');
      if(rh&&rh.dataset.r){commitEdit('none');setCur('A'+rh.dataset.r);grid.focus()}
    });
    grid.addEventListener('keydown',function(e){
      if(e.ctrlKey||e.metaKey||e.altKey)return;
      var dirs={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down',Enter:'down',Tab:'right'};
      if(dirs[e.key]){setCur(move(cur,dirs[e.key]));e.preventDefault();return}
      if(e.key==='Delete'||e.key==='Backspace'){cells[cur]=null;renderCell(cur);e.preventDefault();return}
      if(e.key.length===1){beginEdit(e.key);e.preventDefault()}
    });
    fx.addEventListener('input',function(){
      if(editKey){var el=cellEl(editKey);if(el)el.textContent=fx.value}
    });
    fx.addEventListener('keydown',function(e){
      if(e.key==='Enter'){commitEdit('down');e.preventDefault()}
      else if(e.key==='Tab'){commitEdit(e.shiftKey?'left':'right');e.preventDefault()}
      else if(e.key==='Escape'){
        var kk=editKey;editKey=null;
        if(kk){var el=cellEl(kk);if(el)el.classList.remove('edit');renderCell(kk);setCur(kk)}
        grid.focus();
      }
      else if(e.key.indexOf('Arrow')===0){
        commitEdit({ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down'}[e.key]);
        e.preventDefault();
      }
    });
    var btnSave=h('button',{class:'rb',html:IC.save(),title:'Simpan',onclick:function(){
      toast({title:'Buku kerja disimpan',msg:'(Disimpan dalam memori simulasi ini saja.)',icon:IC.save(),sound:false});
    }});
    var rib=h('div',{class:'xl-rib'},btnSave);
    var fxRow=h('div',{class:'xl-fx'},namebox,h('span',{class:'fx'},'fx'),fx);
    var stat=h('div',{class:'xl-stat'},
      h('span',{},'Siap'),
      h('div',{class:'xl-sheets'},h('span',{},'Sheet1')),
      h('span',{},'Coba formula: =B2+B3'));
    body.append(h('div',{class:'xl'},rib,fxRow,grid,stat));
    setCur('A1');
    setTimeout(function(){grid.focus()},100);
  }});
}

/* ============ CorelDRAW (kanvas menggambar) ============ */
function openCorel(seedShapes){
  createWindow({app:APPS.corel,title:'Grafik1 — CorelDRAW',w:1000,h:660,build:function(body,win){
    var NS='http://www.w3.org/2000/svg';
    var shapes=seedShapes?seedShapes.map(function(s){return s}):[];
    var sel=-1,tool='pick',drawing=null;
    var fill='#ffd60a',line='#1a1a1a',sw=2;
    var PAL=['#1a1a1a','#ffffff','#e63946','#f4a261','#ffd60a','#2a9d8f','#185abd','#7b2cbf'];
    var toolNames={pick:'Pilih',r:'Persegi panjang',e:'Elips',f:'Gambar bebas',tx:'Teks'};
    var typeNames={r:'Persegi panjang',e:'Elips',f:'Garis bebas',tx:'Teks'};
    function hs(tag,attrs){
      var e=document.createElementNS(NS,tag);
      if(attrs)for(var k in attrs){
        if(k.slice(0,2)==='on')e.addEventListener(k.slice(2),attrs[k]);
        else e.setAttribute(k,attrs[k]);
      }
      return e;
    }
    var svg=hs('svg');
    var canvas=h('div',{class:'cd-canvas'},h('div',{class:'cd-page'}),svg);
    function pt(e){
      var r=svg.getBoundingClientRect();
      return [e.clientX-r.left,e.clientY-r.top];
    }
    function shapeEl(s){
      if(s.t==='r')return hs('rect',{x:s.x,y:s.y,width:s.w,height:s.h,fill:s.fill,stroke:s.stroke,'stroke-width':s.sw});
      if(s.t==='e')return hs('ellipse',{cx:s.x+s.w/2,cy:s.y+s.h/2,rx:Math.max(1,Math.abs(s.w/2)),ry:Math.max(1,Math.abs(s.h/2)),fill:s.fill,stroke:s.stroke,'stroke-width':s.sw});
      if(s.t==='f')return hs('polyline',{points:s.pts.map(function(p){return p[0]+','+p[1]}).join(' '),fill:'none',stroke:s.stroke,'stroke-width':s.sw,'stroke-linecap':'round','stroke-linejoin':'round'});
      var t=hs('text',{x:s.x,y:s.y,fill:s.fill,'font-size':s.fs,'font-family':"'Segoe UI',sans-serif"});
      t.textContent=s.text;
      return t;
    }
    var els=[];
    function render(){
      while(svg.firstChild)svg.removeChild(svg.firstChild);
      els=[];
      shapes.forEach(function(s,i){
        var el=shapeEl(s);
        el.style.pointerEvents=(tool==='pick')?'auto':'none';
        (function(ix){el.addEventListener('pointerdown',function(ev){onShapeDown(ev,ix)})})(i);
        svg.append(el);
        els.push(el);
      });
      if(drawing){
        if(drawing.t==='f'){
          svg.append(hs('polyline',{points:drawing.pts.map(function(p){return p[0]+','+p[1]}).join(' '),fill:'none',stroke:line,'stroke-width':sw,'stroke-linecap':'round'}));
        }else{
          var dx=Math.min(drawing.x,drawing.x+drawing.w),dy=Math.min(drawing.y,drawing.y+drawing.h);
          var dw=Math.abs(drawing.w),dh=Math.abs(drawing.h);
          if(drawing.t==='r')svg.append(hs('rect',{x:dx,y:dy,width:dw,height:dh,fill:'none',stroke:line,'stroke-dasharray':'4 3'}));
          else svg.append(hs('ellipse',{cx:drawing.x+drawing.w/2,cy:drawing.y+drawing.h/2,rx:Math.abs(drawing.w/2),ry:Math.abs(drawing.h/2),fill:'none',stroke:line,'stroke-dasharray':'4 3'}));
        }
      }
      if(sel>=0&&shapes[sel]&&!drawing)drawSel();
      updStat();
    }
    function drawSel(){
      var b=els[sel].getBBox(),pad=5;
      svg.append(hs('rect',{x:b.x-pad,y:b.y-pad,width:b.width+pad*2,height:b.height+pad*2,fill:'none',stroke:'#4cc2ff','stroke-width':1,'stroke-dasharray':'5 4','pointer-events':'none'}));
      var s=shapes[sel];
      if(s.t!=='f'){
        var hd=hs('rect',{x:b.x+b.width+pad-4,y:b.y+b.height+pad-4,width:9,height:9,fill:'#fff',stroke:'#4cc2ff','stroke-width':1.4,style:'cursor:nwse-resize'});
        hd.addEventListener('pointerdown',function(ev){ev.stopPropagation();startResize(ev)});
        svg.append(hd);
      }
    }
    function startResize(ev){
      var s=shapes[sel];
      if(!s)return;
      var sx=ev.clientX,sy=ev.clientY;
      var o={w:s.w||0,h:s.h||0,fs:s.fs||0};
      function mv(e){
        var dx=e.clientX-sx,dy=e.clientY-sy;
        if(s.t==='tx')s.fs=Math.max(8,Math.round(o.fs+dy*.4));
        else{s.w=Math.max(6,o.w+dx);s.h=Math.max(6,o.h+dy)}
        render();
      }
      function up(){
        window.removeEventListener('pointermove',mv);
        window.removeEventListener('pointerup',up);
      }
      window.addEventListener('pointermove',mv);
      window.addEventListener('pointerup',up);
    }
    function onShapeDown(ev,i){
      ev.stopPropagation();
      sel=i;
      syncFrom(shapes[i]);
      render();
      var s=shapes[i];
      var sx=ev.clientX,sy=ev.clientY;
      var o={x:s.x,y:s.y,pts:s.pts?s.pts.map(function(p){return p.slice()}):null};
      function mv(e){
        var dx=e.clientX-sx,dy=e.clientY-sy;
        if(s.t==='f')s.pts=o.pts.map(function(p){return [p[0]+dx,p[1]+dy]});
        else{s.x=o.x+dx;s.y=o.y+dy}
        render();
      }
      function up(){
        window.removeEventListener('pointermove',mv);
        window.removeEventListener('pointerup',up);
      }
      window.addEventListener('pointermove',mv);
      window.addEventListener('pointerup',up);
    }
    svg.addEventListener('pointerdown',function(e){
      if(e.button!==0)return;
      var p=pt(e);
      if(tool==='pick'){sel=-1;render();return}
      if(tool==='tx'){placeTextInput(p);return}
      if(tool==='f')drawing={t:'f',pts:[p]};
      else drawing={t:tool,x:p[0],y:p[1],w:0,h:0};
      function mv(e2){
        var q=pt(e2);
        if(drawing.t==='f'){
          var last=drawing.pts[drawing.pts.length-1];
          if(Math.hypot(q[0]-last[0],q[1]-last[1])>3){drawing.pts.push(q);render()}
        }else{
          drawing.w=q[0]-drawing.x;drawing.h=q[1]-drawing.y;render();
        }
      }
      function up(){
        window.removeEventListener('pointermove',mv);
        window.removeEventListener('pointerup',up);
        commitDraw();
      }
      window.addEventListener('pointermove',mv);
      window.addEventListener('pointerup',up);
      render();
    });
    function commitDraw(){
      if(!drawing)return;
      if(drawing.t==='f'){
        if(drawing.pts.length>1){
          shapes.push({t:'f',pts:drawing.pts,fill:'none',stroke:line,sw:sw});
          sel=shapes.length-1;
        }
      }else{
        var x=Math.min(drawing.x,drawing.x+drawing.w),y=Math.min(drawing.y,drawing.y+drawing.h);
        var w=Math.abs(drawing.w),hh=Math.abs(drawing.h);
        if(w>4&&hh>4){
          shapes.push({t:drawing.t,x:x,y:y,w:w,h:hh,fill:fill,stroke:line,sw:sw});
          sel=shapes.length-1;
        }
      }
      drawing=null;
      render();
    }
    function placeTextInput(p){
      var inp=h('input',{class:'cd-textin',spellcheck:'false'});
      inp.style.left=p[0]+'px';
      inp.style.top=Math.max(0,p[1]-16)+'px';
      canvas.append(inp);
      setTimeout(function(){inp.focus()},0);
      var done=false;
      function commit(){
        if(done)return;
        done=true;
        var v=inp.value.trim();
        inp.remove();
        if(v){
          shapes.push({t:'tx',x:p[0],y:p[1]+8,fs:26,fill:fill,text:v});
          sel=shapes.length-1;
          render();
        }
      }
      inp.addEventListener('keydown',function(e){
        e.stopPropagation();
        if(e.key==='Enter')commit();
        else if(e.key==='Escape'){done=true;inp.remove()}
      });
      inp.addEventListener('blur',commit);
    }
    var toolbox=h('div',{class:'cd-tools'});
    var toolBtns={};
    [['pick','Alat pilih',IC.pick()],
     ['r','Persegi panjang',IC.rectT()],
     ['e','Elips',IC.ellT()],
     ['f','Gambar bebas (sketsa)',IC.penT()],
     ['tx','Teks',IC.textT()]].forEach(function(t){
      var b=h('button',{class:'cdt',title:t[1],html:t[2],onclick:function(){setTool(t[0])}});
      toolBtns[t[0]]=b;
      toolbox.append(b);
    });
    function setTool(t){
      tool=t;
      var k;
      for(k in toolBtns)toolBtns[k].classList.toggle('on',k===t);
      svg.style.cursor=t==='pick'?'default':(t==='tx'?'text':'crosshair');
      render();
    }
    function makeColorCtrl(label,initVal,apply){
      var pop=h('div',{class:'colorpop'});
      var btn=h('button',{class:'cd-swatch',title:label});
      function paint(v){btn.style.background=(v==='none')?'#3a3f45':v}
      PAL.forEach(function(c){
        pop.append(h('i',{style:{background:c},onclick:function(){apply(c)}}));
      });
      var wrap=h('div',{style:{position:'relative'}},btn,pop);
      btn.addEventListener('click',function(e){e.stopPropagation();pop.classList.toggle('open')});
      paint(initVal);
      return {wrap:wrap,paint:paint};
    }
    var fillCtl=makeColorCtrl('Warna isi',fill,function(c){fill=c;fillCtl.paint(c);applySel();});
    var lineCtl=makeColorCtrl('Warna garis',line,function(c){line=c;lineCtl.paint(c);applySel();});
    function applySel(){
      if(sel>=0&&shapes[sel]){
        var s=shapes[sel];
        if(s.t!=='f')s.fill=fill;
        s.stroke=line;
        if(s.t!=='tx')s.sw=sw;
        render();
      }
    }
    function syncFrom(s){
      if(s.t!=='f'&&s.fill)fill=s.fill;
      if(s.stroke)line=s.stroke;
      if(s.sw)sw=s.sw;
      fillCtl.paint(fill);
      lineCtl.paint(line);
      widthSel.value=String(sw);
    }
    var widthSel=h('select',{class:'rb',title:'Ketebalan garis',onchange:function(){
      sw=+widthSel.value;
      applySel();
    }});
    [['0.5','0,5 mm'],['1','1 mm'],['2','2 mm'],['3.5','3,5 mm'],['5','5 mm']].forEach(function(o){
      widthSel.append(h('option',{value:o[0]},o[1]));
    });
    widthSel.value='2';
    function order(d){
      if(sel<0)return;
      var j=sel+d;
      if(j<0||j>=shapes.length)return;
      var t=shapes[j];shapes[j]=shapes[sel];shapes[sel]=t;sel=j;render();
    }
    var btnFront=h('button',{class:'cdtb',title:'Bawa ke depan',html:IC.front(),onclick:function(){order(1)}});
    var btnBack=h('button',{class:'cdtb',title:'Kirim ke belakang',html:IC.back(),onclick:function(){order(-1)}});
    var btnDup=h('button',{class:'cdtb',title:'Duplikat objek terpilih',html:IC.copy(),onclick:function(){
      if(sel<0)return;
      var c=JSON.parse(JSON.stringify(shapes[sel]));
      c.x=(c.x||0)+16;c.y=(c.y||0)+16;
      if(c.pts)c.pts=c.pts.map(function(p){return [p[0]+16,p[1]+16]});
      shapes.push(c);sel=shapes.length-1;render();
    }});
    var btnDel=h('button',{class:'cdtb',title:'Hapus objek terpilih',html:IC.trash(),onclick:function(){
      if(sel<0)return;
      shapes.splice(sel,1);sel=-1;render();
    }});
    var statL=h('span',{},'');
    var statM=h('span',{class:'cd-spm'},'');
    var statR=h('span',{},'');
    function updStat(){
      statL.textContent='Alat: '+toolNames[tool];
      statR.textContent=shapes.length+' objek'+(sel>=0?' • Terpilih: '+typeNames[shapes[sel].t]:'');
      statM.textContent='Dokumen warna: RGB • Halaman: A4 lanskap';
    }
    function onKey(e){
      if(!win.el.isConnected){document.removeEventListener('keydown',onKey);return}
      if(WM.active!==win)return;
      if(e.target&&e.target.closest&&e.target.closest('input,select,textarea,[contenteditable]'))return;
      if((e.key==='Delete'||e.key==='Backspace')&&sel>=0){shapes.splice(sel,1);sel=-1;render();e.preventDefault()}
      else if(e.key==='Escape'){sel=-1;render()}
    }
    document.addEventListener('keydown',onKey);
    var top=h('div',{class:'cd-top'},
      h('span',{class:'cd-lab'},'Isi'),fillCtl.wrap,
      h('span',{class:'cd-lab'},'Garis'),lineCtl.wrap,widthSel,
      h('span',{class:'cd-vsep'}),
      btnFront,btnBack,btnDup,btnDel,
      h('span',{class:'cd-hint'},'Pilih alat di kiri, lalu seret di halaman putih'));
    var main=h('div',{class:'cd-main'},toolbox,canvas);
    var stat=h('div',{class:'cd-stat'},statL,statM,statR);
    body.append(h('div',{class:'cd'},top,main,stat));
    setTool('pick');
  }});
}

/* ============ Daya ============ */
function veilShow(node){
  var v=$('#veil');
  v.innerHTML='';
  v.hidden=false;
  v.className='';
  v.append(node);
  requestAnimationFrame(function(){v.classList.add('show')});
}
function veilHide(){
  var v=$('#veil');
  v.classList.remove('show');
  setTimeout(function(){v.hidden=true;v.innerHTML=''},320);
}
function bootSeq(fn){
  closePanels();
  var c=h('div',{class:'veil-c'},
    h('span',{class:'vlogo',html:IC.win()}),
    h('div',{class:'dots'},h('i'),h('i'),h('i'),h('i'),h('i')),
    h('div',{class:'vmsg'},'Selamat datang'));
  veilShow(c);
  setTimeout(function(){veilHide();if(fn)fn()},2700);
}
function sleepPC(){
  closePanels();
  veilShow(h('div',{class:'veil-c'}));
  var v=$('#veil');
  v.classList.add('sleep');
  function wake(){
    v.classList.remove('sleep');
    veilHide();
    v.removeEventListener('pointerup',wake);
  }
  setTimeout(function(){v.addEventListener('pointerup',wake)},350);
}
function shutdownPC(){
  closeAllWins();closePanels();
  var btn=h('button',{class:'pwr-big',title:'Nyalakan',html:IC.power(),onclick:function(){bootSeq()}});
  var c=h('div',{class:'veil-c'},
    h('div',{class:'vmsg'},'Komputer telah dimatikan'),
    btn,
    h('div',{class:'vmsg',style:{fontSize:'12px',color:'#8a8a8a'}},'Tekan tombol daya untuk menyalakan kembali'));
  veilShow(c);
}
function restartPC(){
  closeAllWins();
  bootSeq();
}
