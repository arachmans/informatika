<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Windows 11 — Simulasi Instalasi Office & CorelDRAW</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --accent:#4cc2ff; --accent-t:rgba(76,194,255,.16); --accent-text:#08131a;
  --bg:#202020; --surface:#2b2b2b;
  --stroke:rgba(255,255,255,.09); --stroke-2:rgba(255,255,255,.17);
  --text:#f3f3f3; --text-2:#c9c9c9; --text-3:#9b9b9b;
  --ok:#6ccb5f; --err:#ff99a4; --tb-h:48px; color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:'Segoe UI Variable Text','Segoe UI','Noto Sans',sans-serif;font-size:14px;color:var(--text);background:#000;-webkit-font-smoothing:antialiased}
#os{position:fixed;inset:0;overflow:hidden;user-select:none}
input,textarea,select,[contenteditable]{user-select:text}
svg{display:block;width:100%;height:100%}
.i16{width:16px;height:16px;display:inline-flex;flex:none}
.i18{width:18px;height:18px;display:inline-flex;flex:none}
.i24{width:24px;height:24px;display:inline-flex;flex:none}
.i32{width:32px;height:32px;display:inline-flex;flex:none}
.i40{width:40px;height:40px;display:inline-flex;flex:none}
.i48{width:48px;height:48px;display:inline-flex;flex:none}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16);border-radius:5px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}

/* ====== Desktop ====== */
#wallpaper{position:absolute;inset:0;width:100%;height:100%}
#brightness{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;z-index:2000}
#desktop{position:absolute;inset:0 0 var(--tb-h) 0;z-index:1}
#dicons{position:absolute;inset:8px;display:flex;flex-direction:column;flex-wrap:wrap;align-content:flex-start;gap:2px}
.dicon{width:86px;height:94px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:6px 4px;border-radius:6px;border:1px solid transparent}
.dicon .i48{filter:drop-shadow(0 2px 3px rgba(0,0,0,.55))}
.dicon .lbl{font-size:12px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.85);text-align:center;line-height:1.25;max-width:82px;overflow-wrap:break-word}
.dicon:hover{background:rgba(255,255,255,.07)}
.dicon.sel{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.32)}
.dicon.pop{animation:pop .4s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
.ic-small .dicon .i48{width:32px;height:32px}
.ic-large .dicon{height:112px}.ic-large .dicon .i48{width:62px;height:62px}
#band{position:absolute;border:1px solid var(--accent);background:var(--accent-t);z-index:5;pointer-events:none}
#band[hidden]{display:none}

/* ====== Taskbar ====== */
#taskbar{position:absolute;left:0;right:0;bottom:0;height:var(--tb-h);display:flex;align-items:center;justify-content:center;background:rgba(25,27,31,.82);backdrop-filter:blur(28px) saturate(1.5);border-top:1px solid rgba(255,255,255,.06);z-index:800}
body.no-trans #taskbar{background:#1b1d21;backdrop-filter:none}
.tb-center{display:flex;align-items:center;gap:4px}
.tb-btn,.tb-app-btn{width:44px;height:40px;border:0;background:none;border-radius:6px;display:grid;place-items:center;color:#e9f3fc;position:relative}
.tb-btn svg,.tb-app-btn svg{width:22px;height:22px}
.tb-btn:hover,.tb-app-btn:hover{background:rgba(255,255,255,.09)}
.tb-app-btn .ind{position:absolute;bottom:2px;left:50%;transform:translateX(-50%);height:3px;width:0;border-radius:2px;background:var(--accent);transition:width .16s}
.tb-app-btn.running .ind{width:8px}
.tb-app-btn.active .ind{width:17px}
.tb-app-btn.active{background:rgba(255,255,255,.07)}
#tb-apps{display:flex;gap:4px;margin-left:6px;padding-left:8px;border-left:1px solid rgba(255,255,255,.08)}
.tb-right{position:absolute;right:4px;display:flex;align-items:center;gap:1px}
#btn-tray{display:flex;gap:7px;align-items:center;padding:7px 9px;border:0;border-radius:6px;background:none;color:#fff}
#btn-tray svg{width:16px;height:16px}
#btn-tray:hover{background:rgba(255,255,255,.09)}
#btn-clock{display:flex;flex-direction:column;align-items:flex-end;padding:4px 10px;border:0;border-radius:6px;background:none;color:#fff;font-size:12px;line-height:1.35;font-family:inherit}
#btn-clock:hover{background:rgba(255,255,255,.09)}

/* ====== Panels ====== */
.panel{position:absolute;background:rgba(34,36,41,.88);backdrop-filter:blur(34px) saturate(1.4);border:1px solid var(--stroke);border-radius:10px;box-shadow:0 18px 55px rgba(0,0,0,.55);z-index:850;opacity:0;transform:translateY(14px);pointer-events:none;transition:opacity .16s,transform .16s ease}
.panel.open{opacity:1;transform:none;pointer-events:auto}
body.no-trans .panel{background:#232529;backdrop-filter:none}
#panel-start{left:50%;transform:translate(-50%,14px);bottom:60px;width:620px;padding:26px 30px 0;max-height:calc(100vh - 90px);display:flex;flex-direction:column;overflow:auto}
#panel-start.open{transform:translate(-50%,0)}
.st-search{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.07);border:1px solid var(--stroke-2);border-bottom:2px solid var(--accent);border-radius:18px;padding:8px 16px;margin-bottom:20px}
.st-search input{flex:1;background:none;border:0;outline:0;color:var(--text);font:inherit;font-size:13px}
.st-h{font-size:13px;font-weight:600;margin:2px 0 10px}
.st-pin{display:grid;grid-template-columns:repeat(6,1fr);gap:2px;margin-bottom:18px}
.st-pi{border:0;background:none;border-radius:6px;padding:12px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--text);font:inherit;font-size:11.5px}
.st-pi svg{width:30px;height:30px}
.st-pi:hover{background:rgba(255,255,255,.08)}
.st-rec{display:grid;grid-template-columns:1fr 1fr;gap:2px;margin-bottom:16px}
.st-ri{display:flex;gap:12px;align-items:center;padding:8px 10px;border-radius:6px;border:0;background:none;text-align:left;color:var(--text);font:inherit}
.st-ri:hover{background:rgba(255,255,255,.08)}
.st-ri svg{width:26px;height:26px}
.st-ri .n{font-size:12.5px}.st-ri .s{font-size:11px;color:var(--text-3)}
.st-foot{margin:6px -30px 0;padding:14px 30px;border-top:1px solid var(--stroke);background:rgba(255,255,255,.025);display:flex;align-items:center}
.st-user{display:flex;align-items:center;gap:11px;font-size:13px;flex:1}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--accent-text);display:grid;place-items:center;font-weight:700;font-size:13px}
.pw-btn{width:38px;height:38px;border:0;border-radius:6px;background:none;color:var(--text-2);display:grid;place-items:center}
.pw-btn:hover{background:rgba(255,255,255,.1)}
.pw-btn svg{width:17px;height:17px}
.st-empty{font-size:12px;color:var(--text-3);padding:6px 2px 14px}
.st-results{overflow:auto;flex:1;min-height:80px;max-height:380px;margin-bottom:14px}
.st-res{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:6px;width:100%;border:0;background:none;color:var(--text);font:inherit;text-align:left}
.st-res:hover{background:rgba(255,255,255,.08)}
#panel-cal{right:10px;bottom:60px;width:330px;padding:20px}
.cal-time{font-size:42px;font-weight:600;letter-spacing:.5px}
.cal-date{color:var(--text-2);font-size:13px;margin:2px 0 16px}
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-nav b{font-size:13.5px;font-weight:600}
.cal-nav button{width:28px;height:28px;border:0;border-radius:5px;background:none;color:var(--text-2);display:grid;place-items:center}
.cal-nav button:hover{background:rgba(255,255,255,.1)}
.cal-nav svg{width:14px;height:14px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cal-grid .dh{font-size:11px;color:var(--text-3);padding:5px 0}
.cal-grid .dd{width:36px;height:36px;display:grid;place-items:center;border-radius:50%;font-size:13px;border:1px solid transparent}
.cal-grid .dd:hover{border-color:var(--stroke-2)}
.cal-grid .dd.today{background:var(--accent);color:var(--accent-text);font-weight:600}
.cal-grid .dd.sel{border-color:var(--accent)}
#panel-quick{right:10px;bottom:60px;width:364px;padding:20px}
.qs-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:20px}
.qs-t{height:52px;border-radius:6px;border:1px solid var(--stroke-2);background:rgba(255,255,255,.05);color:var(--text);display:flex;align-items:center;gap:11px;padding:0 15px;font:inherit;font-size:12.5px}
.qs-t svg{width:18px;height:18px}
.qs-t:hover{background:rgba(255,255,255,.09)}
.qs-t.on{background:var(--accent);color:var(--accent-text);border-color:transparent;font-weight:600}
.qs-row{display:flex;align-items:center;gap:13px;margin:15px 2px}
.qs-row .i18{color:var(--text-2)}
.qs-row input[type=range]{flex:1;accent-color:var(--accent)}
.qs-row b{width:40px;font-size:12px;text-align:right;font-weight:400;color:var(--text-2)}

/* ====== Menu ====== */
.menu{position:absolute;background:rgba(38,40,45,.94);backdrop-filter:blur(26px);border:1px solid var(--stroke);border-radius:8px;padding:5px;min-width:230px;box-shadow:0 14px 40px rgba(0,0,0,.5);animation:menuin .13s ease-out;z-index:900}
body.no-trans .menu{background:#27292d;backdrop-filter:none}
@keyframes menuin{from{opacity:0;transform:scale(.97)}}
.mi{display:flex;align-items:center;gap:11px;padding:8px 11px;border-radius:5px;font-size:13px;position:relative;cursor:default}
.mi:hover{background:rgba(255,255,255,.09)}
.mi .msub{margin-left:auto;color:var(--text-3)}
.submenu{position:absolute;left:calc(100% + 6px);top:-5px;display:none;background:rgba(38,40,45,.94);backdrop-filter:blur(26px);border:1px solid var(--stroke);border-radius:8px;padding:5px;min-width:180px;box-shadow:0 14px 40px rgba(0,0,0,.5)}
.mi:hover>.submenu{display:block}
.msep{height:1px;background:var(--stroke);margin:5px 8px}

/* ====== Toast ====== */
#toasts{position:absolute;right:14px;bottom:62px;z-index:950;display:flex;flex-direction:column;gap:10px;align-items:flex-end}
.toast{width:356px;background:rgba(40,42,47,.96);backdrop-filter:blur(22px);border:1px solid var(--stroke);border-radius:9px;padding:15px 17px;display:flex;gap:13px;box-shadow:0 12px 38px rgba(0,0,0,.55);animation:toastin .3s cubic-bezier(.2,.9,.25,1.1);cursor:default}
@keyframes toastin{from{transform:translateX(30px);opacity:0}}
.toast.out{transition:.25s;transform:translateX(30px);opacity:0}
.toast .tt{font-size:13.5px;font-weight:600;margin-bottom:2px}
.toast .tm{font-size:12.5px;color:var(--text-2);line-height:1.45}
.toast .i24{margin-top:2px}

/* ====== Windows ====== */
#winlayer{position:absolute;inset:0;z-index:100;pointer-events:none}
#winlayer .window{pointer-events:auto}
.window{position:absolute;background:var(--bg);border:1px solid var(--stroke);border-radius:9px;box-shadow:0 26px 68px rgba(0,0,0,.6),0 5px 16px rgba(0,0,0,.4);display:flex;flex-direction:column;min-width:340px;min-height:180px;overflow:hidden;animation:winopen .16s ease-out}
@keyframes winopen{from{opacity:0;transform:scale(.96)}}
.window.minimized{display:none}
.window.maxed{left:0!important;top:0!important;width:100%!important;height:calc(100% - var(--tb-h))!important;border-radius:0}
.wtitle{height:36px;display:flex;align-items:center;gap:9px;padding-left:13px;flex:none}
.wtitle .i16{opacity:.95}
.wtitle .t{font-size:12px;color:var(--text-2);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wctrl{display:flex;align-self:stretch}
.wctrl button{width:46px;border:0;background:none;color:var(--text-2);display:grid;place-items:center;padding:0}
.wctrl button:hover{background:rgba(255,255,255,.09);color:#fff}
.wctrl .close:hover{background:#c42b1c}
.wctrl svg{width:11px;height:11px}
.wbody{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}

/* ====== Controls ====== */
.btn{font:inherit;font-size:13px;padding:8px 20px;border-radius:5px;border:1px solid var(--stroke-2);background:rgba(255,255,255,.06);color:var(--text)}
.btn:hover{background:rgba(255,255,255,.11)}
.btn:active{transform:scale(.985);opacity:.85}
.btn.primary{background:var(--accent);border-color:transparent;color:var(--accent-text);font-weight:600}
.btn.primary:hover{filter:brightness(1.07)}
.btn:disabled{opacity:.35;pointer-events:none}
input[type=text],input:not([type]),select{background:rgba(255,255,255,.05);border:1px solid var(--stroke-2);border-radius:5px;padding:7px 11px;color:var(--text);font:inherit;font-size:13px;outline:0}
input:focus,select:focus{border-color:var(--accent)}
input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px}
input[type=range]{accent-color:var(--accent)}
input:disabled{opacity:.45}
.field{margin-bottom:16px}
.field>label{display:block;font-size:12px;color:var(--text-3);margin-bottom:7px}
.inrow{display:flex;gap:8px}
.inrow input{flex:1;min-width:0}
.link{color:var(--accent);text-decoration:none}
.link:hover{text-decoration:underline}
.iw-modal{position:absolute;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;z-index:30;animation:winopen .15s}
.iw-card{width:min(440px,90%);background:var(--surface);border:1px solid var(--stroke-2);border-radius:9px;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.iw-card h3{font-size:16px;margin-bottom:8px}
.iw-card p{font-size:13px;color:var(--text-2);line-height:1.55}
.iw-card .acts{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}
.colorpop{position:absolute;top:38px;left:0;background:var(--surface);border:1px solid var(--stroke-2);border-radius:7px;padding:9px;display:none;grid-template-columns:repeat(4,18px);gap:7px;z-index:40;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.colorpop.open{display:grid}
.colorpop i{width:18px;height:18px;border-radius:4px;border:1px solid rgba(255,255,255,.2);cursor:default}

/* ====== Dialog pilih folder ====== */
.bf-card{width:min(560px,94%);background:var(--surface);border:1px solid var(--stroke-2);border-radius:9px;box-shadow:0 20px 60px rgba(0,0,0,.6);overflow:hidden;display:flex;flex-direction:column;animation:winopen .15s}
.bf-head{display:flex;align-items:center;gap:10px;padding:13px 18px;border-bottom:1px solid var(--stroke)}
.bf-head .i18{color:#e9a83b}
.bf-tree{height:300px;overflow:auto;padding:8px;background:rgba(0,0,0,.18)}
.bf-row{display:flex;align-items:center;gap:7px;padding:5px 8px;border-radius:5px;font-size:13px;cursor:default;color:var(--text)}
.bf-row:hover{background:rgba(255,255,255,.06)}
.bf-row.sel{background:var(--accent-t);box-shadow:inset 0 0 0 1px var(--accent)}
.bf-tw{width:18px;height:18px;border:0;background:none;color:var(--text-3);display:grid;place-items:center;flex:none;border-radius:4px;padding:0}
.bf-tw:hover{background:rgba(255,255,255,.12);color:var(--text)}
.bf-tw svg{width:12px;height:12px}
.bf-row .i16{opacity:.9}
.bf-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bf-kids{margin-left:15px;border-left:1px solid var(--stroke);padding-left:2px}
.bf-rename{width:150px;height:22px;padding:1px 6px;font-size:12.5px;border-radius:4px;border:1px solid var(--accent);background:rgba(255,255,255,.06);color:var(--text);outline:0;font-family:inherit}
.bf-foot{display:flex;align-items:center;gap:12px;padding:11px 16px;border-top:1px solid var(--stroke);background:rgba(255,255,255,.028)}
.bf-cur{flex:1;font-size:12px;color:var(--text-2);font-family:'JetBrains Mono',Consolas,monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bf-free{font-size:11.5px;color:var(--text-3);flex:none}
.bf-acts{display:flex;justify-content:flex-end;gap:9px;padding:12px 16px;border-top:1px solid var(--stroke)}

/* ====== UAC ====== */
#uac{position:absolute;inset:0;z-index:2100;display:grid;place-items:center;background:rgba(0,0,0,0);transition:background .18s}
#uac.show{background:rgba(0,0,0,.55)}
.uac-wrap{transform:scale(.97);opacity:0;transition:.18s}
#uac.show .uac-wrap{transform:none;opacity:1}
.uac-cap{color:#cfd6dd;font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:9px;margin:0 2px 9px}
.uac-cap .i16{color:#9fb6c8}
.uac-box{width:470px;background:#2b2b2b;border:1px solid rgba(255,255,255,.2);border-radius:8px;box-shadow:0 34px 90px rgba(0,0,0,.7);overflow:hidden}
.uac-body{padding:20px 24px 22px}
.uac-body .q{font-size:14px;line-height:1.5;margin-bottom:18px}
.uac-prog{display:flex;gap:14px;align-items:center;margin-bottom:20px}
.uac-prog .i40{filter:drop-shadow(0 1px 2px rgba(0,0,0,.4))}
.uac-prog .pn{font-size:14.5px;font-weight:600}
.uac-prog .pp{font-size:12.5px;color:var(--text-2);margin-top:3px}
.uac-src{font-size:12px;color:var(--text-3);margin-bottom:22px}
.uac-acts{display:flex;justify-content:flex-end;gap:9px}

/* ====== Veil ====== */
#veil{position:absolute;inset:0;z-index:3000;background:#000;display:grid;place-items:center;opacity:0;transition:opacity .3s}
#veil.show{opacity:1}
#uac[hidden],#veil[hidden]{display:none!important}
.veil-c{display:flex;flex-direction:column;align-items:center;gap:34px;color:#e8e8e8}
.veil-c .vlogo{width:84px;height:84px}
.dots{position:relative;width:40px;height:40px}
.dots i{position:absolute;left:50%;top:0;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:#fff;transform-origin:2.5px 20px;animation:orbit 2s cubic-bezier(.45,.1,.55,.9) infinite}
.dots i:nth-child(2){animation-delay:-.13s}.dots i:nth-child(3){animation-delay:-.26s}
.dots i:nth-child(4){animation-delay:-.39s}.dots i:nth-child(5){animation-delay:-.52s}
@keyframes orbit{to{transform:rotate(360deg)}}
.vmsg{font-size:14px;color:#c9c9c9}
.pwr-big{width:76px;height:76px;border-radius:50%;border:2px solid rgba(255,255,255,.35);background:none;color:#fff;display:grid;place-items:center}
.pwr-big:hover{border-color:#fff;background:rgba(255,255,255,.08)}
.pwr-big svg{width:30px;height:30px}
#veil.sleep{cursor:pointer}

/* ====== Installer ====== */
.iz{flex:1;min-height:0;display:flex;flex-direction:column}
.iz-head{display:flex;gap:15px;align-items:center;padding:24px 28px 18px;border-bottom:1px solid var(--stroke)}
.iz-head .i40{filter:drop-shadow(0 2px 4px rgba(0,0,0,.4))}
.iz-head h2{font-size:19px;font-weight:600}
.iz-head .sub{font-size:12.5px;color:var(--text-2);margin-top:3px}
.iz-body{flex:1;overflow:auto;padding:20px 28px}
.iz-foot{display:flex;align-items:center;padding:15px 28px;border-top:1px solid var(--stroke);background:rgba(255,255,255,.028)}
.iz-foot .l{font-size:12px;color:var(--text-3);flex:1}
.iz-foot .r{display:flex;gap:9px}
/* -- stepper wizard -- */
.wz-steps{display:flex;gap:4px;padding:14px 26px 12px;border-bottom:1px solid var(--stroke);flex:none}
.wz-step{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;min-width:0}
.wz-step .dot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:11.5px;font-weight:600;background:rgba(255,255,255,.07);color:var(--text-3);flex:none}
.wz-step.done .dot{background:rgba(108,203,95,.16);color:var(--ok)}
.wz-step.cur .dot{background:var(--accent);color:var(--accent-text)}
.wz-step.done .dot svg{width:13px;height:13px}
.wz-step .sl{font-size:10.5px;color:var(--text-3);text-align:center;line-height:1.25}
.wz-step.cur .sl{color:var(--text);font-weight:600}
.wz-pane{animation:wzF .24s ease-out}
.wz-pane.back{animation:wzB .24s ease-out}
@keyframes wzF{from{opacity:0;transform:translateX(18px)}}
@keyframes wzB{from{opacity:0;transform:translateX(-18px)}}
.wz-hero{display:flex;flex-direction:column;align-items:center;text-align:center;padding:22px 20px 8px;gap:13px}
.wz-hero h2{font-size:20px;font-weight:600}
.wz-hero p{font-size:13px;color:var(--text-2);max-width:470px;line-height:1.65}
.wz-facts{display:flex;gap:30px;margin-top:10px}
.wz-facts .f{display:flex;flex-direction:column;gap:4px}
.wz-facts .fk{font-size:10.5px;color:var(--text-3);text-transform:uppercase;letter-spacing:.4px}
.wz-facts .fv{font-size:13px}
.wz-eula{height:230px;overflow:auto;border:1px solid var(--stroke);border-radius:7px;background:rgba(0,0,0,.28);padding:14px 16px;font-size:12.5px;color:var(--text-2);line-height:1.6}
.wz-agree{display:flex;gap:10px;align-items:center;font-size:13px;margin-top:12px}
.wz-hint{font-size:11.5px;color:var(--text-3);margin:7px 2px 0}
.wz-hint-err{font-size:11.5px;color:var(--err);margin:7px 2px 0;min-height:15px}
.wz-lead{font-size:13px;color:var(--text-2);margin-bottom:12px}
/* -- elemen wizard lain -- */
.rrow{display:flex;gap:12px;align-items:flex-start;padding:11px 14px;border:1px solid var(--stroke-2);border-radius:6px;margin-bottom:8px;cursor:default}
.rrow:hover{background:rgba(255,255,255,.04)}
.rrow.on{border-color:var(--accent);background:var(--accent-t)}
.rrow .rad{width:18px;height:18px;border-radius:50%;border:1.6px solid var(--text-3);margin-top:1px;flex:none;display:grid;place-items:center}
.rrow.on .rad{border-color:var(--accent)}
.rrow.on .rad::after{content:'';width:9px;height:9px;border-radius:50%;background:var(--accent)}
.rrow b{font-size:13.5px;display:block}
.rrow span{font-size:12px;color:var(--text-2)}
.app-pick{display:flex;align-items:center;gap:11px;padding:7px 10px;border-radius:6px}
.app-pick:hover{background:rgba(255,255,255,.04)}
.app-pick .i32{filter:drop-shadow(0 1px 2px rgba(0,0,0,.35))}
.app-pick b{font-size:13px;flex:1}
.sw{width:40px;height:21px;border-radius:11px;background:rgba(255,255,255,.25);position:relative;transition:.15s;border:0;flex:none;cursor:default}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:15px;height:15px;border-radius:50%;background:#fff;transition:.15s}
.sw.on{background:var(--accent)}
.sw.on::after{left:22px}
/* -- progres -- */
.pg-top{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:10px}
.pg-top h3{font-size:15px;font-weight:600}
.pg-pct{font-size:32px;font-weight:250;line-height:1;color:var(--text)}
.pg-meta{font-size:12px;color:var(--text-3);margin-bottom:12px}
.pg-meta b{color:var(--text-2);font-weight:400}
.pg-bar{height:6px;background:rgba(255,255,255,.13);border-radius:3px;overflow:hidden;margin-bottom:20px}
.pg-fill{height:100%;width:0;background:var(--accent);border-radius:3px}
.comps{display:grid;grid-template-columns:1fr 1fr;gap:1px 26px;margin-bottom:16px}
.comp{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--text-3);padding:5px 0}
.comp.run{color:var(--text)}
.comp.done{color:var(--text-2)}
.comp b{font-weight:400}
.cst{width:17px;height:17px;display:grid;place-items:center;flex:none}
.cst.w::before{content:'';width:5px;height:5px;border-radius:50%;background:var(--text-3)}
.cst.r{border:2px solid rgba(255,255,255,.2);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.cst.d{color:var(--ok)}
.cst.d svg{width:15px;height:15px}
.logwrap{border:1px solid var(--stroke);border-radius:7px;overflow:hidden}
.loghead{display:flex;align-items:center;gap:9px;padding:8px 13px;background:rgba(255,255,255,.04);font-size:12px;color:var(--text-2);cursor:default}
.loghead .lg{flex:1}
.logbox{height:148px;overflow:auto;background:rgba(0,0,0,.4);padding:9px 13px;font-family:'JetBrains Mono',Consolas,monospace;font-size:11.5px;line-height:1.75;color:#b7c4cd}
.logbox .ts{color:#63707c;margin-right:9px}
.logbox .okk{color:var(--ok)}
.logbox .errl{color:var(--err)}
.logwrap.collapsed .logbox{display:none}
.loghead .i16{transition:.2s}
.logwrap.collapsed .loghead .i16{transform:rotate(180deg)}
.done-c{display:flex;flex-direction:column;align-items:center;padding:34px 20px 20px;text-align:center;overflow:auto}
.done-c h2{font-size:21px;font-weight:600;margin:20px 0 8px}
.done-c p{font-size:13px;color:var(--text-2);max-width:420px;line-height:1.6}
.bigcheck{width:74px;height:74px}
.bigcheck circle{fill:none;stroke:var(--accent);stroke-width:3;stroke-dasharray:220;stroke-dashoffset:220;animation:dash .7s .1s ease-out forwards}
.bigcheck path{fill:none;stroke:var(--ok);stroke-width:5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60;stroke-dashoffset:60;animation:dash .45s .65s ease-out forwards}
@keyframes dash{to{stroke-dashoffset:0}}
.sumcard{width:100%;max-width:470px;margin-top:22px;background:rgba(255,255,255,.04);border:1px solid var(--stroke);border-radius:8px;padding:15px 19px;text-align:left}
.sumcard .row{display:flex;justify-content:space-between;font-size:12.5px;padding:3.5px 0}
.sumcard .row span{color:var(--text-3)}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:13px;justify-content:center}
.chip{display:flex;align-items:center;gap:7px;font-size:12px;background:rgba(255,255,255,.06);border:1px solid var(--stroke);padding:5px 12px 5px 8px;border-radius:20px}
.chip .i18{filter:drop-shadow(0 1px 1px rgba(0,0,0,.4))}

/* ====== Explorer ====== */
.ex{flex:1;min-height:0;display:flex;flex-direction:column}
.ex-tools{display:flex;align-items:center;gap:6px;padding:8px 12px;border-bottom:1px solid var(--stroke)}
.ex-tools .nav{width:32px;height:30px;border:0;border-radius:5px;background:none;color:var(--text-2);display:grid;place-items:center}
.ex-tools .nav:hover{background:rgba(255,255,255,.09)}
.ex-tools .nav svg{width:15px;height:15px}
.crumb{flex:1;display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.05);border:1px solid var(--stroke-2);border-radius:5px;padding:5px 12px;font-size:12.5px;color:var(--text-2);min-width:0}
.crumb svg{width:11px;height:11px;color:var(--text-3)}
.ex-search{width:170px}
.ex-main{flex:1;display:flex;min-height:0}
.ex-side{width:172px;flex:none;border-right:1px solid var(--stroke);padding:9px 6px;overflow:auto}
.ex-side .si{display:flex;align-items:center;gap:11px;width:100%;border:0;background:none;color:var(--text-2);font:inherit;font-size:12.5px;padding:7px 11px;border-radius:5px;text-align:left}
.ex-side .si svg{width:16px;height:16px}
.ex-side .si:hover{background:rgba(255,255,255,.06)}
.ex-side .si.on{background:rgba(255,255,255,.09);color:var(--text)}
.ex-grid{flex:1;overflow:auto;padding:16px;display:flex;flex-wrap:wrap;align-content:flex-start;gap:8px;position:relative}
.exi{width:96px;padding:11px 6px 9px;border-radius:6px;display:flex;flex-direction:column;align-items:center;gap:8px;border:1px solid transparent}
.exi:hover{background:rgba(255,255,255,.06)}
.exi.sel{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.28)}
.exi .i48,.exi .i40{filter:drop-shadow(0 1px 2px rgba(0,0,0,.35))}
.exi .lbl{font-size:11.5px;text-align:center;line-height:1.3;color:var(--text)}
.exi img{width:46px;height:38px;object-fit:cover;border-radius:3px}
.ex-status{padding:6px 14px;border-top:1px solid var(--stroke);font-size:11.5px;color:var(--text-3)}
.ex-empty{color:var(--text-3);font-size:13px}
.drive{width:100%;display:flex;align-items:center;gap:13px;padding:11px 13px;border-radius:6px}
.drive:hover{background:rgba(255,255,255,.05)}
.drive .dbar{flex:1;height:5px;background:rgba(255,255,255,.14);border-radius:3px;overflow:hidden}
.drive .dbar i{display:block;height:100%;background:var(--accent)}

/* ====== Terminal ====== */
.term{flex:1;background:#0c0c0c;font-family:'JetBrains Mono',Consolas,monospace;font-size:12.5px;line-height:1.6;padding:10px 14px;overflow:auto;user-select:text;cursor:text}
.term .p{color:#4cc2ff}
.tline{display:flex;gap:8px;align-items:baseline}
.tline input{flex:1;background:none;border:0;outline:0;color:#e8e8e8;font:inherit;padding:0}
.term .o{color:#ccc;white-space:pre-wrap;word-break:break-all}

/* ====== Settings ====== */
.se{flex:1;overflow:auto;padding:26px 34px}
.se h1{font-size:26px;font-weight:600;margin-bottom:4px}
.se .sub2{color:var(--text-2);font-size:13px;margin-bottom:26px}
.se h4{font-size:13.5px;font-weight:600;margin:22px 0 12px}
.swatches{display:flex;gap:11px}
.swat{width:34px;height:34px;border-radius:7px;border:2px solid transparent;padding:0}
.swat:hover{transform:scale(1.08)}
.swat.on{border-color:#fff}
.wallrow{display:flex;gap:13px;flex-wrap:wrap}
.wallth{border:2px solid transparent;border-radius:8px;padding:0;overflow:hidden;background:none;line-height:0}
.wallth.on{border-color:var(--accent)}
.wallth canvas{width:150px;height:94px;display:block}
.togrow{display:flex;align-items:center;gap:13px;font-size:13px;padding:10px 0}

/* ====== Notepad ====== */
.np{flex:1;min-height:0;display:flex;flex-direction:column}
.np-menu{display:flex;gap:4px;padding:6px 10px;border-bottom:1px solid var(--stroke)}
.np-menu button{font:inherit;font-size:12.5px;border:0;background:none;color:var(--text-2);padding:5px 12px;border-radius:5px}
.np-menu button:hover{background:rgba(255,255,255,.08)}
.np-body{flex:1;overflow:auto;background:#1e1e1e}
.np-body>div{min-height:100%;padding:14px 18px;font-family:Consolas,'JetBrains Mono',monospace;font-size:13.5px;line-height:1.55;white-space:pre-wrap;outline:0;color:#e6e6e6}
.np-stat{padding:5px 12px;border-top:1px solid var(--stroke);font-size:11.5px;color:var(--text-3)}

/* ====== Word ====== */
.wd{flex:1;min-height:0;display:flex;flex-direction:column}
.wd-qa{display:flex;align-items:center;gap:9px;padding:6px 13px;border-bottom:1px solid var(--stroke);font-size:12px;color:var(--text-3)}
.wd-qa .sv{border:0;background:none;color:var(--text-2);width:30px;height:28px;border-radius:5px;display:grid;place-items:center}
.wd-qa .sv:hover{background:rgba(255,255,255,.09)}
.wd-qa .sv svg{width:14px;height:14px}
.wd-tab{padding:5px 13px 0}
.wd-tab .tab{font-size:12.5px;color:var(--text-2);display:inline-block;padding:7px 15px;border-radius:6px 6px 0 0;background:rgba(255,255,255,.06)}
.wd-rib{display:flex;gap:20px;align-items:center;padding:8px 13px;border-bottom:1px solid var(--stroke);background:rgba(255,255,255,.03);flex-wrap:wrap}
.rgroup{display:flex;align-items:center;gap:3px;padding-right:18px;border-right:1px solid var(--stroke)}
.rgroup:last-child{border-right:0}
.rb{min-width:30px;height:30px;border:0;border-radius:5px;background:none;color:var(--text);display:grid;place-items:center;padding:0 6px;font:inherit;font-size:13px}
.rb:hover{background:rgba(255,255,255,.1)}
.rb.act{background:var(--accent-t);color:var(--accent)}
.rb svg{width:16px;height:16px}
.rb.b{font-weight:800}.rb.i{font-style:italic;font-family:Georgia,serif}.rb.u{text-decoration:underline}.rb.s{text-decoration:line-through}
.rb .cbar{display:block;width:14px;height:3px;background:#d18f00;margin-top:1px}
select.rb{width:auto;height:30px;padding:0 8px;font-size:12.5px}
.wd-wrap{flex:1;overflow:auto;background:#2a2a2a;display:flex;justify-content:center;padding:26px 14px}
.wd-page{width:640px;min-height:830px;background:#fff;color:#1a1a1a;padding:76px 84px;outline:0;box-shadow:0 3px 18px rgba(0,0,0,.4);line-height:1.6;font-size:12px}
.wd-page:empty::before{content:'Mulai mengetik di dokumen…';color:#9b9b9b}
.wd-page h1{color:#1f3b73}.wd-page h2{color:#1f3b73}
.wd-stat{display:flex;gap:18px;padding:6px 16px;border-top:1px solid var(--stroke);font-size:11.5px;color:var(--text-3)}
.wd-stat .sp{flex:1}

/* ====== Excel ====== */
.xl{flex:1;min-height:0;display:flex;flex-direction:column}
.xl-rib{display:flex;align-items:center;gap:10px;padding:7px 12px;border-bottom:1px solid var(--stroke);background:rgba(255,255,255,.03)}
.xl-fx{display:flex;align-items:center;gap:9px;padding:5px 8px;border-bottom:1px solid var(--stroke)}
.xl-name{width:74px;text-align:center;font-size:12px;background:rgba(255,255,255,.05);border:1px solid var(--stroke-2);border-radius:4px;padding:4px 6px;color:var(--text-2)}
.xl-fx .fx{font-size:12px;font-style:italic;color:var(--text-3);font-family:Georgia,serif}
.xl-fx input{flex:1;font-family:'JetBrains Mono',Consolas,monospace;font-size:12.5px}
.xl-grid{flex:1;overflow:auto;outline:0}
.xl-row{display:flex;width:max-content}
.xl-h,.xl-rh{flex:none;background:rgba(255,255,255,.055);border-right:1px solid var(--stroke);border-bottom:1px solid var(--stroke);font-size:11px;color:var(--text-3);display:flex;align-items:center;justify-content:center}
.xl-h{width:92px;height:22px}
.xl-rh{width:42px}
.xl-rh.hl,.xl-h.hl{background:var(--accent-t);color:var(--accent)}
.xl-c{flex:none;width:92px;height:26px;border-right:1px solid rgba(255,255,255,.055);border-bottom:1px solid rgba(255,255,255,.055);padding:0 6px;font-size:12.5px;display:flex;align-items:center;overflow:hidden;white-space:nowrap}
.xl-c.num{justify-content:flex-end}
.xl-c.cur{box-shadow:inset 0 0 0 1.5px var(--accent);background:rgba(255,255,255,.02)}
.xl-c.edit{background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1.5px #fff}
.xl-c.errc{color:var(--err)}
.xl-stat{display:flex;gap:16px;padding:6px 14px;border-top:1px solid var(--stroke);font-size:11.5px;color:var(--text-3)}
.xl-sheets{display:flex;gap:4px;flex:1}
.xl-sheets span{font-size:11.5px;padding:3px 12px;background:rgba(255,255,255,.05);border:1px solid var(--stroke);border-radius:3px 3px 0 0;border-bottom:0;margin-bottom:-6px}

/* ====== PowerPoint ====== */
.pp{flex:1;min-height:0;display:flex;flex-direction:column}
.pp-rib{display:flex;align-items:center;gap:6px;padding:7px 13px;border-bottom:1px solid var(--stroke);background:rgba(255,255,255,.03)}
.pp-main{flex:1;display:flex;min-height:0}
.pp-side{width:150px;flex:none;border-right:1px solid var(--stroke);overflow:auto;padding:12px;display:flex;flex-direction:column;gap:10px;align-items:center}
.pp-th{width:102px;height:58px;border:2px solid transparent;border-radius:4px;overflow:hidden;background:none;padding:0;line-height:0}
.pp-th.on{border-color:var(--accent)}
.pp-th .in{width:256px;height:144px;transform:scale(.375);transform-origin:0 0;background:#fff;color:#222;font-size:30px;line-height:1.25;padding:26px 28px;text-align:left;overflow:hidden}
.pp-th .in h1{font-size:56px;color:#b7472a;margin:0 0 14px}
.pp-th .in h2{font-size:44px;color:#b7472a;margin:0 0 10px}
.pp-th .in p{margin:0 0 10px}
.pp-th .in li{margin:6px 0 6px 36px}
.pp-add{width:102px;height:58px;border:1px dashed var(--stroke-2);border-radius:4px;background:none;color:var(--text-3);display:grid;place-items:center}
.pp-add:hover{background:rgba(255,255,255,.05)}
.pp-add svg{width:15px;height:15px}
.pp-stage{flex:1;display:grid;place-items:center;padding:22px;background:#1c1c1c;overflow:auto}
.pp-slide{width:min(100%,760px);aspect-ratio:16/9;background:#fff;color:#222;outline:0;padding:40px 48px;box-shadow:0 4px 24px rgba(0,0,0,.5);overflow:auto}
.pp-slide h1{font-size:26px;color:#b7472a;margin:0 0 12px}
.pp-slide h2{font-size:20px;color:#b7472a;margin:0 0 10px}
.pp-slide p{margin:0 0 12px}
.pp-slide li{margin:5px 0 5px 18px}
.pp-slide:empty::before{content:'Klik untuk menambahkan teks';color:#aaa}
.pp-notes{border-top:1px solid var(--stroke);padding:9px 16px;font-size:12px;color:var(--text-3)}
.pp-notes [contenteditable]{color:var(--text-2);outline:0}
.pp-notes [contenteditable]:empty::before{content:'Klik untuk menambahkan catatan';}

/* ====== Outlook ====== */
.ol{flex:1;min-height:0;display:flex;flex-direction:column}
.ol-rib{display:flex;gap:8px;padding:9px 14px;border-bottom:1px solid var(--stroke);background:rgba(255,255,255,.03)}
.ol-main{flex:1;display:flex;min-height:0}
.ol-side{width:170px;flex:none;border-right:1px solid var(--stroke);padding:11px 7px}
.ol-fi{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;color:var(--text-2);font:inherit;font-size:13px;padding:8px 12px;border-radius:5px;text-align:left}
.ol-fi svg{width:15px;height:15px}
.ol-fi:hover{background:rgba(255,255,255,.06)}
.ol-fi.on{background:rgba(255,255,255,.09);color:var(--text)}
.ol-fi b{margin-left:auto;font-weight:400;font-size:11.5px;color:var(--text-3)}
.ol-list{width:300px;flex:none;border-right:1px solid var(--stroke);overflow:auto}
.ol-mail{padding:12px 16px;border-bottom:1px solid var(--stroke);border-left:3px solid transparent;cursor:default}
.ol-mail:hover{background:rgba(255,255,255,.04)}
.ol-mail.sel{background:rgba(255,255,255,.06);border-left-color:var(--accent)}
.ol-mail .r1{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:3px}
.ol-mail .frm{font-weight:600}
.ol-mail .tm{color:var(--text-3);font-size:11.5px}
.ol-mail .sj{font-size:12.5px;margin-bottom:3px}
.ol-mail .pv{font-size:11.5px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ol-mail.unread .sj{font-weight:700}
.ol-read{flex:1;overflow:auto;padding:26px 32px}
.ol-read h2{font-size:18px;margin-bottom:14px;font-weight:600}
.ol-read .meta{font-size:12.5px;color:var(--text-2);padding-bottom:14px;border-bottom:1px solid var(--stroke);margin-bottom:18px;line-height:1.7}
.ol-read .bd{font-size:13.5px;line-height:1.75;color:var(--text)}
.ol-comp{display:flex;flex-direction:column;gap:10px;min-height:100%;padding:18px 22px}
.ol-comp .frow2{display:flex;gap:11px;align-items:center}
.ol-comp .frow2 label{width:64px;font-size:12px;color:var(--text-3);flex:none}
.ol-comp input{flex:1}
.ol-comp [contenteditable]{flex:1;min-height:120px;background:rgba(255,255,255,.03);border:1px solid var(--stroke-2);border-radius:6px;padding:13px 15px;font-size:13.5px;line-height:1.6;outline:0}
.ol-comp .acts2{display:flex;gap:9px;justify-content:flex-end}

/* ====== OneNote / Photos ====== */
.onenote{flex:1;overflow:auto;padding:30px 40px;background:#252528}
.onenote .nt-side{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--text-3);margin-bottom:20px}
.onenote h2{font-size:24px;outline:0;margin-bottom:4px;font-weight:600;min-height:32px}
.onenote .dt{font-size:11.5px;color:var(--text-3);margin-bottom:18px}
.onenote .bd{min-height:300px;outline:0;font-size:13.5px;line-height:1.8;color:var(--text)}
.onenote .bd:empty::before{content:'Mulai menulis catatan…';color:var(--text-3)}
.ph{flex:1;min-height:0;display:flex;flex-direction:column}
.ph-img{flex:1;display:grid;place-items:center;background:#191919;overflow:hidden;padding:20px}
.ph-img img{max-width:100%;max-height:100%;box-shadow:0 4px 24px rgba(0,0,0,.5);background:#333}
.ph-cap{padding:10px 18px;border-top:1px solid var(--stroke);font-size:12.5px;color:var(--text-2);display:flex;justify-content:space-between}

/* ====== CorelDRAW ====== */
.cd{flex:1;min-height:0;display:flex;flex-direction:column}
.cd-top{display:flex;align-items:center;gap:9px;padding:7px 12px;border-bottom:1px solid var(--stroke);background:rgba(255,255,255,.03);flex-wrap:wrap}
.cd-lab{font-size:11.5px;color:var(--text-3)}
.cd-vsep{width:1px;height:22px;background:var(--stroke);margin:0 4px}
.cd-hint{font-size:11.5px;color:var(--text-3);margin-left:auto}

function h(tag,props){
  var e=document.createElement(tag);
  props=props||{};
  for(var k in props){
    var v=props[k];
    if(k==='class')e.className=v;
    else if(k==='html')e.innerHTML=v;
    else if(k==='style')Object.assign(e.style,v);
    else if(k.slice(0,2)==='on')e.addEventListener(k.slice(2),v);
    else if(v!==false&&v!==null&&v!==undefined)e.setAttribute(k,v);
  }
  for(var i=2;i<arguments.length;i++){
    var c=arguments[i];
    if(c===null||c===undefined||c===false)continue;
    if(Array.isArray(c)){
      for(var j=0;j<c.length;j++){
        var x=c[j];
        if(x===null||x===undefined||x===false)continue;
        e.append(x.nodeType?x:document.createTextNode(x));
      }
    }else e.append(c.nodeType?c:document.createTextNode(c));
  }
  return e;
}

function drawPetal(ctx,pts,wid,col){
  var SEG=pts.length-1,L=[],R=[],s,p0,p1,nx,ny,m,w;
  for(s=0;s<=SEG;s++){
    p0=pts[Math.max(0,s-1)];p1=pts[Math.min(SEG,s+1)];
    nx=-(p1[1]-p0[1]);ny=p1[0]-p0[0];
    m=Math.hypot(nx,ny)||1;nx/=m;ny/=m;
    w=(wid*(1-(s/SEG)*.82)+1.6)/2;
    L.push([pts[s][0]+nx*w,pts[s][1]+ny*w]);
    R.push([pts[s][0]-nx*w,pts[s][1]-ny*w]);
  }
  ctx.beginPath();
  ctx.moveTo(L[0][0],L[0][1]);
  for(s=1;s<=SEG;s++)ctx.lineTo(L[s][0],L[s][1]);
  for(s=SEG;s>=0;s--)ctx.lineTo(R[s][0],R[s][1]);
  ctx.closePath();
  ctx.fillStyle=hexA(col,.5);
  ctx.shadowColor=col;ctx.shadowBlur=38;
  ctx.fill();ctx.fill();
}
function drawWall(cv,variant){
  var dpr=Math.min(window.devicePixelRatio||1,2);
  var W=cv.clientWidth||150,H=cv.clientHeight||94;
  cv.width=W*dpr;cv.height=H*dpr;
  var ctx=cv.getContext('2d');
  ctx.scale(dpr,dpr);
  var p=WALLS[variant];
  var g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,p.bg[0]);g.addColorStop(1,p.bg[1]);
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  var cx=W*.5,cy=H*.47,R=Math.min(W,H)*.36,rnd=mulberry32(7+variant*13);
  ctx.save();ctx.globalCompositeOperation='lighter';
  var i,ang,len,wid,swirl,pts,s,t,a,r;
  for(i=0;i<7;i++){
    ang=(i/7)*Math.PI*2-Math.PI/2+(rnd()-.5)*.55;
    len=R*(.78+.3*rnd());wid=R*(.10+.09*rnd());swirl=1.9+rnd()*.9;
    pts=[];
    for(s=0;s<=64;s++){
      t=s/64;a=ang+swirl*t;r=len*(1-t)+len*.05;
      pts.push([cx+Math.cos(a)*r,cy+Math.sin(a)*r]);
    }
    drawPetal(ctx,pts,wid,p.petals[i%p.petals.length]);
  }
  var cg=ctx.createRadialGradient(cx,cy,0,cx,cy,R*.55);
  cg.addColorStop(0,hexA(p.glow,.5));cg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=cg;ctx.beginPath();ctx.arc(cx,cy,R*.55,0,7);ctx.fill();
  ctx.restore();
  var vg=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.35,W/2,H/2,Math.max(W,H)*.78);
  vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.55)');
  ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
}

var AC=null,master=null;
function ensureAudio(){
  if(AC)return;
  try{
    AC=new(window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain();
    master.gain.value=S.vol/100*.4;
    master.connect(AC.destination);
  }catch(e){}
}
document.addEventListener('pointerdown',function(){
  ensureAudio();
  if(AC&&AC.state==='suspended')AC.resume();
},true);
function tone(f,delay,dur,type,v){
  if(!AC)return;
  var t=AC.currentTime+delay;
  var o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'sine';o.frequency.value=f;
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(v||.5,t+.015);
  g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g);g.connect(master);
  o.start(t);o.stop(t+dur+.05);
}
function chNotify(){tone(830,0,.5);tone(1175,.13,.6)}
function chErr(){tone(311,0,.4,'triangle')}

/* ============ Window manager ============ */
var WM={z:120,wins:[],active:null};
var TB={map:{}};
function tbGet(app){
  var t=TB.map[app.id];
  if(t)return t;
  var btn=h('button',{class:'tb-app-btn',title:app.name},
    h('span',{class:'i24',html:app.icon}),
    h('span',{class:'ind'}));
  t={btn:btn,wins:[],pinned:!!app.pinned,app:app};
  btn.addEventListener('click',function(){
    if(!t.wins.length){if(app.launch)app.launch();return}
    var w=t.wins[t.wins.length-1];
    if(w.min)w.restore();
    else if(WM.active===w)w.minimize();
    else w.focus();
  });
  $('#tb-apps').append(btn);
  TB.map[app.id]=t;
  return t;
}
function tbSync(){
  var ids=Object.keys(TB.map);
  for(var i=0;i<ids.length;i++){
    var t=TB.map[ids[i]];
    t.btn.classList.toggle('running',t.wins.length>0);
    t.btn.classList.toggle('active',t.wins.indexOf(WM.active)>=0);
    if(!t.wins.length&&!t.pinned){t.btn.remove();delete TB.map[ids[i]]}
  }
}
function createWindow(o){
  var el=h('div',{class:'window'});
  var vw=window.innerWidth,vh=window.innerHeight-48,n=WM.wins.length%6;
  var w=o.w||720,hh=o.h||480;
  el.style.width=w+'px';el.style.height=hh+'px';
  el.style.left=clamp(o.x!==undefined?o.x:(vw-w)/2+n*30-60,0,Math.max(0,vw-160))+'px';
  el.style.top=clamp(o.y!==undefined?o.y:Math.max(6,(vh-hh)/2+n*26-40),0,Math.max(0,vh-80))+'px';
  var win={el:el,app:o.app,min:false,maxed:false,pre:null,onBeforeClose:null};
  var bMin=h('button',{title:'Minimalkan',html:IC.min()});
  var bMax=h('button',{title:'Maksimalkan',html:IC.max()});
  var bX=h('button',{class:'close',title:'Tutup',html:IC.close()});
  var titleEl=h('span',{class:'t'},o.title);
  var tb=h('div',{class:'wtitle'},
    h('span',{class:'i16',html:o.icon||''}),
    titleEl,
    h('div',{class:'wctrl'},bMin,bMax,bX));
  var body=h('div',{class:'wbody'});
  el.append(tb,body);
  $('#winlayer').append(el);
  win.body=body;win.titleEl=titleEl;
  win.focus=function(){WM.z++;el.style.zIndex=WM.z;WM.active=win;tbSync()};
  win.minimize=function(){win.min=true;el.classList.add('minimized');if(WM.active===win)WM.active=null;tbSync()};
  win.restore=function(){win.min=false;el.classList.remove('minimized');win.focus()};
  win.toggleMax=function(){
    if(win.maxed){
      el.classList.remove('maxed');
      Object.assign(el.style,win.pre);
      win.maxed=false;bMax.innerHTML=IC.max();bMax.title='Maksimalkan';
    }else{
      win.pre={left:el.style.left,top:el.style.top,width:el.style.width,height:el.style.height};
      el.classList.add('maxed');
      win.maxed=true;bMax.innerHTML=IC.restore();bMax.title='Pulihkan';
    }
  };
  win.close=function(force){
    if(!force&&win.onBeforeClose&&win.onBeforeClose()===false)return;
    if(o.onClose)o.onClose();
    el.remove();
    var ix=WM.wins.indexOf(win);
    if(ix>=0)WM.wins.splice(ix,1);
    var t=TB.map[o.app.id];
    if(t){var jx=t.wins.indexOf(win);if(jx>=0)t.wins.splice(jx,1)}
    if(WM.active===win)WM.active=null;
    tbSync();
  };
  bMin.addEventListener('click',function(e){e.stopPropagation();win.minimize()});
  bMax.addEventListener('click',function(e){e.stopPropagation();win.toggleMax()});
  bX.addEventListener('click',function(e){e.stopPropagation();win.close()});
  tb.addEventListener('dblclick',function(e){if(!e.target.closest('button'))win.toggleMax()});
  tb.addEventListener('pointerdown',function(e){
    if(e.target.closest('button')||win.maxed)return;
    win.focus();
    var sx=e.clientX-el.offsetLeft,sy=e.clientY-el.offsetTop;
    function mv(ev){
      el.style.left=clamp(ev.clientX-sx,-el.offsetWidth+130,window.innerWidth-90)+'px';
      el.style.top=clamp(ev.clientY-sy,0,window.innerHeight-96)+'px';
    }
    function up(){
      window.removeEventListener('pointermove',mv);
      window.removeEventListener('pointerup',up);
    }
    window.addEventListener('pointermove',mv);
    window.addEventListener('pointerup',up);
  });
  el.addEventListener('pointerdown',function(){win.focus()},true);
  WM.wins.push(win);
  var t=tbGet(o.app);
  t.wins.push(win);
  win.focus();
  if(o.build)o.build(body,win);
  return win;
}

function showUAC(spec){

    $('#uac-pn').textContent=spec.uacName;
    $('#uac-pp').textContent='Penerbit: '+spec.uacPub;
    $('#uac-ic').innerHTML=spec.icon;

      setTimeout(function(){ov.hidden=true},200);

/* ============ Dialog pilih folder (lokasi instalasi) ============ */
var DIR_TREE={
  'C:':{
    'Program Files':{'Microsoft':{},'Corel':{},'Common Files':{},'Windows Apps':{}},
    'Program Files (x86)':{'Microsoft':{},'Common Files':{}},
    'Users':{'Pengguna':{'Desktop':{},'Documents':{},'Downloads':{},'Pictures':{},'Music':{},'Videos':{}}},
    'Windows':{},
    'Games':{'SteamLibrary':{},'Epic Games':{}},
    'Temp':{}
  },
  'D:':{'Data':{'Proyek':{},'Arsip':{}},'Backup':{},'Tools':{}},
  'E:':{'Media':{},'Dump':{}}
};
var DRIVE_LABEL={'C:':'Local Disk (C:)','D:':'Data (D:)','E:':'Removable Disk (E:)'};
var DRIVE_FREE={'C:':118.4,'D:':856.2,'E:':23.1};
function treeLookup(path){
  var parts=path.split('\\'),node=DIR_TREE,i;
  for(i=0;i<parts.length;i++){
    if(!parts[i])continue;
    if(!node[parts[i]])return null;
    node=node[parts[i]];
  }
  return node;
}
function browseFolder(host,startPath,cb){
  var expanded={},sel=null,rowEls={},initPath='';
  startPath=startPath||'C:\\Program Files';
  /* pastikan rantai folder awal tersedia (dan induknya terbuka) */
  (function(){
    var parts=startPath.split('\\'),node=DIR_TREE,cur='';
    for(var i=0;i<parts.length;i++){
      if(!parts[i])continue;
      if(!node[parts[i]])node[parts[i]]={};
      cur=cur?cur+'\\'+parts[i]:parts[i];
      node=node[parts[i]];
      if(i<parts.length-1)expanded[cur]=true;
    }
    initPath=cur;
  })();
  var treeEl=h('div',{class:'bf-tree'});
  var curEl=h('span',{class:'bf-cur'},initPath);
  var freeEl=h('span',{class:'bf-free'},'');
  var btnNew=h('button',{class:'btn',disabled:'',style:{padding:'5px 12px',fontSize:'12px'}},'Folder baru');
  function buildLevel(box,node,parentPath){
    Object.keys(node).sort(function(a,b){return a.localeCompare(b)}).forEach(function(name){
      var path=parentPath?parentPath+'\\'+name:name;
      var kids=node[name]||{};
      var hasKids=Object.keys(kids).length>0;
      var isOpen=!!expanded[path];
      var tw=h('button',{class:'bf-tw',html:hasKids?(isOpen?IC.chevD():IC.chevR()):''});
      var row=h('div',{class:'bf-row'+(isOpen?' open':'')},
        tw,
        h('span',{class:'i16',html:IC.folder()}),
        h('span',{class:'bf-name'},DRIVE_LABEL[path]||name));
      rowEls[path]=row;
      box.append(row);
      if(hasKids){
        var kb=h('div',{class:'bf-kids'});
        rowEls[path+'\\#kids']=kb;
        box.append(kb);
        if(isOpen)buildLevel(kb,kids,path);
        else kb.hidden=true;
        tw.addEventListener('click',function(e){
          e.stopPropagation();
          expanded[path]=!expanded[path];
          if(expanded[path]){
            row.classList.add('open');
            if(!kb.hasChildNodes())buildLevel(kb,kids,path);
            kb.hidden=false;
            tw.innerHTML=IC.chevD();
          }else{
            row.classList.remove('open');
            kb.hidden=true;
            tw.innerHTML=IC.chevR();
          }
        });
      }
      row.addEventListener('click',function(){select(path)});
    });
  }
  function renderTree(){
    treeEl.innerHTML='';
    rowEls={};
    buildLevel(treeEl,DIR_TREE,'');
    if(sel&&rowEls[sel])rowEls[sel].classList.add('sel');
  }
  function select(path){
    if(sel&&rowEls[sel])rowEls[sel].classList.remove('sel');
    sel=path;
    if(rowEls[path])rowEls[path].classList.add('sel');
    curEl.textContent=path;
    var d=path.charAt(0).toUpperCase()+':';
    freeEl.textContent=DRIVE_FREE[d]!==undefined?String(DRIVE_FREE[d]).replace('.',',')+' GB bebas':'';
    btnNew.disabled=false;
  }
  function startRename(path){
    var row=rowEls[path];
    if(!row)return;
    var leaf=path.split('\\').pop();
    var parentPath=path.split('\\').slice(0,-1).join('\\');
    var nameEl=row.querySelector('.bf-name');
    var inp=h('input',{class:'bf-rename',value:leaf});
    nameEl.textContent='';
    nameEl.append(inp);
    inp.focus();
    inp.select();
    var done=false;
    function commit(){
      if(done)return;
      done=true;
      var v=inp.value.trim();
      if(!v||v===leaf||/[\\"|:*?<>]/.test(v)){
        nameEl.textContent=leaf;
        select(path);
        return;
      }
      var parent=treeLookup(parentPath);
      if(!parent){nameEl.textContent=leaf;return}
      delete parent[leaf];
      parent[v]={};
      var newPath=parentPath+'\\'+v;
      delete rowEls[path];
      rowEls[newPath]=row;
      var kb=rowEls[path+'\\#kids'];
      if(kb){delete rowEls[path+'\\#kids'];rowEls[newPath+'\\#kids']=kb}
      nameEl.textContent=v;
      if(expanded[path]){expanded[newPath]=true;delete expanded[path]}
      select(newPath);
    }
    inp.addEventListener('keydown',function(e){
      e.stopPropagation();
      if(e.key==='Enter')commit();
      else if(e.key==='Escape'){done=true;nameEl.textContent=leaf;select(path)}
    });
    inp.addEventListener('blur',commit);
  }
  btnNew.addEventListener('click',function(){
    if(!sel)return;
    var node=treeLookup(sel);
    if(!node)return;
    var base='Folder baru',name=base,n=2;
    while(node[name]){name=base+' ('+n+')';n++}
    node[name]={};
    var newPath=sel+'\\'+name;
    expanded[sel]=true;
    renderTree();
    select(newPath);
    startRename(newPath);
  });
  renderTree();
  select(initPath);
  var ov=h('div',{class:'iw-modal'});
  function close(){ov.remove();document.removeEventListener('keydown',onKey)}
  function onKey(e){if(e.key==='Escape')close()}
  document.addEventListener('keydown',onKey);
  var btnOK=h('button',{class:'btn primary',onclick:function(){
    var p=sel||initPath;
    if(/^[A-Za-z]:$/.test(p))p+='\\';
    close();
    cb(p);
  }},'OK');
  var btnCancel=h('button',{class:'btn',onclick:close},'Batal');
  var foot=h('div',{class:'bf-foot'},btnNew,curEl,freeEl);
  var acts=h('div',{class:'bf-acts'},btnCancel,btnOK);
  var card=h('div',{class:'bf-card'},
    h('div',{class:'bf-head'},
      h('span',{class:'i18',html:IC.folder()}),
      h('span',{style:{fontSize:'14px',fontWeight:'600'}},'Pilih lokasi instalasi')),
    treeEl,foot,acts);
  ov.append(card);
  host.append(ov);
}

function GUID(){
  var bytes=crypto.getRandomValues(new Uint8Array(8));
  var hex='';
  for(var i=0;i<bytes.length;i++)hex+=bytes[i].toString(16).padStart(2,'0');
  return '{'+hex.toUpperCase().match(/.{8}/g).join('-')+'}';
}

/* ============ Alur penginstal ============ */
function openInstaller(spec){
  createWindow({app:spec.tbApp,title:spec.winTitle,w:780,h:568,
    build:function(body,win){phaseSplash(spec,body,win)}});
}
function phaseSplash(spec,body,win){
  var bigIcon=h('span',{class:'i40',
    style:{width:'72px',height:'72px',filter:'drop-shadow(0 3px 8px rgba(0,0,0,.5))'},
    html:spec.icon});
  var msg=h('div',{style:{fontSize:'15px'}},spec.splash);
  var dots=h('div',{class:'dots'},h('i'),h('i'),h('i'),h('i'),h('i'));
  var box=h('div',{style:{flex:'1',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:'22px'}},
    bigIcon,msg,dots);
  body.append(box);
  setTimeout(function(){
    if(!win.el.isConnected)return;
    body.innerHTML='';
    if(spec.isInstalled())phaseMaintain(spec,body,win);
    else phaseWizard(spec,body,win);
  },1600);
}
/* ============ Wizard bertahap (langkah demi langkah) ============ */
function phaseWizard(spec,body,win){
  var picks=spec.pickList();
  var cfg={mode:'full',agree:false,lang:'id-ID',arch:'64',license:'key',
    serial:'CDR24-8KQ5-WT9MA-B2JH4',picks:{},shortcuts:true,runAfter:false,path:spec.path};
  picks.forEach(function(p){cfg.picks[p.k]=true});
  function serialOk(){
    if(!spec.hasSerial)return true;
    return cfg.license==='trial'||cfg.serial.trim().length>=10;
  }
  var steps=[],stepIdx=0,dir=1;
  function addStep(label,build,valid){
    steps.push({label:label,build:build,valid:valid||function(){return true}});
  }

  /* --- Langkah: Selamat datang --- */
  addStep('Selamat datang',function(pane){
    var icon=h('span',{class:'i40',
      style:{width:'84px',height:'84px',filter:'drop-shadow(0 4px 10px rgba(0,0,0,.45))'},
      html:spec.icon});
    var facts=h('div',{class:'wz-facts'},spec.facts.map(function(f){
      return h('div',{class:'f'},
        h('span',{class:'fk'},f[0]),
        h('span',{class:'fv'},f[1]));
    }));
    pane.append(h('div',{class:'wz-hero'},icon,
      h('h2',{},spec.welcomeTitle),
      h('p',{},spec.welcomeMsg),
      facts));
  });

  /* --- Langkah: Lisensi (EULA) --- */
  addStep('Lisensi',function(pane){
    var paras=spec.eulaParas.map(function(t,ix){
      return h('p',{style:ix?{marginTop:'10px'}:null},t);
    });
    var cb=h('input',{type:'checkbox',onchange:function(){cfg.agree=cb.checked;refreshNav()}});
    pane.append(h('div',{class:'field'},
      h('label',{},'Ketentuan lisensi — '+spec.welcomeTitle),
      h('div',{class:'wz-eula'},paras)));
    pane.append(h('label',{class:'wz-agree'},cb,
      h('span',{},'Saya telah membaca dan menyetujui ketentuan di atas')));
  },function(){return cfg.agree});

  /* --- Langkah: Jenis lisensi (khusus Corel) --- */
  if(spec.hasSerial){
    addStep('Jenis lisensi',function(pane){
      var serialIn=h('input',{spellcheck:'false'});
      serialIn.value=cfg.serial;
      serialIn.style.letterSpacing='1px';
      serialIn.style.fontFamily="'JetBrains Mono',monospace";
      serialIn.style.width='100%';
      var hint=h('div',{class:'wz-hint-err'});
      serialIn.addEventListener('input',function(){
        cfg.serial=serialIn.value;
        hint.textContent=serialOk()?'':'Nomor seri tampaknya belum lengkap (min. 10 karakter).';
        refreshNav();
      });
      var rKey=h('div',{class:'rrow on'},
        h('span',{class:'rad'}),
        h('div',{},h('b',{},'Saya memiliki nomor seri'),h('span',{},'Aktivasi permanen dengan nomor seri yang sah')));
      var rTrial=h('div',{class:'rrow'},
        h('span',{class:'rad'}),
        h('div',{},h('b',{},'Uji coba gratis 30 hari'),h('span',{},'Semua fitur, tanpa nomor seri')));
      function setLic(m){
        cfg.license=m;
        rKey.classList.toggle('on',m==='key');
        rTrial.classList.toggle('on',m==='trial');
        serialIn.disabled=m!=='key';
        serialIn.style.opacity=m==='key'?'1':'.45';
        hint.textContent='';
        refreshNav();
      }
      rKey.addEventListener('click',function(){setLic('key')});
      rTrial.addEventListener('click',function(){setLic('trial')});
      pane.append(h('div',{class:'field'},h('label',{},'Metode aktivasi'),
        rKey,
        h('div',{class:'inrow',style:{margin:'4px 0 8px'}},serialIn),
        rTrial,
        hint));
    },serialOk);
  }

  /* --- Langkah: Komponen --- */
  addStep('Komponen',function(pane){
    var appList=h('div',{style:{display:'none'}});
    picks.forEach(function(p){
      var k=p.k;
      var sw=h('button',{class:'sw on',title:'Pasang komponen ini'});
      sw.addEventListener('click',function(e){
        e.stopPropagation();
        var on=Object.keys(cfg.picks).filter(function(x){return cfg.picks[x]}).length;
        if(sw.classList.contains('on')&&on<=1)return;
        sw.classList.toggle('on');
        cfg.picks[k]=sw.classList.contains('on');
      });
      appList.append(h('div',{class:'app-pick'},
        h('span',{class:'i32',html:p.icon}),
        h('b',{},p.label),
        sw));
    });
    var rFull=h('div',{class:'rrow on'},
      h('span',{class:'rad'}),
      h('div',{},h('b',{},spec.fullLabel),h('span',{},spec.fullSub)));
    var rCust=h('div',{class:'rrow'},
      h('span',{class:'rad'}),
      h('div',{},h('b',{},'Kustom'),h('span',{},spec.customSub)));
    function setMode(m){
      cfg.mode=m;
      rFull.classList.toggle('on',m==='full');
      rCust.classList.toggle('on',m==='custom');
      appList.style.display=m==='custom'?'block':'none';
    }
    rFull.addEventListener('click',function(){setMode('full')});
    rCust.addEventListener('click',function(){setMode('custom')});
    pane.append(h('div',{class:'field'},
      h('label',{},'Jenis pemasangan'),rFull,rCust,appList));
  });

  /* --- Langkah: Opsi (isi per produk) --- */
  addStep('Opsi',function(pane){
    spec.buildOptions(pane,cfg);
  });

  /* --- Langkah: Lokasi (bebas dipilih di mana saja) --- */
  addStep('Lokasi',function(pane){
    var pathIn=h('input',{value:cfg.path||spec.path});
    var errEl=h('div',{class:'wz-hint-err'});
    var freeB=h('b',{},'—');
    function fmtN(n){return String(n).replace('.',',')}
    function driveOf(p){
      var m=String(p).match(/^([A-Za-z]):\\/);
      return m?m[1].toUpperCase()+':':null;
    }
    function validate(){
      var v=pathIn.value.trim();
      cfg.path=v;
      var err='';
      if(!v)err='Lokasi instalasi tidak boleh kosong.';
      else if(!/^[A-Za-z]:\\/.test(v))err='Gunakan format yang valid, contoh: C:\\Program Files\\Aplikasi';
      // else if(/[\\"|:*?<>]/.test(v.slice(3)))err='Lokasi mengandung karakter yang tidak diizinkan ( \\ : * ? " < > | ).';
      else if(/^C:\\Windows(\\|$)/i.test(v))err='Tidak dapat memasang di dalam folder sistem Windows.';
      cfg._pathOk=!err;
      errEl.textContent=err;
      var d=driveOf(v);
      freeB.textContent=(d&&DRIVE_FREE[d]!==undefined&&!err)?
        (fmtN(DRIVE_FREE[d])+' GB bebas di '+d):'—';
      refreshNav();
    }
    pathIn.addEventListener('input',validate);
    var btnBrowse=h('button',{class:'btn',onclick:function(){
      var host=pane.closest('.wbody')||document.body;
      browseFolder(host,pathIn.value,function(p){
        pathIn.value=p;
        validate();
      });
    }},'Telusuri…');
    pane.append(h('div',{class:'field'},h('label',{},'Folder tujuan'),
      h('div',{class:'inrow'},pathIn,btnBrowse),errEl));
    pane.append(h('p',{class:'wz-lead',style:{marginBottom:'10px'}},
      'Ketik lokasi secara langsung, atau telusuri dan buat folder baru di mana saja — termasuk di drive lain.'));
    pane.append(h('div',{class:'sumcard',style:{marginTop:'0'}},
      h('div',{class:'row'},h('span',{},'Dibutuhkan'),'± '+fmtN(spec.reqGB)+' GB'),
      h('div',{class:'row'},h('span',{},'Ruang disk'),freeB)));
    validate();
  },function(){return cfg._pathOk===true});

  /* --- Langkah: Ringkasan (tombol jadi Instal) --- */
  addStep('Ringkasan',function(pane){
    var picked=picks.filter(function(p){return cfg.mode==='full'||cfg.picks[p.k]});
    var chips=h('div',{class:'chips',style:{justifyContent:'flex-start',marginTop:'0',marginBottom:'16px'}},
      picked.map(function(p){
        return h('span',{class:'chip'},h('span',{class:'i18',html:p.icon}),p.label);
      }));
    var rows=[['Jenis',cfg.mode==='full'?spec.fullLabel:'Kustom']];
    rows.push(['Komponen',picked.length+' dari '+picks.length]);
    if(spec.hasSerial)rows.push(['Lisensi',cfg.license==='trial'?'Uji coba 30 hari':'Nomor seri']);
    if(spec.summaryExtras)rows=rows.concat(spec.summaryExtras(cfg));
    rows.push(['Lokasi',cfg.path||spec.path]);
    pane.append(h('p',{class:'wz-lead'},'Tinjau pilihan Anda sebelum memulai:'));
    pane.append(chips);
    pane.append(h('div',{class:'sumcard',style:{marginTop:'0'}},rows.map(function(r){
      return h('div',{class:'row'},h('span',{},r[0]),h('b',{},r[1]));
    })));
    pane.append(h('div',{class:'wz-hint',style:{marginTop:'14px'}},'Klik Instal untuk mulai menyalin berkas. Proses berjalan otomatis setelahnya.'));
  });

  /* --- Kerangka navigasi --- */
  var stepsBar=h('div',{class:'wz-steps'});
  var paneHost=h('div',{class:'iz-body'});
  var stepLab=h('span',{},'');
  var btnBack=h('button',{class:'btn',onclick:function(){go(-1)}},'Kembali');
  var btnNext=h('button',{class:'btn primary',onclick:function(){go(1)}},'Berikutnya');
  var btnCancel=h('button',{class:'btn',onclick:function(){win.close()}},'Batal');
  function refreshNav(){
    btnBack.disabled=stepIdx===0;
    var last=stepIdx===steps.length-1;
    btnNext.textContent=last?'Instal':'Berikutnya';
    btnNext.disabled=!steps[stepIdx].valid();
    stepLab.textContent='Langkah '+(stepIdx+1)+' dari '+steps.length;
  }
  function go(d){
    if(d>0){
      if(!steps[stepIdx].valid())return;
      if(stepIdx===steps.length-1){startInstall(spec,body,win,'install',cfg);return}
    }
    var ni=stepIdx+d;
    if(ni<0||ni>=steps.length)return;
    dir=d;
    stepIdx=ni;
    renderPane();
  }
  function renderBar(){
    stepsBar.innerHTML='';
    steps.forEach(function(s,i){
      var dotContent=i<stepIdx?h('span',{class:'i16',html:IC.check()}):document.createTextNode(String(i+1));
      stepsBar.append(h('div',{class:'wz-step'+(i<stepIdx?' done':i===stepIdx?' cur':'')},
        h('span',{class:'dot'},dotContent),
        h('span',{class:'sl'},s.label)));
    });
  }
  function renderPane(){
    paneHost.innerHTML='';
    var pane=h('div',{class:'wz-pane'+(dir<0?' back':'')});
    steps[stepIdx].build(pane);
    paneHost.append(pane);
    renderBar();
    refreshNav();
  }
  var head=h('div',{class:'iz-head'},
    h('span',{class:'i40',html:spec.icon}),
    h('div',{},
      h('h2',{},spec.winTitle),
      h('div',{class:'sub'},'Penginstal akan memandu Anda langkah demi langkah.')));
  var foot=h('div',{class:'iz-foot'},
    h('div',{class:'l'},stepLab),
    h('div',{class:'r'},btnCancel,btnBack,btnNext));
  body.append(h('div',{class:'iz'},head,stepsBar,paneHost,foot));
  renderPane();
}
function phaseMaintain(spec,body,win){
  var head=h('div',{class:'iz-head'},
    h('span',{class:'i40',html:spec.icon}),
    h('div',{},
      h('h2',{},spec.installedTitle),
      h('div',{class:'sub'},spec.maintainLine)));
  var sum=h('div',{class:'sumcard'},spec.maintRows().map(function(r){
    return h('div',{class:'row'},h('span',{},r[0]),h('b',{},r[1]));
  }));
  var btnUn=h('button',{class:'btn',onclick:function(){startInstall(spec,body,win,'uninstall',{})}},'Copot pemasangan');
  var btnRep=h('button',{class:'btn',onclick:function(){startInstall(spec,body,win,'repair',{})}},'Perbaiki');
  var btnTutup=h('button',{class:'btn primary',onclick:function(){win.close()}},'Tutup');
  var foot=h('div',{class:'iz-foot'},
    h('div',{class:'l'},'Pilih tindakan pemeliharaan'),
    h('div',{class:'r'},btnUn,btnRep,btnTutup));
  body.append(h('div',{class:'iz'},head,h('div',{class:'iz-body'},sum),foot));
}
function startInstall(spec,body,win,mode,cfg){
  cfg=cfg||{};
  if(!cfg.mode)cfg.mode='full';
  if(!cfg.picks){cfg.picks={};spec.pickList().forEach(function(p){cfg.picks[p.k]=true})}
  if(!cfg.license)cfg.license=S.corelLicense||'key';
  if(!cfg.lang)cfg.lang='id-ID';
  if(!cfg.arch)cfg.arch='64';
  if(!cfg.path)cfg.path=S[spec.key+'Path']||spec.path;
  if(cfg.path.length>3)cfg.path=cfg.path.replace(/\\+$/,'');
  body.innerHTML='';
  var comps=spec.comps(mode,cfg);
  var logs=spec.logs(mode,cfg);
  var titles=spec.progTitles;
  var pct=h('div',{class:'pg-pct'},'0%');
  var fillEl=h('div',{class:'pg-fill'});
  var eta=h('span',{},'menghitung…');
  var spd=h('b',{},'');
  var log=h('div',{class:'logbox'});
  comps.forEach(function(c){
    c.state='w';
    c.st=h('span',{class:'cst w'});
    c.el=h('div',{class:'comp'},c.st,h('b',{},c.name));
  });
  var compEls=comps.map(function(c){return c.el});
  var compsBox=h('div',{class:'comps'},compEls);
  var logwrap=h('div',{class:'logwrap'});
  var loghead=h('div',{class:'loghead',onclick:function(){logwrap.classList.toggle('collapsed')}},
    h('span',{class:'i16',html:IC.chevD()}),
    h('span',{class:'lg'},'Log penginstalan'));
  logwrap.append(loghead,log);
  function addLog(t,err){
    log.append(h('div',{class:err?'errl':'',
      html:'<span class="ts">'+new Date().toLocaleTimeString('id-ID')+'</span>'+(t||'')}));
    log.scrollTop=log.scrollHeight;
  }
  var btnCancel=h('button',{class:'btn'},mode==='uninstall'?'Batalkan':'Batal');
  var head=h('div',{class:'iz-head'},
    h('span',{class:'i40',html:spec.icon}),
    h('div',{},
      h('h2',{},titles[mode]),
      h('div',{class:'sub'},mode==='uninstall'?'Menghapus semua komponen perangkat lunak dari komputer ini.':'Ini mungkin memerlukan beberapa menit. Jangan matikan komputer Anda.')));
  var mid=h('div',{class:'iz-body'},
    h('div',{class:'pg-top'},h('h3',{},titles[mode]+'…'),pct),
    h('div',{class:'pg-meta'},'Perkiraan waktu tersisa: ',eta,h('span',{},' • '),spd),
    h('div',{class:'pg-bar'},fillEl),
    compsBox,logwrap);
  var foot=h('div',{class:'iz-foot'},
    h('div',{class:'l'},'Microsoft Corporation / Corel Corporation — Semua hak dilindungi'),
    h('div',{class:'r'},btnCancel));
  body.append(h('div',{class:'iz'},head,mid,foot));
  var ended=false,p=0,stall=0,li=0;
  var dur=mode==='install'?spec.dur:mode==='repair'?spec.repairDur:spec.uninstDur;
  var base=100/(dur/90);
  var iv=null;
  function confirmCancel(){
    if(body.querySelector('.iw-modal'))return;
    var btnGo=h('button',{class:'btn',onclick:function(ev){
      var x=ev.target.closest('.iw-modal');
      if(x)x.remove();
    }},'Lanjutkan');
    var btnStop=h('button',{class:'btn primary',onclick:function(ev){
      var x=ev.target.closest('.iw-modal');
      if(x)x.remove();
      rollback();
    }},'Ya, batalkan');
    var card=h('div',{class:'iw-card'},
      h('h3',{},'Hentikan '+({install:'penginstalan',repair:'perbaikan',uninstall:'penghapusan'})[mode]+'?'),
      h('p',{},'Jika Anda membatalkan sekarang, komputer akan dikembalikan ke kondisi semula.'),
      h('div',{class:'acts'},btnGo,btnStop));
    body.append(h('div',{class:'iw-modal'},card));
  }
  function rollback(){
    if(ended)return;
    ended=true;win.onBeforeClose=null;
    if(iv)clearInterval(iv);
    var iv2=setInterval(function(){
      p-=2.6;
      addLog(randomOf(['[undo] Membatalkan perubahan …','[fs] Menghapus berkas yang baru saja ditulis …','[reg] Memulihkan registri …']),true);
      pct.textContent=Math.max(0,Math.floor(p))+'%';
      fillEl.style.width=Math.max(0,p)+'%';
      comps.forEach(function(c){
        if(c.state!=='w'&&p<c.at-15){
          c.state='w';c.el.className='comp';c.st.className='cst w';c.st.innerHTML='';
        }
      });
      if(p<=0){
        clearInterval(iv2);
        win.close(true);
        chErr();
        toast({title:'Proses dibatalkan',msg:'Tidak ada perubahan yang diterapkan pada sistem.',icon:IC.info(),sound:false});
      }
    },45);
  }
  function tick(){
    if(ended)return;
    if(stall>0)stall--;
    else{
      var f=1+.55*Math.sin(p*.11)+(Math.random()-.5)*.5;
      if(Math.random()<.02)stall=3+Math.floor(Math.random()*5);
      p=Math.min(100,p+base*Math.max(.25,f));
    }
    while(li<logs.length&&logs[li][0]<=p){addLog(logs[li][1]);li++}
    if(Math.random()<.11)addLog(spec.randLine(mode,cfg.path));
    comps.forEach(function(c){
      var st=p>=c.at?'d':(p>=c.at-15?'r':'w');
      if(c.state!==st){
        c.state=st;
        c.el.className='comp'+(st==='r'?' run':st==='d'?' done':'');
        c.st.className='cst '+st;
        c.st.innerHTML=st==='d'?IC.check():'';
      }
    });
    pct.textContent=Math.floor(p)+'%';
    fillEl.style.width=p+'%';
    var rem=Math.max(0,(100-p)/100*dur/1000);
    eta.textContent=Math.floor(rem/60)+':'+String(Math.floor(rem%60)).padStart(2,'0');
    spd.textContent=(8+Math.sin(p*.3)*4+Math.random()*6).toFixed(1).replace('.',',')+' MB/dtk';
    if(p>=100){
      ended=true;win.onBeforeClose=null;
      clearInterval(iv);
      setTimeout(function(){if(win.el.isConnected)phaseDone(spec,body,win,mode,cfg)},650);
    }
  }
  btnCancel.addEventListener('click',function(){if(!ended)confirmCancel()});
  win.onBeforeClose=function(){if(!ended){confirmCancel();return false}return true};
  iv=setInterval(tick,90);
}
function phaseDone(spec,body,win,mode,cfg){
  if(mode==='install')spec.applyInstall(cfg);
  if(mode==='uninstall')spec.applyUninstall();
  var t=spec.toastDone(mode);
  if(t)toast(t);
  if(mode==='install'&&spec.key==='corel'&&cfg.runAfter){
    setTimeout(function(){launchApp('corel')},900);
  }
  body.innerHTML='';
  var check=h('svg',{class:'bigcheck',viewBox:'0 0 80 80'},
    '<circle cx="40" cy="40" r="34"/><path d="M25 41.5l10 10 20-22"/>');
  var title=spec.doneTitle(mode);
  var msg=spec.doneMsg(mode);
  var chipArr=spec.chips(mode);
  var chipBox=chipArr.length?h('div',{class:'chips'},chipArr):null;
  var rows=spec.doneRows(mode,cfg);
  var sum=h('div',{class:'sumcard'},rows.map(function(r){
    return h('div',{class:'row'},h('span',{},r[0]),h('b',{},r[1]));
  }));
  var inner=h('div',{class:'done-c'},check,
    h('h2',{},title),h('p',{},msg),chipBox,sum);
  var btnTutup=h('button',{class:'btn primary',onclick:function(){win.close()}},'Tutup');
  var foot=h('div',{class:'iz-foot'},h('div',{class:'l'},''),h('div',{class:'r'},btnTutup));
  body.append(h('div',{class:'iz'},inner,foot));
}

        i.img?h('img',{src:i.img,alt:i.name}):h('span',{class:'i48',html:i.icon||IC.doc()}),

      if(cur==='thispc'){
        var count=0;
        [['Local Disk (C:)',78],['Data (D:)',41]].forEach(function(d){
          count++;

          grid.append(h('div',{class:'drive',ondblclick:function(){
            toast({title:driveName,msg:'Isi drive tidak disertakan dalam simulasi ini.',icon:IC.disk(),sound:false});

        });
        [['desktop','Desktop'],['documents','Dokumen'],['pictures','Gambar'],['downloads','Unduhan']].forEach(function(f){
          count++;
          var fk=f[0];
          grid.append(exItem({name:f[1],icon:IC.folder(),open:function(){nav(fk)}}));
        });
        status.textContent=count+' item';
        return;

      var items=loc.items().filter(function(i){return !q||i.name.toLowerCase().indexOf(q)>=0});

      if(!items.length){
        grid.style.display='grid';
        grid.style.placeItems='center';
        grid.append(h('div',{class:'ex-empty'},'Folder ini kosong.'));
        return;

    [['desktop','Desktop'],['downloads','Unduhan'],['documents','Dokumen'],['pictures','Gambar'],['music','Musik'],['videos','Video'],['thispc','PC ini']]
      .forEach(function(s){

    body.append(h('div',{class:'ex'},tools,main,status));

  }});

function openTerminal(){
  createWindow({app:APPS.terminal,title:'Terminal',w:740,h:440,build:function(body,win){
    var out=h('div',{class:'o'});
    var inp=h('input',{spellcheck:'false',autocomplete:'off'});
    var promptSpan=h('span',{class:'p'},'PS C:\\Users\\Pengguna&gt;');
    var lineWrap=h('div',{class:'tline'},promptSpan,inp);
    var scr=h('div',{class:'term'},out,lineWrap);
    var hist=[],hi=0;
    var PROMPT='PS C:\\Users\\Pengguna&gt;';
    function line(t){
      out.append(h('div',{html:t}));
      scr.scrollTop=scr.scrollHeight;
    }
    body.append(scr);
    scr.addEventListener('pointerup',function(){
      var s=window.getSelection();
      if(!s||!s.toString())inp.focus();
    });
    setTimeout(function(){inp.focus()},80);
    line('Windows PowerShell — Simulasi\n');
    line('Ketik <span class="p">help</span> untuk daftar perintah.\n');
    var cmds={
      help:function(){line('Perintah tersedia: <span class="p">help ver echo dir date whoami cls setup corel exit</span>')},
      ver:function(){line('Microsoft Windows [Version 10.0.26100.2605] — Simulasi')},
      dir:function(){
        line('    Direktori: C:\\Users\\Pengguna\\Desktop\n');
        desktopItems.forEach(function(i){line('    '+i.name.replace(/</g,'&lt;'))});
        line('');
      },
      date:function(){line(new Date().toLocaleString('id-ID'))},
      whoami:function(){line('windows-sim\\pengguna')},
      cls:function(){out.innerHTML=''},
      exit:function(){win.close()},
      setup:function(){line('Menjalankan setup.exe …');setTimeout(function(){runSetup('office')},300)},
      corel:function(){line('Menjalankan CorelDRAW-Setup.exe …');setTimeout(function(){runSetup('corel')},300)}
    };
    inp.addEventListener('keydown',function(e){
      if(e.key==='ArrowUp'&&hist.length){hi=Math.max(0,hi-1);inp.value=hist[hi]||'';e.preventDefault();return}
      if(e.key==='ArrowDown'){hi=Math.min(hist.length,hi+1);inp.value=hist[hi]||'';e.preventDefault();return}
      if(e.key!=='Enter')return;
      var v=inp.value.trim();
      inp.value='';
      if(!v)return;
      hist.push(v);hi=hist.length;
      line('<span class="p">'+PROMPT+'</span> '+v.replace(/</g,'&lt;'));
      var sp=v.split(' ');
      var c=sp[0].toLowerCase();
      var rest=sp.slice(1).join(' ');
      if(cmds[c])cmds[c]();
      else if(c==='echo')line(rest.replace(/</g,'&lt;')||'');
      else line("istilah '"+c.replace(/</g,'&lt;')+"' tidak dikenali sebagai perintah internal.");
    });
  }});
}
