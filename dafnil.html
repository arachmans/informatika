  case 'pm-recalc':{recalcWork(modal.work[modal.group]);if(modal.sync)recalcWork(modal.work[modal.group==='mon'?'fri':'mon']);renderModal();break;}
  case 'pm-default':{modal.work[modal.group]=defaultPeriods(modal.group);
    if(modal.sync){const og=modal.group==='mon'?'fri':'mon';mirrorOrder(modal.work[modal.group],modal.work[og]);recalcWork(modal.work[og]);}
    renderModal();showToast('Kembalikan jam default '+({mon:'Senin–Kamis',fri:'Jumat'}[modal.group]),{icon:'refresh'});break;}
  case 'pm-save':{['mon','fri'].forEach(g=>{const w=modal.work[g];
      w.rows.forEach(r=>{if(toMin(r.end)<=toMin(r.start))r.end=fmtT(toMin(r.start)+(r.type==='jp'?w.jpDur:15));});
      D().periods[g]=clone(w);});
    closeModal();commit();showToast('Pengaturan jam pelajaran disimpan',{icon:'sliders',tone:'green'});break;}
  case 'cat-del':{if(modal.cats.length<=1)break;modal.cats=modal.cats.filter(x=>x.id!==d.id);renderModal();break;}
  case 'cat-balance':{const tot=totalWeight(modal.cats);
    if(tot<=0){const each=Math.floor(100/modal.cats.length);modal.cats.forEach((x,i)=>x.weight=i===0?100-each*(modal.cats.length-1):each);}
    else{let acc=0;modal.cats.forEach((x,i)=>{if(i===modal.cats.length-1)x.weight=100-acc;else{x.weight=Math.round(x.weight/tot*100);acc+=x.weight;}});}
    renderModal();break;}
  case 'cat-add':{const nc=modal.newCat;if(!nc.label.trim()){showToast('Isi nama kategori baru',{icon:'alert',tone:'red'});break;}
    modal.cats.push({id:uid(),label:nc.label.trim(),shortLabel:(nc.short.trim()||nc.label.trim().slice(0,3)).toUpperCase(),weight:Math.max(0,Math.min(100,Number(nc.weight)||0)),color:nc.color});
    modal.newCat={label:'',short:'',weight:10,color:'hijau'};renderModal();break;}
  case 'cat-save':{const newCats=clone(modal.cats);const applyAll=modal.applyAll;
    const remap=cc=>{cc.assessments.forEach(as=>{if(!newCats.find(x=>x.id===as.category)){
      const old=cc.categories.find(x=>x.id===as.category);
      const byLabel=old?newCats.find(x=>x.label===old.label):null;
      as.category=(byLabel||newCats[0]).id;}});};
    c.categories=newCats;remap(c);
    if(applyAll){D().classes.forEach(cc=>{if(cc.id===c.id)return;cc.categories=clone(newCats);remap(cc);});}
    if(!c.categories.find(x=>x.id===U().nilaiFilter))U().nilaiFilter='all';
    closeModal();commit();showToast('Kategori & bobot disimpan'+(applyAll?' untuk semua kelas':''),{icon:'sliders',tone:'green'});break;}
  case 'ass-scale':modal.scaleType=d.v;renderModal();break;
  case 'ass-save':{if(!modal.title.trim()){showToast('Isi nama kolom penilaian',{icon:'alert',tone:'red'});break;}
    if(modal.mode==='add'){c.assessments.push({id:uid(),title:modal.title.trim(),category:modal.category,scaleType:modal.scaleType});}
    else{const as=c.assessments.find(x=>x.id===modal.id);as.title=modal.title.trim();as.category=modal.category;
      if(as.scaleType!==modal.scaleType){as.scaleType=modal.scaleType;
        c.students.forEach(s=>{const r=scoreRec(s.id,as.id);if(r&&modal.scaleType==='number')r.letter=null;});}}
    closeModal();commit();showToast('Kolom penilaian disimpan',{icon:'chart',tone:'green'});break;}
  case 'ass-del':{const id=modal.id;const as=c.assessments.find(x=>x.id===id);closeModal();
    undoable('Kolom "'+as.title+'" dihapus',()=>{const cc=cur();cc.assessments=cc.assessments.filter(x=>x.id!==id);
      Object.keys(cc.scores).forEach(sid=>{delete cc.scores[sid][id]});});break;}
  case 'sess-save':{if(!modal.date){showToast('Pilih tanggal pertemuan',{icon:'alert',tone:'red'});break;}
    if(modal.mode==='add'){c.attendanceSessions.push({id:uid(),date:modal.date,topic:modal.topic.trim()});
      c.attendanceSessions.sort((a,b)=>a.date.localeCompare(b.date));}
    else{const s=c.attendanceSessions.find(x=>x.id===modal.id);s.date=modal.date;s.topic=modal.topic.trim();
      c.attendanceSessions.sort((a,b)=>a.date.localeCompare(b.date));}
    closeModal();commit();showToast('Pertemuan presensi disimpan',{icon:'calendar',tone:'green'});break;}
  case 'sess-del':{const id=modal.id;closeModal();
    undoable('Pertemuan dihapus',()=>{const cc=cur();cc.attendanceSessions=cc.attendanceSessions.filter(x=>x.id!==id);delete cc.attendance[id];});break;}
  case 'class-save':{if(!modal.name.trim()){showToast('Isi nama kelas',{icon:'alert',tone:'red'});break;}
    const kkm=Math.max(1,Math.min(100,Number(modal.kkm)||75));
    if(modal.mode==='add'){const id=uid();
      D().classes.push({id,name:modal.name.trim(),subject:modal.subject.trim()||'—',semester:modal.semester.trim()||'—',kkm,
        categories:defaultCats(),students:[],assessments:[],scores:{},attendanceSessions:[],attendance:{},behaviorLogs:[]});
      U().activeClassId=id;U().tab='siswa';animNext=true;}
    else{c.name=modal.name.trim();c.subject=modal.subject.trim()||'—';c.semester=modal.semester.trim()||'—';c.kkm=kkm;}
    closeModal();commit();showToast('Kelas disimpan',{icon:'book',tone:'green'});break;}
  case 'class-del':{if(D().classes.length<=1){showToast('Tidak bisa menghapus satu-satunya kelas',{icon:'alert',tone:'red'});break;}
    const id=c.id;const nm=c.name;closeModal();
    undoable('Kelas '+nm+' dihapus',()=>{state.data.classes=state.data.classes.filter(x=>x.id!==id);
      Object.keys(state.data.schedule).forEach(day=>{Object.keys(state.data.schedule[day]).forEach(sl=>{
        if(state.data.schedule[day][sl].classId===id)delete state.data.schedule[day][sl];});});});break;}
  case 'stu-mode':modal.mode=d.m;renderModal();break;
  case 'stu-save':{
    if(modal.editId){if(!modal.name.trim()){showToast('Nama siswa tidak boleh kosong',{icon:'alert',tone:'red'});break;}
      const s=c.students.find(x=>x.id===modal.editId);s.name=modal.name.trim();s.nis=modal.nis.trim()||s.nis;
      closeModal();commit();showToast('Data siswa diperbarui',{icon:'user',tone:'green'});break;}
    const maxNis=Math.max(0,...c.students.map(s=>parseInt(s.nis)||0));let added=0;
    if(modal.mode==='single'){if(!modal.name.trim()){showToast('Isi nama siswa',{icon:'alert',tone:'red'});break;}
      c.students.push({id:uid(),name:modal.name.trim(),nis:modal.nis.trim()||String(maxNis+1)});added=1;}
    else{const lines=modal.bulk.split('\n').map(l=>l.trim()).filter(Boolean);
      if(!lines.length){showToast('Tempel minimal satu nama siswa',{icon:'alert',tone:'red'});break;}
      lines.forEach((line,i)=>{let name=line,nis='';const m=line.match(/^(.*?)[,;]\s*(\d+)\s*$/);
        if(m){name=m[1].trim();nis=m[2];}
        c.students.push({id:uid(),name,nis:nis||String(maxNis+1+i)});added++;});}
    closeModal();commit();showToast(added+' siswa ditambahkan ke '+c.name,{icon:'userPlus',tone:'green'});break;}
  case 'badge-type':modal.customType=d.v;renderModal();break;
  case 'badge-emoji':modal.emoji=d.e;renderModal();break;
  case 'badge-qp':modal.points=d.p;renderModal();break;
  case 'badge-submit':{if(!modal.label.trim()){showToast('Isi keterangan sikap / perilaku',{icon:'alert',tone:'red'});break;}
    const pts=Math.max(1,Math.min(100,Math.abs(Number(modal.points)||5)))*(modal.customType==='positive'?1:-1);
    const p={emoji:modal.emoji,label:modal.label.trim(),points:pts};
    if(modal.savePreset){D().quickBadges.push({id:uid(),emoji:p.emoji,label:p.label,shortLabel:p.label.slice(0,10),points:pts});
      if(D().quickBadges.length>10)D().quickBadges.shift();}
    const targets=badgeTargets();closeModal();applyBadge(p,targets);break;}
  case 'badge-preset':{const p=allPresets().find(x=>x.id===d.id);if(!p)break;
    let targets;
    if(modal&&modal.type==='badge')targets=badgeTargets();
    else targets=[d.sid];
    const wasModal=!!modal;if(wasModal)closeModal();
    applyBadge(p,targets);break;}
  case 'reset-confirm':{closeModal();
    undoable('Semua data dikembalikan ke contoh awal',()=>{state.data=seed();U().activeClassId=state.data.classes[0].id;U().nilaiFilter='all';animNext=true;},'refresh');break;}
  case 'toast-action':{const fn=toastState&&toastState.action&&toastState.action.fn;hideToast();if(fn)fn();break;}
  case 'toast-close':hideToast();break;
  }
}

/* ================= INPUTS ================= */
function handleInput(key,el){
  const v=el.value;
  switch(key){
  case 'search':U().search=v;persist();rerenderKeepFocus();break;
  case 'sim-time':{U().sim.time=fmtT(+v);const lb=$('#sim-time-label');if(lb)lb.textContent=U().sim.time;persist();refreshLive(true);break;}
  case 'sched-room':modal.room=v;break;
  case 'sched-note':modal.note=v;break;
  case 'ass-title':modal.title=v;break;
  case 'sess-date':modal.date=v;break;
  case 'sess-topic':modal.topic=v;break;
  case 'class-name':modal.name=v;break;
  case 'class-subject':modal.subject=v;break;
  case 'class-semester':modal.semester=v;break;
  case 'class-kkm':modal.kkm=v;break;
  case 'stu-name':modal.name=v;break;
  case 'stu-nis':modal.nis=v;break;
  case 'stu-bulk':modal.bulk=v;break;
  case 'badge-label':modal.label=v;break;
  case 'badge-points':{modal.points=v;const sp=$('#badge-submit-pts');
    if(sp)sp.textContent=(modal.customType==='positive'?'+':'-')+Math.abs(Number(v)||5);break;}
  case 'ak-note':modal.note=v;break;
  case 'cat-label':case 'cat-short':case 'cat-weight':{const cat=modal.cats.find(x=>x.id===el.dataset.id);if(!cat)break;
    if(key==='cat-label')cat.label=v;else if(key==='cat-short')cat.short=v.toUpperCase();
    else{cat.weight=Math.max(0,Math.min(100,Number(v)||0));
      const tt=$('#cat-total');const wrap=$('#cat-total-wrap');
      if(tt){const tot=totalWeight(modal.cats);tt.textContent=tot+'%';if(wrap){wrap.classList.toggle('ok',tot===100);wrap.classList.toggle('warn',tot!==100);}}
      el.value=cat.weight;}break;}
  case 'nc-label':modal.newCat.label=v;break;
  case 'nc-short':modal.newCat.short=v;break;
  case 'nc-weight':modal.newCat.weight=v;break;
  }
}
function handleChange(key,el){
  const v=el.value;const ck=el.checked;
  switch(key){
  case 'nilai-display':U().nilaiDisplay=v;lite();break;
  case 'siswa-sort':U().siswaSort=v;lite();break;
  case 'sim-day':U().sim.day=v;persist();renderView();refreshLive(true);break;
  case 'sched-class':{modal.classId=v;
    if(v&&!modal.room){outer:for(const day of Object.keys(D().schedule)){for(const sl of Object.keys(D().schedule[day])){
      const cc=D().schedule[day][sl];if(cc.classId===v&&cc.room){modal.room=cc.room;break outer;}}}}
    renderModal();break;}
  case 'sched-duration':modal.duration=+v;renderModal();break;
  case 'ass-cat':modal.category=v;break;
  case 'pm-start':{modal.work[modal.group].start=v||'07:00';if(modal.auto){recalcWork(modal.work[modal.group]);if(modal.sync)recalcWork(modal.work[modal.group==='mon'?'fri':'mon']);}renderModal();break;}
  case 'pm-dur':{modal.work[modal.group].jpDur=Math.max(15,Math.min(90,Number(v)||40));if(modal.auto){recalcWork(modal.work[modal.group]);if(modal.sync)recalcWork(modal.work[modal.group==='mon'?'fri':'mon']);}renderModal();break;}
  case 'pm-auto':modal.auto=ck;if(ck)recalcWork(modal.work[modal.group]);renderModal();break;
  case 'pm-sync':{modal.sync=ck;if(ck){const w=modal.work[modal.group];const other=modal.work[modal.group==='mon'?'fri':'mon'];mirrorOrder(w,other);if(modal.auto)recalcWork(other);}renderModal();break;}
  case 'row-start':case 'row-end':{const r=modal.work[modal.group].rows[+el.dataset.idx];if(!r)break;
    if(key==='row-start')r.start=v||r.start;else r.end=v||r.end;
    if(toMin(r.end)<=toMin(r.start))r.end=fmtT(toMin(r.start)+5);renderModal();break;}
  case 'cat-color':{const cat=modal.cats.find(x=>x.id===el.dataset.id);if(cat)cat.color=v;renderModal();break;}
  case 'nc-color':modal.newCat.color=v;break;
  case 'cat-all':modal.applyAll=ck;break;
  case 'kp-auto':modal.autoNext=ck;renderModal();break;
  case 'ak-auto':modal.autoNext=ck;break;
  case 'badge-savepreset':modal.savePreset=ck;break;
  case 'sel-check':{const id=el.dataset.id;const i=U().selected.indexOf(id);
    if(ck&&i<0)U().selected.push(id);else if(!ck&&i>=0)U().selected.splice(i,1);renderView();break;}
  }
}

/* ================= EVENTS ================= */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-action]');
  if(!el)return;
  handleAction(el.dataset.action,el,e);
});
document.addEventListener('input',e=>{const k=e.target.dataset&&e.target.dataset.input;if(k)handleInput(k,e.target);});
document.addEventListener('change',e=>{const k=e.target.dataset&&e.target.dataset.change;if(k)handleChange(k,e.target);});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&modal){closeModal();return;}
  if(!modal)return;
  if(e.target.matches('input,textarea,select'))return;
  if(modal.type==='keypad'){
    if(/^[0-9]$/.test(e.key)){handleAction('kp-digit',{dataset:{n:e.key}});e.preventDefault();}
    else if(e.key==='Backspace'){handleAction('kp-back',{dataset:{}});e.preventDefault();}
    else if(e.key==='Enter'){handleAction('kp-save',{dataset:{}});e.preventDefault();}
    else if(e.key==='ArrowRight')handleAction('kp-next',{dataset:{}});
    else if(e.key==='ArrowLeft')handleAction('kp-prev',{dataset:{}});
  }else if(modal.type==='attKeypad'){
    const k=e.key.toUpperCase();
    if(ST_ORDER.includes(k)){handleAction('ak-status',{dataset:{s:k}});e.preventDefault();}
    else if(e.key==='Enter'){handleAction('ak-save',{dataset:{}});e.preventDefault();}
  }
});
document.addEventListener('dragstart',e=>{
  const row=e.target.closest&&e.target.closest('.period-row');if(!row||!modal||modal.type!=='periods')return;
  dragIdx=+row.dataset.idx;row.classList.add('dragging');
  try{e.dataTransfer.setData('text/plain',String(dragIdx));e.dataTransfer.effectAllowed='move';}catch(err){}
});
document.addEventListener('dragover',e=>{
  const row=e.target.closest&&e.target.closest('.period-row');if(!row||dragIdx==null)return;
  e.preventDefault();row.classList.add('drop-hint');
});
document.addEventListener('dragleave',e=>{const row=e.target.closest&&e.target.closest('.period-row');if(row)row.classList.remove('drop-hint');});
document.addEventListener('drop',e=>{
  const row=e.target.closest&&e.target.closest('.period-row');if(!row||dragIdx==null||!modal||modal.type!=='periods')return;
  e.preventDefault();
  const to=+row.dataset.idx;const w=modal.work[modal.group];
  if(to!==dragIdx&&to>=0&&to<w.rows.length){
    const moved=w.rows.splice(dragIdx,1)[0];w.rows.splice(to,0,moved);
    if(modal.auto)recalcWork(w);
    if(modal.sync){const other=modal.work[modal.group==='mon'?'fri':'mon'];mirrorOrder(w,other);if(modal.auto)recalcWork(other);}
  }
  dragIdx=null;renderModal();
});
document.addEventListener('dragend',()=>{dragIdx=null;document.querySelectorAll('.period-row').forEach(r=>r.classList.remove('dragging','drop-hint'));});

/* ================= LIVE TICK ================= */
function updateClocks(){
  const n=new Date();const e=effNow();
  const txt=e.sim?e.time:pad2(n.getHours())+':'+pad2(n.getMinutes())+':'+pad2(n.getSeconds());
  document.querySelectorAll('[data-clock]').forEach(el=>{el.textContent=txt;});
}
function refreshLive(force){
  const info=liveInfo();const e=info.e;
  const sig=e.day+'|'+Math.floor(e.min)+'|'+(info.live?info.live.slot.id:'')+'|'+(info.brk?info.brk.slot.id:'')+'|'+info.count+'|'+(e.sim?'1':'0');
  if(force||sig!==lastSig){lastSig=sig;renderTopbar();renderDashDynamic();}
  if(info.live){
    document.querySelectorAll('[data-prog]').forEach(el=>{el.style.width=info.live.progressPercent+'%';});
    document.querySelectorAll('[data-prog-num]').forEach(el=>{el.textContent=info.live.progressPercent+'%';});
    document.querySelectorAll('[data-remain]').forEach(el=>{el.textContent=info.live.remainingMinutes;});
  }
}
setInterval(()=>{updateClocks();refreshLive(false);},1000);

/* ================= INIT ================= */
applyGrid();
fixActive();
renderAll();
refreshLive(true);
</script>
